const DEFAULT={title:'測驗計時器',animal:'恐龍',expected:30,absent:'',message:'測驗加油！仔細讀題，慢慢作答 🌿',courses:[{name:'英語',start:'08:45',end:'09:25'},{name:'自然',start:'09:35',end:'10:15'},{name:'國語',start:'10:30',end:'11:10'}],selected:2};let state;try{state={...DEFAULT,...JSON.parse(localStorage.getItem('forestQuizTimer2026')||'{}')}}catch{state={...DEFAULT}}if(!Array.isArray(state.courses)||!state.courses.length)state.courses=DEFAULT.courses;const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('forestQuizTimer2026',JSON.stringify(state));const timeToMin=s=>{const [h,m]=(s||'00:00').split(':').map(Number);return h*60+m};const formatSec=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');function draw(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('en-GB',{hour12:false});const c=state.courses[state.selected]||state.courses[0];if(!c)return;const start=timeToMin(c.start),end=timeToMin(c.end),nowM=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;const duration=Math.max(1,end-start);const remaining=Math.max(0,Math.ceil((end-nowM)*60));const pct=Math.max(0,Math.min(100,(end-nowM)/duration*100));$('title').textContent=state.title;document.body.dataset.theme=({'恐龍':'dino','小熊':'bear','熊貓':'panda','兔子':'rabbit','貓咪':'cat'}[state.animal]||'dino');const sprite=$('animalSprite');if(sprite.dataset.animal!==(state.animal||'恐龍')){sprite.src=ANIMAL_IMAGES[state.animal]||ANIMAL_IMAGES['恐龍'];sprite.dataset.animal=state.animal||'恐龍'}$('periodTag').textContent=`第 ${state.selected+1} 科 / 共 ${state.courses.length} 科`;$('subject').textContent=c.name;$('timeRange').textContent=c.start+' – '+c.end;$('message').textContent=nowM>=end?'今天的考試全部結束囉！辛苦了 🎉':state.message;$('timeleft').textContent=nowM<start?'尚未開始':nowM>=end?'本節已結束':formatSec(remaining);$('subleft').textContent=nowM<start?'等待考試開始':nowM>=end?'本節考試已結束':'距離本節結束';$('progressfill').style.width=pct+'%';$('progressbox').style.setProperty('--pct',pct+'%');$('startLabel').textContent=c.start;$('endLabel').textContent=c.end;$('percentLabel').textContent=Math.round(pct)+'%';$('expected').textContent=state.expected;const nums=[...new Set(String(state.absent||'').split(/[\s,，、;；]+/).map(x=>Number(x)).filter(x=>Number.isInteger(x)&&x>0&&x<=Number(state.expected)))].sort((a,b)=>a-b);$('present').textContent=Math.max(0,Number(state.expected)-nums.length);$('absentText').textContent=nums.length?'📝 '+nums.map(n=>n+' 號').join('、'):'🎉 全班到齊！';$('schedule').innerHTML='';state.courses.forEach((s,i)=>{const b=document.createElement('button');b.className='course'+(i===state.selected?' active':'');const phase=nowM<timeToMin(s.start)?'尚未開始':nowM>=timeToMin(s.end)?'已結束 ✅':'進行中 ⏳';const left=document.createElement('div');const a=document.createElement('div');a.className='cn';a.textContent=s.name;const t=document.createElement('div');t.className='ct';t.textContent=s.start+' – '+s.end;left.append(a,t);const tag=document.createElement('span');tag.className='status';tag.textContent=phase;b.append(left,tag);b.onclick=()=>{state.selected=i;save();draw()};$('schedule').append(b)})}function populate(){ $('fTitle').value=state.title;$('fAnimal').value=state.animal||'恐龍';$('fSelect').innerHTML='';state.courses.forEach((c,i)=>{let opt=document.createElement('option');opt.value=i;opt.textContent=(i+1)+'. '+c.name;$('fSelect').append(opt)});$('fSelect').value=state.selected;$('fExpected').value=state.expected;$('fAbsent').value=state.absent;$('fMessage').value=state.message;$('fCourses').value=state.courses.map(c=>[c.name,c.start,c.end].join(',')).join('\n');loadSelected()}function loadSelected(){let c=state.courses[Number($('fSelect').value)]||state.courses[0];$('fSubject').value=c.name;$('fStart').value=c.start;$('fEnd').value=c.end}function saveSettings(){const lines=$('fCourses').value.trim().split(/\n+/);const courses=lines.map(l=>l.split(/[,，\t]/).map(x=>x.trim())).filter(x=>x.length>=3).map(([name,start,end])=>({name,start,end}));if(!courses.length||courses.some(c=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(c.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(c.end)||timeToMin(c.end)<=timeToMin(c.start))){alert('請檢查排程格式：每行「科目,08:45,09:25」，結束時間需晚於開始時間。');return}state.courses=courses;state.selected=Math.min(Number($('fSelect').value),courses.length-1);state.title=$('fTitle').value||DEFAULT.title;state.animal=$('fAnimal').value;state.expected=Math.max(0,Math.min(200,Number($('fExpected').value)||0));state.absent=$('fAbsent').value;state.message=$('fMessage').value;save();$('overlay').classList.remove('open');draw()}$('settingsBtn').onclick=()=>{populate();$('overlay').classList.add('open')};$('fSelect').onchange=loadSelected;function updateSelectedLine(){let i=Number($('fSelect').value),rows=$('fCourses').value.split('\n');if(rows[i]!==undefined){rows[i]=[$('fSubject').value,$('fStart').value,$('fEnd').value].join(',');$('fCourses').value=rows.join('\n')}}['fSubject','fStart','fEnd'].forEach(id=>$(id).addEventListener('input',updateSelectedLine));$('cancelBtn').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('saveBtn').onclick=saveSettings;$('fsBtn').onclick=async()=>{if(!document.fullscreenElement){try{await document.documentElement.requestFullscreen()}catch(e){alert('無法啟動全螢幕，請按 F11。')}}else await document.exitFullscreen()};document.addEventListener('fullscreenchange',()=>$('fsBtn').textContent=document.fullscreenElement?'⛶ 離開全螢幕':'⛶ 全螢幕');draw();setInterval(draw,1000);
</script></body></html>
