function feedGrowth(type,id,now=Date.now()){
 const raw=type==="student"?st().roomFeeding?.[String(id)]:type==="teacher"?st().roomTeacherFeed:type==="pet"?st().classPetFeedings?.[String(id)]:null;
 const state=raw||{},until=Math.max(0,Number(state.until)||0);
 const limit=type==="pet"?10:3;
 const count=Math.min(limit,Math.max(0,Number(state.count)||0));
 return until>now?1+Math.min(1,(until-now)/3600000):1+count/limit;
}
function refreshFeedingGrowth(now=Date.now()){
 for(const m of movers)m.el.style.setProperty("--feed-growth",feedGrowth(m.type,m.id,now).toFixed(3));
}
function moveBounds(el){return {x:Math.max(0,$("stage").clientWidth-el.offsetWidth-5),y:Math.max(0,$("stage").clientHeight-el.offsetHeight-5)}}
function makeMover(id,name,img,type,icon){
 const el=document.createElement("button");el.type="button";el.className="walker "+type;
 let picture=document.createElement("img");picture.src=img;picture.alt=name;
 picture.onerror=()=>{const fallback=document.createElement("span");fallback.className="fallback";fallback.textContent=icon;picture.replaceWith(fallback)};
 el.appendChild(picture);
 const label=document.createElement("span");label.className="name";label.textContent=name;el.appendChild(label);
 el.dataset.id=String(id);el.dataset.type=type;
 el.onclick=()=>onPerson(type,id);
 const theta=Math.random()*Math.PI*2;
 const item={id,type,el,x:0,y:0,vx:Math.cos(theta),vy:Math.sin(theta)};
 return item;
}
function renderWalkers(){
 cancelAnimationFrame(frame);movers=[];
 const root=$("walkers");root.replaceChildren();
 const abs=new Set((st().attendance||[]).filter(x=>x.date===today()&&x.status==="缺席").map(x=>String(x.sid)));
 const ppl=(st().students||[]).filter(x=>!abs.has(String(x.id)));
 const pet=getPet();
 const count=ppl.length+1+(pet?1:0);
 const stage=$("stage");const cols=Math.max(1,Math.ceil(Math.sqrt(count*stage.clientWidth/Math.max(1,stage.clientHeight))));
 const rows=Math.ceil(count/cols);const scale=Math.min(1,Math.max(.4,Math.min(stage.clientWidth/cols/103,stage.clientHeight/rows/112)));
 stage.style.setProperty("--walker-w",Math.round(86*scale)+"px");stage.style.setProperty("--walker-img",Math.round(70*scale)+"px");
 ppl.forEach(p=>movers.push(makeMover(p.id,p.no+" "+p.name,p.avatar?avatarPath(p.avatar):"./avatars/girl-1.svg","student","🙂")));
 movers.push(makeMover("__teacher__","👩‍🏫 老師","./fundesk-rps-teacher.webp","teacher","👩‍🏫"));
 if(pet){
  const w=makeMover(pet.id,pet.emoji+" "+pet.name,petPath(pet.id),"pet",pet.emoji);
  const prog=Math.max(0,Math.min(99,Number(st().classPetProgress&&st().classPetProgress[pet.id]&&st().classPetProgress[pet.id].points)||0));
  const bar=document.createElement("div");bar.className="meter";bar.innerHTML='<span><i style="width:'+prog+'%"></i></span>'+prog+'/100';w.el.insertBefore(bar,w.el.firstChild);movers.push(w);
 }
 movers.forEach((m,i)=>{root.appendChild(m.el);const bounds=moveBounds(m.el);m.x=(i%cols)/Math.max(1,cols-1)*bounds.x;m.y=Math.floor(i/cols)/Math.max(1,rows-1)*bounds.y;m.el.style.transform="translate("+m.x+"px,"+m.y+"px)"});
 refreshFeedingGrowth();last=0;frame=requestAnimationFrame(tick);
}
let lastGrowthUpdate=0;
function tick(t){
 const dt=Math.min(.06,Math.max(0,(t-(last||t))/1000));last=t;
 if(t-lastGrowthUpdate>=1000){refreshFeedingGrowth();lastGrowthUpdate=t;}
 if(!paused){
  const pace=({slow:18,medium:42,fast:72}[$("speed").value]||42);
  for(const m of movers){const box=moveBounds(m.el);m.x+=m.vx*pace*dt;m.y+=m.vy*pace*dt;
   if(m.x<0){m.x=0;m.vx=Math.abs(m.vx)}if(m.x>box.x){m.x=box.x;m.vx=-Math.abs(m.vx)}
   if(m.y<0){m.y=0;m.vy=Math.abs(m.vy)}if(m.y>box.y){m.y=box.y;m.vy=-Math.abs(m.vy)}
   m.el.style.transform="translate3d("+m.x+"px,"+m.y+"px,0)";
  }
 }
 frame=requestAnimationFrame(tick);
}
function personalHistory(type,id){
 const entries=st().roomFeedingLog||[];
 const received=e=>type==="student"?e.kind!=="teacher"&&e.kind!=="pet"&&String(e.sid)===String(id):type==="teacher"?e.kind==="teacher":e.kind==="pet"&&String(e.pet)===String(id);
 const given=e=>type==="student"?String(e.feederSid)===String(id):type==="teacher"?e.feederSid==="__teacher__":false;
 const target=e=>e.kind==="pet"?"🐾 "+(ROOM_PETS.find(p=>p.id===e.pet)?.name||e.name||"班寵"):e.kind==="teacher"?"👩‍🏫 老師":e.name||"學生";
 const row=(e,own)=>{
  const food=ROOM_FOODS.find(f=>f.id===e.food);
  const date=new Date(Number(e.at)||0),time=Number.isFinite(date.getTime())?date.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
  return '<div class="entry"><b>'+esc(own?"餵了 "+target(e):"由 "+(e.feederName||"未記錄餵食者")+" 餵食")+'</b> · '+esc((food?.emoji||"🍽️")+" "+(food?.name||e.food||"食物"))+'<br><small>'+esc(time)+'</small></div>';
 };
 const receivedItems=entries.filter(received).slice(-40).reverse(),givenItems=entries.filter(given).slice(-40).reverse();
 return '<section class="personalHistory"><h3>📋 餵食紀錄</h3><div class="historyColumns"><div><h4>🍽️ '+(type==="pet"?"誰餵過我":"誰餵食自己")+'</h4><div class="historyScroll">'+(receivedItems.map(e=>row(e,false)).join("")||'<div class="empty">沒有被餵食紀錄</div>')+'</div></div><div><h4>🎁 我餵過誰</h4><div class="historyScroll">'+(givenItems.map(e=>row(e,true)).join("")||'<div class="empty">'+(type==="pet"?"班寵沒有餵別人的紀錄":"沒有餵食他人的紀錄")+'</div>')+'</div></div></div></section>';
}
function openSpecialCard(type){
 const pet=getPet();if(type==="pet"&&!pet)return;
 openModal(type==="teacher"?"👩‍🏫 老師":pet.emoji+" "+pet.name,personalHistory(type,type==="pet"?pet.id:"__teacher__")+(type==="teacher"?'<section><button id="teacherFeedFromCard" class="btn primary">🔐 老師餵食（輸入動態教室密碼）</button></section>':""));
 if(type==="teacher")$("teacherFeedFromCard").onclick=async()=>{await activateTeacher();if(actor&&actor.type==="teacher")closeModal()};
}
function openModal(title,body){$("modalTitle").textContent=title;$("modalContent").innerHTML=body;$("modal").hidden=false}
function closeModal(){$("modal").hidden=true}
function onPerson(type,id){
 if(foodId&&actor){choice={type,id};document.querySelectorAll(".walker").forEach(m=>m.classList.toggle("chosen",m.dataset.type===type&&m.dataset.id===String(id)));feed();return}
 if(type==="teacher"||type==="pet"){openSpecialCard(type);return}
 openStudent(id);
}
function openStudent(id){
 const p=st().students.find(x=>String(x.id)===String(id));if(!p)return;
 openModal(p.no+" 號 · "+p.name,'<section><h3>🎟️ 我的餵食券</h3><p>剩餘 <strong>'+tickets(id)+'</strong> 張</p><button class="btn primary" id="useTicket" '+(tickets(id)<1?"disabled":"")+'>🎟️ 使用一張餵食券</button><p class="hint">餵食成功才扣券，每張可餵一次。</p></section><section><button class="btn" id="unlockAvatar">🔒 更換頭像（動態教室密碼）</button><div id="avatarChoices" hidden class="options"></div></section>'+personalHistory("student",id));
 $("useTicket").onclick=()=>{if(tickets(id)<1)return;actor={type:"student",sid:String(id),name:p.name};foodId=null;renderFoods();closeModal();setStatus("🎟️ 已選 "+p.name+" 的餵食券，請選食物及餵食對象。")};
 $("unlockAvatar").onclick=async()=>{const area=$("avatarChoices");if(!area.hidden){area.hidden=true;return}
 const key=prompt("請輸入動態教室密碼");if(key===null)return;
 try{await rpc("fundesk_student_room_action",{p_token:token,p_action:"check_password",p_passcode:key});}catch(e){alert("密碼驗證失敗："+e.message);return}
 area.hidden=false;area.innerHTML=STUDENT_AVATARS.map(x=>'<button type="button" data-avatar="'+esc(x[0])+'"><img src="'+esc(avatarPath(x[0]))+'" alt=""><small>'+esc(x[1])+'</small></button>').join("")+'<button id="clearAvatar" class="btn">不使用頭像</button>';
 area.querySelectorAll("[data-avatar]").forEach(b=>b.onclick=async()=>{if(await action("avatar",{p_feeder:String(id),p_avatar:b.dataset.avatar,p_passcode:key})){closeModal();setStatus("已更新學生頭像")}});
 $("clearAvatar").onclick=async()=>{if(await action("avatar",{p_feeder:String(id),p_avatar:null,p_passcode:key})){closeModal();setStatus("已清除學生頭像")}};
 };
}
async function activateTeacher(){
 const key=prompt("請輸入動態教室密碼（老師餵食）");if(key===null)return;
 try{await rpc("fundesk_student_room_action",{p_token:token,p_action:"check_password",p_passcode:key});}catch(e){setStatus("動態教室密碼錯誤");return}
 actor={type:"teacher",sid:"__teacher__",name:"老師",passcode:key};foodId=null;renderFoods();setStatus("👩‍🏫 已選老師餵食，請選食物與餵食對象；成功時驗證密碼。");
}
function renderFoods(){
 $("foodShelf").innerHTML='<div class="foodShelfTitle">🍽️ 餵食小站</div>'+ROOM_FOODS.map(x=>'<button type="button" class="food '+(foodId===x.id?"sel":"")+'" data-food="'+x.id+'"><span class="emoji">'+x.emoji+'</span>'+esc(x.name)+'</button>').join("");
 $("foodShelf").querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{if(!actor){setStatus("請先點學生使用餵食券，或點老師輸入密碼。");return}foodId=b.dataset.food;renderFoods();setStatus("已選 "+ROOM_FOODS.find(f=>f.id===foodId).name+"，請點選想餵的對象。")});
}
async function feed(){
 if(!actor||!foodId||!choice){setStatus("請先選餵食者與食物。");return}
 const a=actor,t=choice,food=ROOM_FOODS.find(x=>x.id===foodId);if(!food)return;
 if(a.type==="teacher"&&t.type==="teacher"){setStatus("老師不可餵自己");return}
 if(!confirm(a.name+" 使用 "+food.name+" 餵 "+(t.type==="teacher"?"老師":t.type==="pet"?(getPet()||{}).name:(st().students.find(x=>String(x.id)===String(t.id))||{}).name)+"，確定嗎？"))return;
 const done=await action("feed",{p_feeder:a.sid,p_target_type:t.type,p_target_id:String(t.id),p_food:food.id,p_passcode:a.type==="teacher"?a.passcode:null});
 if(done){actor=null;foodId=null;choice=null;renderFoods();setStatus("🍽️ 餵食成功，已同步餵食紀錄與餵食券。")}
}
$("modalClose").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};
$("reload").onclick=async()=>{if(busy)return;try{await load();setStatus("已同步最新資料")}catch(e){setSync("⚠️ 同步失敗",true);alert(e.message)}};

$("sceneSelect").onchange=()=>{$("stage").className="stage scene-"+$("sceneSelect").value};
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"▶ 繼續":"⏸ 暫停"};
$("fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $("app").requestFullscreen()}catch(e){setStatus("瀏覽器不支援自動進入全螢幕，可使用 F11。")}};
document.addEventListener("fullscreenchange",()=>{$("fullscreen").textContent=document.fullscreenElement?"⛶ 退出全螢幕":"⛶ 全螢幕"});
window.addEventListener("resize",()=>{if(data)renderWalkers()});
renderFoods();
load().then(()=>{$("login").hidden=true}).catch(err=>{$("login").hidden=false;$("loginForm").innerHTML='<h2>⚠️ 無法載入學生端動態教室</h2><p>'+esc(err.message)+'</p><p class="hint">請通知科任老師在 Supabase SQL Editor 執行 student-classroom-setup.sql，並在 FunDesk 聯絡簿啟用學生動態教室。</p><button class="btn" type="button" onclick="location.reload()">重新整理</button>'});
})();
</script></body></html>
