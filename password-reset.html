<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FunDesk 重設密碼</title><style>body{font:18px system-ui;background:#e7f4ef;padding:30px}main{max-width:480px;margin:6vh auto;background:white;padding:30px;border-radius:18px}input,button{display:block;width:100%;box-sizing:border-box;padding:13px;margin:12px 0;font:inherit}button{background:#236e54;color:white;border:0;border-radius:8px}p{line-height:1.6}</style></head><body><main><h1>🔐 FunDesk 密碼重設</h1><p id="info">正在確認重設連結…</p><form id="reset" hidden><label>新密碼（至少 12 字元）<input id="password" type="password" minlength="12" required autocomplete="new-password"></label><label>確認新密碼<input id="confirm" type="password" minlength="12" required autocomplete="new-password"></label><button>儲存新密碼</button></form><p><a href="./index.html">返回 FunDesk 登入</a></p></main><script>(()=>{'use strict';const url="https://ayvwsexnxvjjcrbtyoof.supabase.co",key="sb_publishable_Z2rS84mJC4BK-h4oLsNNjw_CdQz240L";const q=new URLSearchParams(location.hash.slice(1)),t=q.get('access_token'),type=q.get('type'),info=document.getElementById('info'),form=document.getElementById('reset');if(!t||type!=='recovery'){info.textContent='請從最新的密碼重設郵件進入此頁。';return}history.replaceState(null,'',location.pathname);info.textContent='連結已接收，請輸入新密碼。';form.hidden=false;form.onsubmit=async(e)=>{e.preventDefault();const pw=document.getElementById('password').value;if(pw.length<12||pw!==document.getElementById('confirm').value){info.textContent='密碼至少 12 字元，且兩次輸入必須相同。';return}const button=form.querySelector('button');button.disabled=true;info.textContent='正在更新密碼…';try{const res=await fetch(url+'/auth/v1/user',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({password:pw}),cache:'no-store'});if(!res.ok){const detail=await res.json().catch(()=>({}));throw Error(detail.message||'密碼更新失敗')}form.reset();form.hidden=true;info.textContent='✅ 密碼已更新，請返回 FunDesk 使用新密碼登入。'}catch(err){info.textContent='更新失敗：'+err.message}finally{button.disabled=false}}})();</script></body></html>
