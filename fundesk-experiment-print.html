<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FunDesk 實驗工作分配表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf5ed;color:#213a2c;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}.toolbar{max-width:1100px;margin:22px auto;padding:20px;background:white;border-radius:15px;box-shadow:0 2px 15px #0001}.toolbar h1{margin:0 0 8px}.toolbar p{font-size:14px}.fields{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}label{display:block;font-weight:bold}input,textarea,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #aaa;width:100%}button{width:auto;background:#236342;color:white;border:0;cursor:pointer;font-weight:bold}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}textarea{font:12px/1.6 monospace;height:120px}.sheet{width:275mm;min-height:180mm;background:white;margin:15px auto;padding:10mm;break-after:page;box-shadow:0 1px 12px #0002}.sheet h2{text-align:center;font-size:25px;margin:0 0 18px}.meta{display:flex;justify-content:space-between;gap:15px;font-size:18px}.group{font-size:21px;font-weight:bold;margin:17px 0}.work{border-collapse:collapse;width:100%;table-layout:fixed}.work td,.work th{border:2px solid #222;text-align:center;padding:10px 3px;overflow-wrap:anywhere}.work th{background:#edf4ee;font-size:19px}.work .label{width:68px;font-weight:bold;background:#f2f2f2}.work .desc{height:95px;font-size:16px;vertical-align:middle}.work .person,.work .seat{height:56px;font-size:20px}.notes{border:2px solid #222;margin-top:20px;padding:12px;font-size:19px;min-height:100px}.status{font-size:14px}.groupPicker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.groupPicker select{width:auto;min-width:220px}.groupPicker strong{font-size:17px}.sheet[hidden]{display:none!important}.empty{text-align:center;margin:60px}@media print{@page{size:A4 landscape;margin:8mm}body{background:white}.toolbar,.empty{display:none}.sheet{width:100%;margin:0;box-shadow:none;min-height:0;padding:2mm;page-break-after:always}.sheet:last-child{page-break-after:auto}.work .desc{height:75px}}@media(max-width:900px){.fields{grid-template-columns:1fr}.toolbar{margin:8px}.sheet{transform-origin:top left}}
</style></head><body><section class="toolbar"><h1>🔬 FunDesk 實驗工作分配表</h1><p>每組獨立一頁，五人組自動取消器材長 B。可由 FunDesk 主程式傳入分組資料，或貼上 JSON 匯入。</p>
<div class="fields"><label>日期<input id="date" type="date"></label><label>班級<input id="cls" placeholder="五年一班"></label><label>實驗項目<input id="exp" placeholder="輸入實驗名稱"></label></div>
<div class="buttons"><button id="load">讀取 FunDesk 本機分組</button><button id="print">🖨️ 列印目前選擇</button><button id="demo">示範資料</button><button id="apply">套用下方資料</button></div><div class="groupPicker"><strong>預覽／列印：</strong><select id="groupSelect" aria-label="選擇組別"><option value="all">全部組別（每組一頁）</option></select><button id="prev" type="button">◀ 上一組</button><button id="next" type="button">下一組 ▶</button></div><div class="status" id="status"></div>
<label>分組 JSON（可編輯）<textarea id="json" placeholder='{"groups":[{"number":1,"members":[{"seat":1,"name":"學生甲","role":"組長"}]}]}'></textarea></label>
<p>主程式可透過 <code>window.FunDeskExperimentPrint.setData(data,meta)</code> 或同網域 <code>postMessage</code> 傳入。</p></section><main id="pages"></main>
<script>
(()=>{'use strict';
const $=s=>document.getElementById(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles=['組長','副組長','習作長','器材長A','器材長B','清潔長'];
const jobs=['指揮實驗流程','管理秩序','檢查全組習作是否完成，繳交整組習作','領取、清洗及歸還器材','領取、清洗及歸還器材','指揮打掃工作：擦桌子、撿垃圾、檢查抽屜'];
let data={groups:Array.from({length:5},(_,i)=>({number:i+1,members:[]}))};$('date').value=new Date().toLocaleDateString('en-CA');
function role(s){s=String(s||'').replace(/\s/g,'');if(s.includes('副組長'))return '副組長';if(s.includes('組長'))return '組長';if(s.includes('習作'))return '習作長';if(s.includes('清潔'))return '清潔長';if(s.includes('器材')&&/(歸還|B|2|２)/i.test(s))return '器材長B';if(s.includes('器材'))return '器材長A';return s}
function normalize(x){if(typeof x==='string')x=JSON.parse(x);let gs=Array.isArray(x)?x:(x.groups||x.experimentGroups||x.experiment_groups||x.data?.groups||[]);if(!Array.isArray(gs))throw Error('缺少 groups 陣列');return {groups:gs.map((g,i)=>{let m=Array.isArray(g)?g:(g.members||g.students||g.assignments||[]);return {number:g.number??g.groupNumber??g.group??(i+1),members:m.map((a,j)=>typeof a==='object'?{seat:a.seat??a.seatNo??a.seat_no??a.no??a.座號??'',name:a.name??a.studentName??a.姓名??'',role:role(a.role??a.job??a.task??a.職務??roles[j])}:{seat:'',name:String(a),role:roles[j]})}})}}
function page(g){const five=g.members.length===5,cols=roles.filter(r=>!(five&&r==='器材長B')),used=new Set(),items={};
cols.forEach(r=>{let idx=g.members.findIndex((p,i)=>!used.has(i)&&p.role===r);if(idx>=0){used.add(idx);items[r]=g.members[idx]}});return `<section class="sheet"><h2>自然科學實驗工作分配表</h2><div class="meta"><span>日期：${esc($('date').value)}</span><span>班級：${esc($('cls').value)}</span><span>實驗項目：${esc($('exp').value)}</span></div><div class="group">組別：第 ${esc(g.number)} 組</div><table class="work"><tr><th class="label">職務</th>${cols.map(r=>`<th>${esc(r)}</th>`).join('')}</tr><tr><td class="label">工作內容</td>${cols.map(r=>`<td class="desc">${esc(jobs[roles.indexOf(r)])}</td>`).join('')}</tr><tr><td class="label">姓名</td>${cols.map(r=>`<td class="person">${esc(items[r]?.name)}</td>`).join('')}</tr><tr><td class="label">座號</td>${cols.map(r=>`<td class="seat">${esc(items[r]?.seat)}</td>`).join('')}</tr></table><p style="font-size:17px"><strong>本組成員（核對座號與姓名）：</strong> ${g.members.map(p=>esc(p.seat)+" 號 "+esc(p.name)).join("、")}</p><div class="notes">不守秩序（登記座號）：</div></section>`}
function render(){const sel=$('groupSelect'),old=sel.value;sel.innerHTML='<option value="all">全部組別（每組一頁）</option>'+data.groups.map((g,i)=>'<option value="'+i+'">第 '+esc(g.number)+' 組（單張）</option>').join('');sel.value=[...sel.options].some(o=>o.value===old)?old:'all';$('pages').innerHTML=data.groups.length?data.groups.map((g,i)=>page(g).replace('<section class="sheet">','<section class="sheet" data-group-index="'+i+'">')).join(''):'<p class="empty">沒有組別資料。</p>';applySelection();}
function applySelection(){const v=$('groupSelect').value;document.querySelectorAll('.sheet').forEach((el,i)=>{el.hidden=v!=='all'&&v!==String(i)});$('status').textContent='目前 '+data.groups.length+' 組；'+(v==='all'?'顯示全部，每組獨立列印一頁':'只顯示第 '+data.groups[Number(v)]?.number+' 組，列印一張')+'。';}
function setData(x,meta={}){data=normalize(x);$('cls').value=meta.className??x.className??x.class_name??$('cls').value;$('exp').value=meta.experiment??x.experiment??$('exp').value;$('date').value=meta.date??x.date??$('date').value;$('json').value=JSON.stringify(data,null,2);render()}
window.FunDeskExperimentPrint={setData};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='FUNDESK_EXPERIMENT_GROUPS')return;try{setData(e.data.payload,e.data.meta||{})}catch(err){$('status').textContent=err.message}});
$('apply').onclick=()=>{try{setData(JSON.parse($('json').value))}catch(e){$('status').textContent=e.message}};
$('demo').onclick=()=>setData({groups:[{number:1,members:roles.map((r,i)=>({name:'學生'+(i+1),seat:i+1,role:r}))},{number:2,members:['組長','副組長','習作長','器材長A','清潔長'].map((r,i)=>({name:'學生'+(i+7),seat:i+7,role:r}))}]},{className:'五年一班',experiment:'實驗示範'});
$('groupSelect').onchange=applySelection;
function moveGroup(direction){const sel=$('groupSelect');const current=sel.value==='all'?(direction>0?-1:0):Number(sel.value);sel.value=String(Math.max(0,Math.min(data.groups.length-1,current+direction)));applySelection()}
$('prev').onclick=()=>moveGroup(-1);$('next').onclick=()=>moveGroup(1);
$('print').onclick=()=>data.groups.length?window.print():alert('請先載入分組資料');
$('load').onclick=()=>{let best=null;for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!/fundesk|experiment|group|teacher/i.test(key))continue;try{const obj=JSON.parse(localStorage.getItem(key));for(const v of [obj,obj?.experimentGroups,obj?.experiment_groups,obj?.data?.experimentGroups]){if(!v)continue;const n=normalize(v);if(n.groups.length&&(!best||n.groups.length>best.count))best={value:v,count:n.groups.length,key}}}catch{}}if(best){setData(best.value);$('status').textContent=`本機讀取 ${best.key}，請核對是否為當前班級。`}else $('status').textContent='未找到可辨識的本機分組資料，需由 FunDesk 主程式整合傳入或貼上 JSON。'};
['date','cls','exp'].forEach(id=>$(id).addEventListener('input',render));try{if(window.opener?.FunDeskExperimentPrintData)setData(window.opener.FunDeskExperimentPrintData)}catch{}render();
})();
</script></body></html>
