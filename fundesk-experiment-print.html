<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FunDesk｜各組實驗工作分配表</title>
<style>
:root{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:#244233;background:#eff6ef}
*{box-sizing:border-box}
body{margin:0}
.top{max-width:1120px;margin:18px auto 12px;background:#fff;padding:14px 18px;border-radius:16px;box-shadow:0 4px 18px #214a3520}
.board{background:#20523f;border:6px solid #ba9162;color:white;border-radius:13px;padding:13px 19px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.board h1{font-size:clamp(20px,2.4vw,29px);margin:0 0 5px}
.board small{color:#d7f3df;font-size:14px}
.pet{font-size:39px;flex-shrink:0}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px}
.actions select,.actions button{font:inherit;font-size:16px;border-radius:10px;padding:10px 13px}
.actions select{border:1px solid #b6cdb9;min-width:190px;background:white}
.actions button{border:0;background:#276747;color:#fff;font-weight:800;cursor:pointer}
.actions button.secondary{background:#e9f4ed;color:#276747}
.actions button:disabled{opacity:.45;cursor:not-allowed}
#status{color:#577261;font-size:14px}
#pages{max-width:1120px;margin:0 auto 22px}
.sheet{width:100%;background:white;min-height:540px;margin:16px 0;padding:30px 34px;border:1px solid #ccdfd0;border-radius:10px;box-shadow:0 3px 13px #1e4e2c20;break-after:page}
.sheet[hidden]{display:none!important}
.sheet h2{background:#245941;border:5px solid #ba9261;color:white;margin:0 0 19px;border-radius:11px;padding:13px 16px;display:flex;justify-content:space-between;font-size:24px;align-items:center;gap:10px}
.sheet h2 span{font-size:27px}
.meta{display:grid;grid-template-columns:1.1fr 1fr 2fr;gap:8px;margin-bottom:15px;font-size:18px;font-weight:700}
.meta div{border-bottom:2px solid #8cb69b;padding:7px 6px}
.group{font-size:22px;font-weight:900;padding:9px 13px;background:#eaf5ec;border-left:7px solid #40885d;margin-bottom:14px}
.work{width:100%;border-collapse:collapse;table-layout:fixed}
.work th,.work td{border:2px solid #39513e;padding:9px 5px;text-align:center;overflow-wrap:anywhere}
.work .rowhead{width:80px;background:#e9f1e8;font-weight:900;font-size:17px}
.work th{background:#e2f1e6;font-size:17px}
.work td.detail{height:96px;font-size:16px;line-height:1.5}
.work td.person{height:54px;font-size:20px;font-weight:800}
.work td.seat{height:43px;font-size:19px}
.note{border:2px dashed #476e51;border-radius:8px;margin-top:17px;padding:11px 15px;min-height:90px;font-size:18px;font-weight:700}
.empty{background:#fff;border-radius:15px;padding:45px 28px;text-align:center;color:#55745d;font-size:19px;line-height:1.8}
@page{size:A4 landscape;margin:9mm}
@media print{
html,body{background:white}
.top,.empty{display:none!important}
#pages{max-width:none;margin:0}
.sheet{width:100%;min-height:0;box-shadow:none;border:0;border-radius:0;padding:0;margin:0;page-break-after:always;break-after:page}
.sheet:last-of-type{page-break-after:auto;break-after:auto}
.sheet h2{color:#1e4c35;background:#fff;border:2px solid #315b3d;padding:9px 13px;print-color-adjust:exact}
.sheet .meta{font-size:16px;margin-bottom:11px}
.sheet .group{font-size:19px;padding:6px 11px}
.work th,.work td{padding:6px 4px}
.work td.detail{height:73px;font-size:14px}
.work td.person{height:44px;font-size:18px}
.work td.seat{height:35px;font-size:17px}
.note{min-height:60px;font-size:16px}
}
@media(max-width:760px){.top{margin:8px}.sheet{min-width:730px}.sheet h2{font-size:20px}#pages{overflow-x:auto}.meta{font-size:14px}}
</style>
</head>
<body>
<header class="top">
<div class="board"><div><h1>🔬 實驗工作分配表</h1><small id="subtitle">FunDesk · 小小科學家合作任務</small></div><div class="pet" aria-hidden="true">🐾🐼</div></div>
<div class="actions">
<label for="groupSelect">預覽組別</label>
<select id="groupSelect" disabled><option value="all">全部組別（每組一張）</option></select>
<button id="prev" class="secondary" disabled>◀ 上一組</button>
<button id="next" class="secondary" disabled>下一組 ▶</button>
<button id="print" disabled>🖨️ 列印</button>
<span id="status" role="status"></span>
</div>
</header>
<main id="pages"><div class="empty" id="empty">請從 FunDesk 各班的「實驗工作分配」，選定實驗後按「列印各組單張（A4）」。<br>系統會自動帶入該次實驗的資料。</div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const roles=['組長','副組長','習作長','器材長A','器材長B','清潔長'];
const jobs=['指揮實驗流程','管理秩序','檢查全組習作是否完成，繳交整組習作','領取、清洗及歸還器材','領取、清洗及歸還器材','指揮打掃工作：擦桌子、撿垃圾、檢查抽屜'];
let sheetData=null;
const normalizeRole=v=>{
 const r=String(v||'').replace(/\s/g,'');
 if(r.includes('副組長'))return '副組長';
 if(r.includes('組長'))return '組長';
 if(r.includes('習作'))return '習作長';
 if(r.includes('清潔'))return '清潔長';
 if(r.includes('器材')&&/(歸還|B|2|２)/i.test(r))return '器材長B';
 if(r.includes('器材'))return '器材長A';
 return r;
};
function setData(payload,meta={}){
 const groups=payload?.groups;
 if(!Array.isArray(groups)||!groups.length)throw Error('這項實驗沒有可列印的分組資料。');
 sheetData={groups:groups.map((g,i)=>({
  number:g.number??i+1,
  members:(Array.isArray(g.members)?g.members:[]).map(m=>({
   seat:m.seat??m.no??'',name:m.name??'',role:normalizeRole(m.role)
  }))
 })),meta};
 const picker=$('groupSelect');picker.innerHTML='<option value="all">全部組別（每組一張）</option>'+sheetData.groups.map((g,i)=>'<option value="'+i+'">第 '+esc(g.number)+' 組</option>').join('');
 picker.value='all';
 picker.disabled=false;$('prev').disabled=false;$('next').disabled=false;$('print').disabled=false;
 $('subtitle').textContent=[meta.className,meta.experiment,meta.date].filter(Boolean).join(' · ');
 render();
}
function section(g){
 const count=g.members.length;
 const cols=roles.filter(r=>!(count===5&&r==='器材長B'));
 const assigned=Object.fromEntries(cols.map(r=>[r,g.members.find(m=>m.role===r)]));
 const cells=(className,fn)=>cols.map(r=>'<td class="'+className+'">'+fn(assigned[r])+'</td>').join('');
 const m=sheetData.meta;
 return '<section class="sheet"><h2><span>🔬</span>自然科學實驗工作分配表<span>🐾</span></h2>'
 +'<div class="meta"><div>日期：'+esc(m.date||'')+'</div><div>班級：'+esc(m.className||'')+'</div><div>實驗項目：'+esc(m.experiment||'')+'</div></div>'
 +'<div class="group">第 '+esc(g.number)+' 組</div>'
 +'<table class="work"><tr><th class="rowhead">職務</th>'+cols.map(r=>'<th>'+esc(r)+'</th>').join('')+'</tr>'
 +'<tr><td class="rowhead">工作內容</td>'+cols.map(r=>'<td class="detail">'+esc(jobs[roles.indexOf(r)])+'</td>').join('')+'</tr>'
 +'<tr><td class="rowhead">姓名</td>'+cells('person',m=>esc(m?.name||''))+'</tr>'
 +'<tr><td class="rowhead">座號</td>'+cells('seat',m=>esc(m?.seat||''))+'</tr></table>'
 +'<div class="note">不守秩序（登記座號）：</div></section>';
}
function render(){
 if(!sheetData)return;
 const selected=$('groupSelect').value;
 const active=selected==='all'?sheetData.groups:sheetData.groups.filter((g,i)=>String(i)===selected);
 $('pages').innerHTML=active.map(section).join('');
 $('status').textContent=selected==='all'?'全部 '+sheetData.groups.length+' 組，每組一頁':'第 '+active[0]?.number+' 組，單獨一頁';
}
$('groupSelect').onchange=render;
function move(delta){const sel=$('groupSelect'),n=sheetData?.groups.length||0;if(!n)return;const current=sel.value==='all'?(delta>0?-1:0):Number(sel.value);sel.value=String(Math.max(0,Math.min(n-1,current+delta)));render()}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('print').onclick=()=>sheetData&&window.print();
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.opener||event.data?.type!=='FUNDESK_EXPERIMENT_GROUPS')return;
 try{setData(event.data.payload,event.data.meta||{})}catch(err){$('pages').innerHTML='<div class="empty">'+esc(err.message)+'</div>';}
});
window.FunDeskExperimentPrint={setData};
try{if(window.opener&&window.opener!==window)window.opener.postMessage({type:'FUNDESK_EXPERIMENT_PRINT_READY'},location.origin)}catch{}
})();
</script>
</body>
</html>
