<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FunDesk 五年二班聯絡簿</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../../contact-pwa-icon.svg"><meta name="theme-color" content="#eef8ff"><style>*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font:16px system-ui,sans-serif;background:#eef8ff;color:#274337}header{padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:7px 12px;border:1px solid #a7cbb4;border-radius:10px;background:white;color:#245a3c;cursor:pointer}iframe{flex:1;width:100%;border:0;background:#fff}p{padding:12px}[hidden]{display:none!important}</style></head><body><header><b>📒 五年二班聯絡簿</b><button id="install">安裝聯絡簿</button><button id="forget">清除此電腦的聯絡簿連結</button><span id="status" role="status"></span></header><p id="empty" hidden>尚未設定班級連結。請從原本的班級聯絡簿點選「安裝本班聯絡簿」。</p><iframe id="book" title="五年二班聯絡簿" referrerpolicy="no-referrer" hidden></iframe><script>
const key='fundesk-notebook-launch-v2:502', valid=t=>/^[0-9a-f]{64}$/.test(t||'');let token='',promptEvent=null;const el=id=>document.getElementById(id);const incoming=location.hash.slice(1);
try{if(valid(incoming)){localStorage.setItem(key,incoming);token=incoming}else token=localStorage.getItem(key)||''}catch(e){token=valid(incoming)?incoming:'';el('status').textContent='瀏覽器禁止儲存連結，重新啟動後可能需要重新設定。'}
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
function show(){el('empty').hidden=valid(token);el('book').hidden=!valid(token);if(valid(token)){const url=new URL('../../contact.html',location.href);url.searchParams.set('t',token);el('book').src=url.href}else el('book').removeAttribute('src')}
show();
const standalone=matchMedia('(display-mode: standalone)').matches;el('install').hidden=standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;el('install').hidden=standalone});
window.addEventListener('appinstalled',()=>{el('install').hidden=true;promptEvent=null});
el('install').onclick=async()=>{if(!valid(token)){alert('請先設定班級連結');return}if(promptEvent){const p=promptEvent;promptEvent=null;await p.prompt();return}alert('請確認目前在一般 Edge 瀏覽器，使用網址列安裝圖示，或右上角 ⋯ → 應用程式 → 安裝此網站。安裝視窗應顯示「五年二班聯絡簿」，若顯示自然科教學主程式請取消。')};
el('forget').onclick=()=>{if(!confirm('清除本機連結？不會刪除雲端聯絡簿。'))return;try{localStorage.removeItem(key)}catch(e){}token='';show()};
</script></body></html>
