<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐾 猜猜我在哪兒｜FunDesk</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;color:#24434d;background:#e7f5e4;min-height:100dvh}.scene{min-height:100dvh;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;padding:18px;background: url('./guess-where-bg.svg') center center / cover no-repeat}.horizon{position:absolute;inset:18% 0 24%;background:linear-gradient(180deg,transparent 65%,#91ba8b 66%,transparent 70%);opacity:.42;pointer-events:none}.horizon:after{content:"🌳　　 🏠　　 🌲　　 🏠　　 🌳　　 🧱";position:absolute;top:25%;left:0;width:100%;font-size:clamp(30px,6vw,85px);white-space:nowrap;opacity:.35}header{position:relative;z-index:1}h1{font-size:clamp(25px,3vw,46px);margin:4px}p{margin:8px;font-size:clamp(16px,2vw,25px)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px;position:relative;z-index:3}button{cursor:pointer;border:0;font-size:18px;font-weight:800;border-radius:14px;padding:12px 22px;background:#fff;box-shadow:0 4px 8px #3452}.primary{background:#ffd36f}.doors{position:relative;z-index:2;display:flex;justify-content:center;gap:clamp(10px,4vw,60px);width:100%;margin:auto 0 2vh}.door{--c:#46baf4;position:relative;width:min(25vw,245px);height:min(49vh,410px);min-height:200px;min-width:90px;background:var(--c);border:7px solid #28313d;border-radius:22px 22px 8px 8px;box-shadow:inset 0 0 0 10px #ffffff55,0 13px 0 -3px #44556b,0 18px 20px #0003;transition:transform .25s;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}.door:before{content:"";position:absolute;inset:14% 13% 9%;border:5px solid #1e293b99;border-radius:9px}.door:after{content:"";position:absolute;top:54%;left:11%;height:23px;width:23px;background:linear-gradient(135deg,#fff,#bfc6d5);border:4px solid #28313d;border-radius:50%}.door:nth-child(2){--c:#76edb8}.door:nth-child(3){--c:#c18af7}.door:not(:disabled):hover{transform:translateY(-8px)}.door:disabled{cursor:default}.door .number{position:absolute;top:6px;font-size:25px;color:#202835}.door .inside{display:none;background:#fff9;border-radius:20px;z-index:2;padding:8px;max-width:85%;font-size:48px}.door.open .inside{display:block}.door.open:before{background:#fff9}.door .inside img{max-width:100%;max-height:150px;object-fit:contain}.message{position:relative;z-index:3;font-size:clamp(20px,3vw,32px);font-weight:900;min-height:58px}.note{font-size:12px;color:#435b62;background:#ffffffc9;border-radius:8px;padding:6px;position:relative;z-index:3}.roulette{font-size:clamp(20px,4vw,38px);font-weight:900;position:relative;z-index:3;min-height:50px}.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}.spark{position:absolute;animation:fly 1.3s ease-out forwards;font-size:30px}@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2)}}@media(max-width:600px){.scene{padding:8px}.door{border-width:5px;min-height:180px;height:36vh}.door .inside{font-size:26px}.door .inside img{max-height:75px}} </style></head><body><main class="scene"><div class="horizon"></div><header><h1>🐾 猜猜我在哪兒</h1><p>輪盤選班寵，再猜牠躲在哪一扇任意門！</p></header><div class="toolbar"><button class="primary" id="start">🎡 抽班寵・開始新局</button><button id="full">⛶ 全螢幕</button></div><div class="roulette" id="roulette">準備開始！</div><section class="doors" id="doors"><button class="door" disabled><span class="number">1</span><span class="inside"></span></button><button class="door" disabled><span class="number">2</span><span class="inside"></span></button><button class="door" disabled><span class="number">3</span><span class="inside"></span></button></section><div class="message" id="message">已載入 FunDesk 班寵，按「抽班寵」開始</div><p class="note" id="status">使用 FunDesk class-pets 原有 SVG 圖片；學生積點尚未接入主程式。</p></main><div class="confetti" id="confetti"></div><script>
"use strict";
const doors=[...document.querySelectorAll(".door")],msg=document.querySelector("#message"),roulette=document.querySelector("#roulette"),status=document.querySelector("#status");
const DEFAULT_FUNDESK_PETS=[{"id":"dino","name":"小恐龍","image":"./class-pets/dino.svg"},{"id":"bear","name":"小熊","image":"./class-pets/bear.svg"},{"id":"panda","name":"熊貓","image":"./class-pets/panda.svg"},{"id":"cat","name":"小貓","image":"./class-pets/cat.svg"},{"id":"rabbit","name":"小兔","image":"./class-pets/rabbit.svg"},{"id":"501","name":"企鵝","image":"./class-pets/501.svg"},{"id":"502","name":"兔兔","image":"./class-pets/502.svg"},{"id":"503","name":"松鼠","image":"./class-pets/503.svg"},{"id":"504","name":"小鳥","image":"./class-pets/504.svg"},{"id":"505","name":"貓貓","image":"./class-pets/505.svg"},{"id":"506","name":"小狗","image":"./class-pets/506.svg"},{"id":"507","name":"大象","image":"./class-pets/507.svg"}];
let pets=DEFAULT_FUNDESK_PETS.slice(),picked=null,hidden=-1,round=0,busy=false;
const params=new URLSearchParams(location.search),gameToken=params.get('fundeskToken')||'';
let awardPending=false,studentLabel='',awardSequence=0;
function tellTeacher(data){if(!gameToken||!window.opener)return;window.opener.postMessage({...data,token:gameToken},location.origin)}
function readyTeacher(){tellTeacher({kind:'fundesk-guess-ready'})}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==window.opener||!gameToken||e.data?.token!==gameToken)return;
 if(e.data.kind==='fundesk-guess-config'){
  if(typeof e.data.studentLabel==='string')studentLabel=e.data.studentLabel.slice(0,90);
  if(Array.isArray(e.data.pets))acceptPets(e.data.pets);
  document.querySelector('#status').textContent='參賽學生：'+studentLabel+'｜答對後由 FunDesk 雲端加 1 點';
 }else if(e.data.kind==='fundesk-guess-award-result'){
  if(Number(e.data.round)!==awardSequence)return;
  awardPending=false;
  const ok=e.data.ok===true;
  msg.textContent=ok?'🎉 猜對了！已成功加 1 點！':'🎉 猜對了！但未成功加點：'+String(e.data.error||'請檢查雲端同步');
 }
});
window.addEventListener('load',readyTeacher);if(gameToken)setTimeout(readyTeacher,300);
function acceptPets(items){if(!Array.isArray(items))return;const good=items.filter(x=>x&&typeof x.name==="string"&&typeof x.image==="string"&&(/^(https?:|data:image\/)/.test(x.image)||x.image.startsWith("./")||x.image.startsWith("/")));if(good.length){pets=good;status.textContent="已載入 FunDesk 班寵圖片："+good.length+" 款";}}
window.FunDeskGuessWhere={setPets:acceptPets,getPets:()=>pets.slice()};
if(Array.isArray(window.FUNDESK_PETS))acceptPets(window.FUNDESK_PETS);
window.addEventListener("message",e=>{if(e.origin!==location.origin)return;if(e.data?.type==="fundesk:guess-pets")acceptPets(e.data.pets)});
try{const s=localStorage.getItem("fundesk_guess_pets");if(s)acceptPets(JSON.parse(s))}catch{}
doors.forEach((d,i)=>d.addEventListener("click",()=>{if(busy||hidden<0||d.disabled)return;busy=true;doors.forEach((el,j)=>{el.disabled=true;el.classList.add("open");const spot=el.querySelector(".inside");spot.textContent="";if(j===hidden){const im=document.createElement("img");im.src=picked.image;im.alt=picked.name;spot.append(im)}else{spot.textContent="❌"}});if(i===hidden){msg.textContent="🎉 猜對了！恭喜你！";for(let k=0;k<35;k++){const s=document.createElement("span");s.className="spark";s.textContent=["🎉","✨","⭐","🎊"][k%4];s.style.left=(30+Math.random()*40)+"%";s.style.top=(35+Math.random()*30)+"%";s.style.setProperty("--dx",(Math.random()*800-400)+"px");s.style.setProperty("--dy",(Math.random()*-500-30)+"px");document.querySelector("#confetti").append(s);setTimeout(()=>s.remove(),1400)}window.dispatchEvent(new CustomEvent("fundesk:guess-result",{detail:{correct:true,pet:picked.name}}));
 if(gameToken){awardPending=true;awardSequence=round;msg.textContent="🎉 猜對了！正在同步 +1 點……";tellTeacher({kind:'fundesk-guess-award',round:awardSequence,petId:picked.id});}}else{msg.textContent="好可惜喔！再試一次！";window.dispatchEvent(new CustomEvent("fundesk:guess-result",{detail:{correct:false,pet:picked.name}}))}}));
document.querySelector("#start").addEventListener("click",()=>{if(awardPending){msg.textContent="正在同步加點，請稍候再開始下一局";return}if(!pets.length){msg.textContent="請先從 FunDesk 載入班寵圖片";return}if(busy===false&&hidden!==-1)return;busy=false;hidden=-1;picked=null;doors.forEach(d=>{d.disabled=true;d.classList.remove("open");d.querySelector(".inside").textContent=""});msg.textContent="輪盤轉動中……";let n=0;const id=++round;const tick=setInterval(()=>{if(id!==round){clearInterval(tick);return}roulette.textContent="🎡 "+pets[n++%pets.length].name;if(n>=16){clearInterval(tick);picked=pets[Math.floor(Math.random()*pets.length)];hidden=Math.floor(Math.random()*3);roulette.textContent="🎯 本局班寵："+picked.name;msg.textContent="班寵藏好了！請選擇一扇門";doors.forEach(d=>d.disabled=false)}},100)});
document.querySelector("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
</script></body></html>
