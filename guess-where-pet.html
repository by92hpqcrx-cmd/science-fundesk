<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐾 猜猜我在哪兒｜FunDesk</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;color:#24434d;background:#e7f5e4;min-height:100dvh}.scene{min-height:100dvh;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden;padding:18px;background: url('./guess-lot-background.svg?v=20261121b') center center / cover no-repeat} .horizon{display:none}header{position:relative;z-index:1}h1{font-size:clamp(25px,3vw,46px);margin:4px}p{margin:8px;font-size:clamp(16px,2vw,25px)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px;position:relative;z-index:3}button{cursor:pointer;border:0;font-size:18px;font-weight:800;border-radius:14px;padding:12px 22px;background:#fff;box-shadow:0 4px 8px #3452}.primary{background:#ffd36f}.doors{position:relative;z-index:2;display:flex;justify-content:center;gap:clamp(10px,4vw,60px);width:100%;margin:auto 0 2vh}.door{position:relative;width:min(25vw,245px);height:min(49vh,410px);min-height:200px;min-width:90px;background:transparent url('./guess-door-blue.svg?v=20261121b') center / 100% 100% no-repeat;border:0;border-radius:0;box-shadow:none;transition:transform .25s;display:flex;align-items:center;justify-content:center;overflow:visible;padding:0;filter:drop-shadow(0 8px 9px #17294455)}.door:before,.door:after{display:none}.door:nth-child(2){background-image:url('./guess-door-green.svg?v=20261121b')}.door:nth-child(3){background-image:url('./guess-door-purple.svg?v=20261121b')}.door:not(:disabled):hover{transform:translateY(-8px)}.door:disabled{cursor:default}.door .number{position:absolute;top:6px;font-size:25px;color:#202835}.door .inside{display:none;background:#fff9;border-radius:20px;z-index:2;padding:8px;max-width:85%;font-size:48px}.door.open{background-image:none!important;background-color:transparent!important;filter:none}.door.open .inside{display:flex;align-items:center;justify-content:center;width:90%;height:88%;background:#ffffffed;border:8px solid #86a9bc;border-radius:20px;box-shadow:0 8px 24px #243b4055}.door.open .inside:has(img){border-color:#f4b949}.door .inside img{max-width:100%;max-height:150px;object-fit:contain}.message{position:relative;z-index:3;font-size:clamp(20px,3vw,32px);font-weight:900;min-height:58px}.note{font-size:12px;color:#435b62;background:#ffffffc9;border-radius:8px;padding:6px;position:relative;z-index:3}.roulette{position:relative;z-index:3;width:min(90vw,470px);border:3px solid #e8c76b;border-radius:20px;background:#fffdf0ee;padding:10px 18px;display:flex;align-items:center;justify-content:center;gap:16px;min-height:124px;box-shadow:0 5px 15px #244e3640}.roulette img{width:clamp(70px,10vh,112px);height:clamp(70px,10vh,112px);object-fit:contain;filter:drop-shadow(0 3px 5px #0002)}.rouletteLabel{font-size:clamp(17px,2.4vw,27px);font-weight:900;color:#385f48}.roulette.rolling{outline:4px solid #ffe48c}.roulette.rolling img{animation:petSpin .18s ease-in-out infinite alternate}@keyframes petSpin{from{transform:rotate(-8deg) scale(.93)}to{transform:rotate(8deg) scale(1.04)}}@media(max-height:680px){.roulette{min-height:84px;padding:4px}.roulette img{width:70px;height:70px}}.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}.spark{position:absolute;animation:fly 1.3s ease-out forwards;font-size:30px}@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2)}}@media(max-width:600px){.scene{padding:8px}.door{border-width:5px;min-height:180px;height:36vh}.door .inside{font-size:26px}.door .inside img{max-height:75px}} </style></head><body><main class="scene"><div class="horizon"></div><header><h1>🐾 猜猜我在哪兒</h1><p>輪盤選班寵，再猜牠躲在哪一扇任意門！</p></header><div class="toolbar"><button class="primary" id="start">🎡 抽班寵・開始新局</button><button id="full">⛶ 全螢幕</button></div><div class="roulette" id="roulette" aria-live="polite"><img id="roulettePetImage" src="./class-pets/dino.svg" alt="FunDesk 班寵"><span class="rouletteLabel" id="roulettePetName">🎡 準備抽選班寵</span></div><section class="doors" id="doors"><button class="door" disabled><span class="number">1</span><span class="inside"></span></button><button class="door" disabled><span class="number">2</span><span class="inside"></span></button><button class="door" disabled><span class="number">3</span><span class="inside"></span></button></section><div class="message" id="message">已載入 FunDesk 班寵，按「抽班寵」開始</div><p class="note" id="status">使用 FunDesk class-pets 原有 SVG 圖片；學生積點尚未接入主程式。</p></main><div class="confetti" id="confetti"></div><script>
"use strict";
const doors=[...document.querySelectorAll(".door")],msg=document.querySelector("#message"),roulette=document.querySelector("#roulette"),status=document.querySelector("#status");
const DEFAULT_FUNDESK_PETS=[{"id":"dino","name":"小恐龍","image":"./class-pets/dino.svg"},{"id":"bear","name":"小熊","image":"./class-pets/bear.svg"},{"id":"panda","name":"熊貓","image":"./class-pets/panda.svg"},{"id":"cat","name":"小貓","image":"./class-pets/cat.svg"},{"id":"rabbit","name":"小兔","image":"./class-pets/rabbit.svg"},{"id":"501","name":"企鵝","image":"./class-pets/501.svg"},{"id":"502","name":"兔兔","image":"./class-pets/502.svg"},{"id":"503","name":"松鼠","image":"./class-pets/503.svg"},{"id":"504","name":"小鳥","image":"./class-pets/504.svg"},{"id":"505","name":"貓貓","image":"./class-pets/505.svg"},{"id":"506","name":"小狗","image":"./class-pets/506.svg"},{"id":"507","name":"大象","image":"./class-pets/507.svg"}];
let pets=DEFAULT_FUNDESK_PETS.slice(),picked=null,hidden=-1,round=0,busy=false;
const randomInt=n=>{const a=new Uint32Array(1);const cap=2**32-Math.pow(2,32)%n;do{crypto.getRandomValues(a)}while(a[0]>=cap);return a[0]%n};
const params=new URLSearchParams(location.search),gameToken=params.get('fundeskToken')||'';
let awardPending=false,studentLabel='',awardSequence=0;
function tellTeacher(data){if(!gameToken||!window.opener)return;window.opener.postMessage({...data,token:gameToken},location.origin)}
function readyTeacher(){tellTeacher({kind:'fundesk-guess-ready'})}
window.addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==window.opener||!gameToken||e.data?.token!==gameToken)return;
 if(e.data.kind==='fundesk-guess-config'){
  if(typeof e.data.studentLabel==='string')studentLabel=e.data.studentLabel.slice(0,90);
  if(Array.isArray(e.data.pets))acceptPets(e.data.pets);
  document.querySelector('#status').textContent='參賽學生：'+studentLabel+'｜答對後由 FunDesk 雲端加 1 點';
 }else if(e.data.kind==='fundesk-guess-award-result'){
  if(Number(e.data.round)!==awardSequence)return;
  awardPending=false;
  const ok=e.data.ok===true;
  msg.textContent=ok?'🎉 猜對了！已成功加 1 點！':'🎉 猜對了！但未成功加點：'+String(e.data.error||'請檢查雲端同步');
 }
});
window.addEventListener('load',readyTeacher);if(gameToken)setTimeout(readyTeacher,300);
function acceptPets(items){if(!Array.isArray(items))return;const good=items.filter(x=>x&&typeof x.name==="string"&&typeof x.image==="string"&&(/^(https?:|data:image\/)/.test(x.image)||x.image.startsWith("./")||x.image.startsWith("/")));if(good.length){pets=good;status.textContent="已載入 FunDesk 班寵圖片："+good.length+" 款";}}
window.FunDeskGuessWhere={setPets:acceptPets,getPets:()=>pets.slice()};
if(Array.isArray(window.FUNDESK_PETS))acceptPets(window.FUNDESK_PETS);
window.addEventListener("message",e=>{if(e.origin!==location.origin)return;if(e.data?.type==="fundesk:guess-pets")acceptPets(e.data.pets)});
try{const s=localStorage.getItem("fundesk_guess_pets");if(s)acceptPets(JSON.parse(s))}catch{}
doors.forEach((d,i)=>d.addEventListener("click",()=>{if(busy||hidden<0||d.disabled)return;busy=true;doors.forEach((el,j)=>{el.disabled=true;el.classList.add("open");const spot=el.querySelector(".inside");spot.textContent="";if(j===hidden){const im=document.createElement("img");im.src=picked.image;im.alt=picked.name;spot.append(im)}else{spot.textContent="❌"}});if(i===hidden){msg.textContent="🎉 猜對了！恭喜你！";for(let k=0;k<35;k++){const s=document.createElement("span");s.className="spark";s.textContent=["🎉","✨","⭐","🎊"][k%4];s.style.left=(30+Math.random()*40)+"%";s.style.top=(35+Math.random()*30)+"%";s.style.setProperty("--dx",(Math.random()*800-400)+"px");s.style.setProperty("--dy",(Math.random()*-500-30)+"px");document.querySelector("#confetti").append(s);setTimeout(()=>s.remove(),1400)}window.dispatchEvent(new CustomEvent("fundesk:guess-result",{detail:{correct:true,pet:picked.name}}));
 if(gameToken){awardPending=true;awardSequence=round;msg.textContent="🎉 猜對了！正在同步 +1 點……";tellTeacher({kind:'fundesk-guess-award',round:awardSequence,petId:picked.id});}}else{msg.textContent="好可惜喔！再試一次！";window.dispatchEvent(new CustomEvent("fundesk:guess-result",{detail:{correct:false,pet:picked.name}}))}}));
const petPreview=document.querySelector("#roulettePetImage"),petName=document.querySelector("#roulettePetName");
function showPetPicture(p,label){
 if(!p)return;petPreview.src=p.image;petPreview.alt=p.name;petName.textContent=label+" "+p.name;
}
document.querySelector("#start").addEventListener("click",()=>{
 if(awardPending){msg.textContent="正在同步加點，請稍候再開始下一局";return}
 if(!pets.length){msg.textContent="請先從 FunDesk 載入班寵圖片";return}
 if(roulette.classList.contains("rolling")||(busy===false&&hidden!==-1))return;
 busy=false;hidden=-1;picked=null;const id=++round;
 doors.forEach(d=>{d.disabled=true;d.classList.remove("open");d.querySelector(".inside").textContent=""});
 msg.textContent="🎡 班寵圖案輪播中……";roulette.classList.add("rolling");
 const selectedIndex=randomInt(pets.length),total=24;
 let n=0;
 const spin=()=>{
  if(id!==round){roulette.classList.remove("rolling");return}
  const currentPet=pets[(selectedIndex+1+n)%pets.length];
  showPetPicture(currentPet,"🎡");
  n++;
  if(n>=total){
   picked=pets[selectedIndex];hidden=randomInt(3);
   showPetPicture(picked,"🎯 本局班寵：");
   roulette.classList.remove("rolling");
   msg.textContent="班寵藏好了！三扇門中隨機選了一扇，請猜猜看！";
   doors.forEach(d=>d.disabled=false);return;
  }
  setTimeout(spin,Math.round(80+240*(n/total)**2));
 };
 spin();
});
document.querySelector("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
</script></body></html>
