<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153f5b">
<title>🌟 星空配對王｜FunDesk</title>
<link rel="icon" href="../fundesk-app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=20261119-01">
</head><body><div id="app" class="app">
<header class="top"><a class="brand" href="../index.html"><img src="../fundesk-app-icon.svg" alt=""><span>FunDesk</span></a>
<div class="title"><strong>🌟 星空配對王</strong><small>五年級自然科 · 認識星座與星空圖形</small></div>
<button id="fullscreen" class="btn subtle" type="button">⛶ 全螢幕</button></header>
<section id="setup" class="setup">
<div class="setupHeader"><span class="eyebrow">SPACE MATCHING LAB</span><h1>找出星星的名字 ✨</h1><p>看圖認星座、配對字卡，跟同學一起挑戰！</p></div>
<div class="settings"><div class="setting"><h2>① 選擇遊戲方式</h2><div id="modes" class="modeCards">
<label><input type="radio" name="mode" value="stack" checked><span><b>🧩 星座疊疊樂</b><small>把圖卡拖到正確字卡上</small></span></label>
<label><input type="radio" name="mode" value="pick"><span><b>🎯 星座快選王</b><small>看字卡，找出對應圖卡</small></span></label>
<label><input type="radio" name="mode" value="memory"><span><b>🃏 星座翻翻樂</b><small>翻開圖卡與字卡找配對</small></span></label>
</div></div>
<div class="setting"><h2>② 設定題目</h2><label class="number">配對組數 <input id="quantity" type="number" inputmode="numeric" min="2" max="20" value="6"><span>組（2～20 組）</span></label><p class="hint">每次隨機出題，可由少到多慢慢挑戰。</p>
<label class="check"><input id="showHint" type="checkbox" checked>顯示星座小提示（國小五年級推薦）</label>
</div>
<div class="setting"><h2>③ 玩家人數</h2><div class="playerCount">
<label><input type="radio" name="players" value="1" checked><span>1 人</span></label><label><input type="radio" name="players" value="2"><span>2 人</span></label>
<label><input type="radio" name="players" value="3"><span>3 人</span></label><label><input type="radio" name="players" value="4"><span>4 人</span></label>
</div><div id="playerSetup" class="playerSetup"></div><p id="rosterStatus" class="hint">從 FunDesk 首頁開啟，可選目前班級學生。</p></div>
</div><div class="startRow"><button class="btn primary" id="start">🚀 開始挑戰</button></div></section>
<section id="game" class="game" hidden>
<div class="gameHeader"><span id="modeTitle"></span><div class="gameStats"><span>配對 <b id="done">0/6</b></span><span>回合 <b id="rounds">0</b></span><span>時間 <b id="timer">00:00</b></span></div><button id="back" class="btn subtle">↩ 設定</button></div>
<div id="scores" class="scores"></div><div id="instruction" class="instruction" role="status"></div>
<div id="playfield" class="playfield"></div>
<div id="feedback" class="feedback" aria-live="polite"></div>
</section>
<dialog id="win" class="win"><div class="winEmoji">🏆 🌟 🎉</div><h2>挑戰完成！</h2><div id="results"></div><div class="winButtons"><button id="again" class="btn primary">🔄 再玩一次</button><button id="settings" class="btn subtle">返回設定</button></div></dialog>
<div id="fireworks" class="fireworks" aria-hidden="true"></div></div>
<script src="./game.js?v=20261119-01" defer></script>
</body></html>
