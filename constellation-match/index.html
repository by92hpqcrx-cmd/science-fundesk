<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌟 星空配對王｜FunDesk</title>
  <link rel="icon" type="image/svg+xml" href="../fundesk-app-icon.svg" />
  <link rel="stylesheet" href="style.css?v=20261119-svg-clear-v4" />
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon">🌌</span><span>FunDesk</span></a>
    <div class="heading"><strong>🌟 星空配對王</strong><span>五年級自然科・星座字卡與圖卡配對</span></div>
    <button class="btn secondary" type="button" id="fullscreen">⛶ 全螢幕</button>
  </header>

  <section id="setup" class="setup">
    <div class="intro"><span>SPACE MATCHING GAME</span><h1>一起認識星空 ✨</h1><p>看清楚星點與連線，再找出正確的星座名稱！</p></div>
    <div class="setup-grid">
      <div class="setting">
        <h2>① 選遊戲方式</h2>
        <label class="mode"><input type="radio" name="mode" value="stack" checked /><span><b>🧩 星座疊疊樂</b><small>拖曳圖卡到字卡，或點圖卡再點字卡</small></span></label>
        <label class="mode"><input type="radio" name="mode" value="pick" /><span><b>🎯 星座快選王</b><small>一次出現一張字卡，從全部圖卡找答案</small></span></label>
      </div>
      <div class="setting">
        <h2>② 題目與提示</h2>
        <label class="quantity">配對組數 <input id="quantity" type="number" min="2" max="20" value="6" /> 組</label>
        <p class="hint">可選 2～20 組，建議第一次先玩 4～6 組。</p>
        <label class="hint-toggle"><input id="showHint" type="checkbox" checked /> 顯示簡單小提示</label>
      </div>
      <div class="setting">
        <h2>③ 玩家人數</h2>
        <div class="player-count">
          <label><input type="radio" name="players" value="1" checked /><span>1 人</span></label>
          <label><input type="radio" name="players" value="2" /><span>2 人</span></label>
          <label><input type="radio" name="players" value="3" /><span>3 人</span></label>
          <label><input type="radio" name="players" value="4" /><span>4 人</span></label>
        </div>
        <div class="player-setup" id="playerSetup"></div>
        <p id="rosterStatus" class="hint">從 FunDesk 首頁開啟，可選擇目前班級的學生。</p>
      </div>
    </div>
    <div class="start-row"><button class="btn primary" id="start" type="button">🚀 開始配對</button></div>
  </section>

  <main id="game" class="game" hidden>
    <div class="game-head">
      <b id="modeTitle">星座疊疊樂</b>
      <div class="counters"><span>完成 <strong id="done">0/6</strong></span><span>作答 <strong id="attempts">0</strong></span><span>時間 <strong id="clock">00:00</strong></span></div>
      <button class="btn secondary" id="back" type="button">↩ 設定</button>
    </div>
    <div id="scoreboard" class="scoreboard"></div>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div id="playfield" class="playfield"></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </main>

  <dialog id="winDialog" class="win-dialog">
    <div class="trophy">🏆 🌟 🎉</div>
    <h2>挑戰成功！</h2>
    <div id="results" class="results"></div>
    <div class="dialog-actions"><button class="btn primary" type="button" id="again">🔄 再玩一次</button><button class="btn secondary" type="button" id="settings">回設定</button></div>
  </dialog>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
</div>
<script src="game.js?v=20261119-svg-clear-v4" defer></script>
</body>
</html>
