<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班寵五連線｜FunDesk</title><style>
*{box-sizing:border-box}body{margin:0;font:18px "Microsoft JhengHei",system-ui,sans-serif;background:#eaf5e9;color:#23483b}button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default}main{max-width:1100px;margin:auto;padding:12px}header{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,38px);margin:5px 0}button,select{border:2px solid #a5cbb7;border-radius:12px;padding:9px 13px;background:#fff;color:#23483b;font-weight:800}button.primary{background:#ffe19a;border-color:#d9af55}section.panel{background:#fff;border:2px solid #b4d9c4;border-radius:18px;padding:16px;margin:10px 0}label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}select{max-width:100%}.settings{display:flex;gap:12px;flex-wrap:wrap}details{border:1px solid #b4d9c4;border-radius:10px;margin:8px 0;padding:10px}summary{cursor:pointer;font-weight:800}details label{padding:7px 3px}input[type=checkbox]{width:21px;height:21px;accent-color:#397c58}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.hidden{display:none!important}.arena{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:start}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(4px,1vw,10px);max-width:min(76vh,760px);width:100%;margin:auto}.tile{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;padding:3px;overflow:hidden;background:#fff9d9;border:3px solid #dfbd75;box-shadow:0 3px #bba166}.tile img{width:85%;height:85%;object-fit:contain}.tile .num{position:absolute;top:3px;left:6px;font-size:12px;color:#655c43}.tile.claim0{background:#dceaff;border-color:#427dc7;box-shadow:0 3px #427dc7}.tile.claim1{background:#ffe0e9;border-color:#c85c83;box-shadow:0 3px #c85c83}.tile.win{outline:4px solid #f1b928;animation:pulse .8s alternate infinite}.tile .owner{position:absolute;bottom:2px;left:0;right:0;font-size:clamp(10px,1.4vw,16px);background:#ffffffe8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.players{display:grid;gap:10px}.player{padding:12px;border:3px solid #c6d6cd;border-radius:14px;background:white;text-align:center}.player.active{border-color:#e0ad36;background:#fff5ca}.player img{width:65px;height:65px;object-fit:contain}.player b{display:block}.status{font-weight:900;font-size:22px;text-align:center;margin:8px}.avatarFallback{font-size:clamp(24px,5vw,60px)}dialog{width:min(94vw,850px);max-height:90vh;overflow:auto;border:5px solid #bf925b;border-radius:20px;background:#fafff4;color:#244735;padding:clamp(14px,3vw,30px)}dialog::backdrop{background:#132c23bd}dialog h2{font-size:clamp(23px,3.5vw,38px);line-height:1.45;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{min-height:85px;font-size:clamp(20px,2.5vw,28px);white-space:normal;text-align:left}.answers button.right{background:#b7edc5;border-color:#4c9a63}.answers button.wrong{background:#ffd8db;border-color:#c65d68}.feedback{font-size:20px;white-space:pre-wrap}.winTitle{font-size:34px;color:#92650b;text-align:center}@keyframes pulse{to{outline-color:#fff09b}}@media(max-width:680px){.arena{grid-template-columns:1fr}.players{grid-template-columns:1fr 1fr;grid-row:1}.player img{width:40px;height:40px}.board{max-width:100%}.answers{grid-template-columns:1fr}.tile{border-width:2px}.player{padding:5px}}
</style></head><body><main><header><h1>🐾 班寵五連線</h1><button id="full">⛶ 全螢幕</button></header><section id="setup" class="panel"><p id="connection">等待 FunDesk 班級資料…</p><div class="settings"><label>班級 <select id="class"></select></label><label>藍隊 <select id="p0"></select></label><label>粉隊 <select id="p1"></select></label><label>題型 <select id="type"><option value="all">全部題型</option><option value="2">是非題</option><option value="4">選擇題</option></select></label></div><div class="tools"><button id="all">全選活動</button><button id="clear">取消全部選取</button><button id="reload">重新整理線上題庫</button></div><div id="units"></div><p id="count"></p><p id="cloud"></p><button class="primary" id="start">🎮 開始雙人競賽</button></section><section id="game" class="hidden"><div id="status" class="status"></div><div class="arena"><div id="board" class="board"></div><aside class="players" id="players"></aside></div><div class="tools"><button id="quit">返回設定／重玩</button></div></section></main><dialog id="question"><div id="whose"></div><h2 id="stem"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback" aria-live="polite"></p><button class="primary hidden" id="next">下一位玩家</button></dialog><dialog id="result"><h2 id="winner" class="winTitle"></h2><p id="resultText"></p><button class="primary" id="again">再玩一次</button> <button id="back">返回設定</button></dialog>
<script src="../nature-science-game/supabase-config.js?v=20261121"></script><script src="../nature-science-game/questions.js?v=20261119-u3-205"></script><script src="../nature-science-game/unit3-cloud.js?v=20261127-bank4"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),token=new URL(location.href).searchParams.get('fundeskToken')||'',origin=location.origin;
const units=[['01','動物世界',['動物如何求生存','動物具有社會行為嗎','動物如何延續生命']],['02','探索聲光世界',['樂音與噪音有什麼不同','樂器如何發出不同的聲音','光有什麼特性與現象']],['03','神祕的天空',['太陽的位置和四季有關嗎','太陽系有哪些成員','四季的星空有什麼不一樣']],['04','燃燒與生鏽',['空氣與燃燒有什麼關係','燃燒的條件與如何滅火','為何會生鏽與如何防鏽']]];
const keys=units.flatMap(([u,n,a])=>a.map((_,i)=>u+'-0'+(i+1))),picks=new Set(['03-01','03-02','03-03']),base=window.NATURE_QUESTIONS||[];let cloud=[],classes=[],players=[],cards=[],turn=0,roundPool=[],deck=[],playing=false,locked=false,finished=false,pet='501';
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const valid=q=>q&&q.question&&Array.isArray(q.options)&&[2,4].includes(q.options.length)&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&($('type').value==='all'||q.options.length===Number($('type').value));
function bank(){const seen=new Set();return [...base,...cloud].filter(q=>{if(!valid(q))return false;const k=q.unit+'|'+q.question.replace(/\s+/g,'');if(seen.has(k))return false;seen.add(k);return true})}
function pool(){return bank().filter(q=>picks.has(String(q.unit)))}
function updateCounts(){const b=bank();document.querySelectorAll('[data-code]').forEach(el=>{el.textContent=b.filter(q=>q.unit===el.dataset.code).length+' 題'});$('count').textContent='已選 '+picks.size+' 個活動，共 '+pool().length+' 道可用題目（至少25題）';$('start').disabled=pool().length<25||!classes.length}
for(const [u,name,activities] of units){const d=document.createElement('details');d.open=u==='03';const s=document.createElement('summary');s.textContent='第'+Number(u)+'單元・'+name;d.append(s);activities.forEach((name,i)=>{const key=u+'-0'+(i+1),l=document.createElement('label'),cb=document.createElement('input'),n=document.createElement('small');cb.type='checkbox';cb.value=key;cb.checked=picks.has(key);cb.onchange=()=>{cb.checked?picks.add(key):picks.delete(key);updateCounts()};n.dataset.code=key;l.append(cb,document.createTextNode('活動'+(i+1)+' '+name+'　'),n);d.append(l)});$('units').append(d)}
function selectAll(on){picks.clear();if(on)keys.forEach(k=>picks.add(k));$('units').querySelectorAll('input').forEach(i=>i.checked=on);updateCounts()}
$('all').onclick=()=>selectAll(true);$('clear').onclick=()=>selectAll(false);$('type').onchange=updateCounts;$('reload').onclick=()=>{if(window.reloadNatureCloud){$('cloud').textContent='讀取中…';window.reloadNatureCloud()}else $('cloud').textContent='無法載入線上題庫模組'};
window.addEventListener('nature:cloud-questions',e=>{cloud=e.detail||[];updateCounts()});window.addEventListener('nature:cloud-status',e=>{$('cloud').textContent='線上補充 '+e.detail.added+' 題'+(e.detail.error?'｜'+e.detail.error:'｜已更新')});
function fill(){const c=classes.find(c=>c.code===$('class').value);for(const id of ['p0','p1'])$(id).replaceChildren(...(c?.students||[]).map(s=>new Option(s.no+'號 '+s.name,s.id)));if(c?.students.length>1)$('p1').selectedIndex=1}
$('class').onchange=fill;
window.addEventListener('message',e=>{if(e.source!==window.opener||e.origin!==origin||e.data?.token!==token||e.data?.kind!=='fundesk-line-roster')return;classes=e.data.classes||[];$('class').replaceChildren(...classes.map(c=>new Option(c.label,c.code)));$('class').value=e.data.current||classes[0]?.code||'';fill();$('connection').textContent='已連線 FunDesk：選擇兩位不同學生';updateCounts()});
if(token&&window.opener){let n=0;const send=()=>{if(classes.length||n++>45){clearInterval(timer);return}window.opener.postMessage({kind:'fundesk-line-ready',token},origin)};const timer=setInterval(send,700);send()}else $('connection').textContent='請由已登入的 FunDesk 首頁開啟，才能選擇班上學生。';
function picture(src,fallback){if(!src){const el=document.createElement('span');el.className='avatarFallback';el.textContent=fallback;return el}const img=document.createElement('img');img.src=src;img.alt='';img.onerror=()=>{const el=document.createElement('span');el.className='avatarFallback';el.textContent=fallback;img.replaceWith(el)};return img}
function take(){if(!deck.length)deck=shuffle(roundPool);return deck.pop()}
function begin(){const c=classes.find(c=>c.code===$('class').value);players=['p0','p1'].map(id=>c?.students.find(s=>String(s.id)===$(id).value));if(players.some(p=>!p)||players[0].id===players[1].id)return alert('請選擇兩位不同學生');roundPool=pool();if(roundPool.length<25)return alert('至少選取25道題目');pet=/^(501|502|503|504|505|506|507|bear|cat|dino|panda|rabbit)$/.test(c.pet)?c.pet:'501';deck=shuffle(roundPool);cards=Array.from({length:25},()=>({owner:null,q:take()}));turn=Math.random()<.5?0:1;playing=true;locked=false;finished=false;$('setup').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(line=[]){$('board').replaceChildren(...cards.map((c,i)=>{const b=document.createElement('button');b.className='tile'+(c.owner===null?'':' claim'+c.owner)+(line.includes(i)?' win':'');b.disabled=c.owner!==null||locked||finished;b.setAttribute('aria-label','第'+(i+1)+'格'+(c.owner===null?'未占領':players[c.owner].name));const n=document.createElement('span');n.className='num';n.textContent=i+1;b.append(n,c.owner===null?picture('./class-pets/'+pet+'.svg','🐾'):picture(players[c.owner].avatar,c.owner===0?'🔵':'🌸'));if(c.owner!==null){const label=document.createElement('span');label.className='owner';label.textContent=players[c.owner].name;b.append(label)}b.onclick=()=>ask(i);return b}));$('players').replaceChildren(...players.map((p,i)=>{const el=document.createElement('div');el.className='player'+(i===turn&&!finished?' active':'');const name=document.createElement('b');name.textContent=(i===0?'🔵 ':'🌸 ')+p.name;const stat=document.createElement('span');stat.textContent='已占領 '+cards.filter(c=>c.owner===i).length+' 格';el.append(picture(p.avatar,i===0?'🔵':'🌸'),name,stat);return el}));$('status').textContent=finished?'本局結束':'輪到 '+players[turn].name+' 選牌'}
const lines=[...Array.from({length:5},(_,r)=>Array.from({length:5},(_,c)=>r*5+c)),...Array.from({length:5},(_,c)=>Array.from({length:5},(_,r)=>r*5+c)),[0,6,12,18,24],[4,8,12,16,20]];
function ask(i){if(!playing||locked||finished||cards[i].owner!==null)return;locked=true;const q=cards[i].q;$('whose').textContent=players[turn].name+'｜第 '+(i+1)+' 格';$('stem').textContent=q.question;$('feedback').textContent='';$('next').classList.add('hidden');$('answers').replaceChildren(...q.options.map((o,j)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(!$('next').classList.contains('hidden'))return;const correct=j===q.answer;Array.from($('answers').children).forEach((x,k)=>{x.disabled=true;if(k===q.answer)x.classList.add('right');else if(k===j)x.classList.add('wrong')});if(correct)cards[i].owner=turn;else cards[i].q=take();$('feedback').textContent=(correct?'答對了！占領此格。':'答錯了！此格保持未占領。')+'\n正確答案：'+q.options[q.answer]+(q.explanation?'\n'+q.explanation:'');$('next').classList.remove('hidden');$('next').onclick=()=>{ $('question').close();locked=false;const line=lines.find(l=>l.every(k=>cards[k].owner===turn));if(line){end(turn,line);return}if(cards.every(c=>c.owner!==null)||lines.every(l=>l.some(k=>cards[k].owner===0)&&l.some(k=>cards[k].owner===1))){end(null,[]);return}turn=1-turn;render()}};return b}));$('question').showModal()}
function end(w,line){finished=true;playing=false;render(line);$('winner').textContent=w===null?'🤝 平手！':'🎉 '+players[w].name+' 五連線獲勝！';$('resultText').textContent=w===null?'雙方都無法再形成五連線。':'成功連成一條直線！';$('result').showModal()}
function back(){if($('result').open)$('result').close();if($('question').open)$('question').close();playing=false;locked=false;$('game').classList.add('hidden');$('setup').classList.remove('hidden')}
$('question').addEventListener('cancel',e=>e.preventDefault());$('result').addEventListener('cancel',e=>e.preventDefault());$('start').onclick=begin;$('again').onclick=()=>{$('result').close();begin()};$('back').onclick=back;$('quit').onclick=()=>{if(finished||confirm('確定結束本局？'))back()};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('瀏覽器不支援全螢幕')}};updateCounts();
})();
</script></body></html>
