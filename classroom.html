  const w=makeMover(pet.id,pet.emoji+" "+pet.name,petPath(pet.id),"pet",pet.emoji);
  const prog=Math.max(0,Math.min(99,Number(st().classPetProgress&&st().classPetProgress[pet.id]&&st().classPetProgress[pet.id].points)||0));
  const bar=document.createElement("div");bar.className="meter";bar.innerHTML='<span><i style="width:'+prog+'%"></i></span>'+prog+'/100';w.el.insertBefore(bar,w.el.firstChild);movers.push(w);
 }
 movers.forEach((m,i)=>{root.appendChild(m.el);const bounds=moveBounds(m.el);m.x=(i%cols)/Math.max(1,cols-1)*bounds.x;m.y=Math.floor(i/cols)/Math.max(1,rows-1)*bounds.y;m.el.style.transform="translate("+m.x+"px,"+m.y+"px)"});
 frame=requestAnimationFrame(tick);
}
function tick(t){
 const dt=Math.min(.06,Math.max(0,(t-(last||t))/1000));last=t;
 if(!paused){
  const pace=({slow:18,medium:42,fast:72}[$("speed").value]||42);
  for(const m of movers){const box=moveBounds(m.el);m.x+=m.vx*pace*dt;m.y+=m.vy*pace*dt;
   if(m.x<0){m.x=0;m.vx=Math.abs(m.vx)}if(m.x>box.x){m.x=box.x;m.vx=-Math.abs(m.vx)}
   if(m.y<0){m.y=0;m.vy=Math.abs(m.vy)}if(m.y>box.y){m.y=box.y;m.vy=-Math.abs(m.vy)}
   m.el.style.transform="translate3d("+m.x+"px,"+m.y+"px,0)";
  }
 }
 frame=requestAnimationFrame(tick);
}
function personalHistory(type,id){
 const entries=st().roomFeedingLog||[];
 const received=e=>type==="student"?e.kind!=="teacher"&&e.kind!=="pet"&&String(e.sid)===String(id):type==="teacher"?e.kind==="teacher":e.kind==="pet"&&String(e.pet)===String(id);
 const given=e=>type==="student"?String(e.feederSid)===String(id):type==="teacher"?e.feederSid==="__teacher__":false;
 const target=e=>e.kind==="pet"?"🐾 "+(ROOM_PETS.find(p=>p.id===e.pet)?.name||e.name||"班寵"):e.kind==="teacher"?"👩‍🏫 老師":e.name||"學生";
 const row=(e,own)=>{
  const food=ROOM_FOODS.find(f=>f.id===e.food);
  const date=new Date(Number(e.at)||0),time=Number.isFinite(date.getTime())?date.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
  return '<div class="entry"><b>'+esc(own?"餵了 "+target(e):"由 "+(e.feederName||"未記錄餵食者")+" 餵食")+'</b> · '+esc((food?.emoji||"🍽️")+" "+(food?.name||e.food||"食物"))+'<br><small>'+esc(time)+'</small></div>';
 };
 const receivedItems=entries.filter(received).slice(-40).reverse(),givenItems=entries.filter(given).slice(-40).reverse();
 return '<section class="personalHistory"><h3>📋 餵食紀錄</h3><div class="historyColumns"><div><h4>🍽️ '+(type==="pet"?"誰餵過我":"誰餵食自己")+'</h4><div class="historyScroll">'+(receivedItems.map(e=>row(e,false)).join("")||'<div class="empty">沒有被餵食紀錄</div>')+'</div></div><div><h4>🎁 我餵過誰</h4><div class="historyScroll">'+(givenItems.map(e=>row(e,true)).join("")||'<div class="empty">'+(type==="pet"?"班寵沒有餵別人的紀錄":"沒有餵食他人的紀錄")+'</div>')+'</div></div></div></section>';
}
function openSpecialCard(type){
 const pet=getPet();if(type==="pet"&&!pet)return;
 openModal(type==="teacher"?"👩‍🏫 老師":pet.emoji+" "+pet.name,personalHistory(type,type==="pet"?pet.id:"__teacher__")+(type==="teacher"?'<section><button id="teacherFeedFromCard" class="btn primary">🔐 老師餵食（輸入動態教室密碼）</button></section>':""));
 if(type==="teacher")$("teacherFeedFromCard").onclick=async()=>{await activateTeacher();if(actor&&actor.type==="teacher")closeModal()};
}
function openModal(title,body){$("modalTitle").textContent=title;$("modalContent").innerHTML=body;$("modal").hidden=false}
function closeModal(){$("modal").hidden=true}
function onPerson(type,id){
 if(foodId&&actor){choice={type,id};document.querySelectorAll(".walker").forEach(m=>m.classList.toggle("chosen",m.dataset.type===type&&m.dataset.id===String(id)));feed();return}

function openStudent(id){
 const p=st().students.find(x=>String(x.id)===String(id));if(!p)return;
 openModal(p.no+" 號 · "+p.name,'<section><h3>🎟️ 我的餵食券</h3><p>剩餘 <strong>'+tickets(id)+'</strong> 張</p><button class="btn primary" id="useTicket" '+(tickets(id)<1?"disabled":"")+'>🎟️ 使用一張餵食券</button><p class="hint">餵食成功才扣券，每張可餵一次。</p></section><section><button class="btn" id="unlockAvatar">🔒 更換頭像（動態教室密碼）</button><div id="avatarChoices" hidden class="options"></div></section>'+personalHistory("student",id));
 $("useTicket").onclick=()=>{if(tickets(id)<1)return;actor={type:"student",sid:String(id),name:p.name};foodId=null;renderFoods();closeModal();setStatus("🎟️ 已選 "+p.name+" 的餵食券，請選食物及餵食對象。")};
 $("unlockAvatar").onclick=()=>{const area=$("avatarChoices");if(!area.hidden){area.hidden=true;return}const key=prompt("請輸入動態教室密碼");if(key===null)return;if(key!==String(shared&&shared.teacherFeedingPassword||"13579")){alert("密碼不正確");return}
 area.hidden=false;area.innerHTML=STUDENT_AVATARS.map(x=>'<button type="button" data-avatar="'+esc(x[0])+'"><img src="'+esc(avatarPath(x[0]))+'" alt=""><small>'+esc(x[1])+'</small></button>').join("")+'<button id="clearAvatar" class="btn">不使用頭像</button>';
 area.querySelectorAll("[data-avatar]").forEach(b=>b.onclick=async()=>{const avatar=b.dataset.avatar;if(await change(row=>{const q=row.students.find(x=>String(x.id)===String(id));if(!q)return false;q.avatar=avatar})){closeModal();setStatus("已更新學生頭像")}});$("clearAvatar").onclick=async()=>{if(await change(row=>{const q=row.students.find(x=>String(x.id)===String(id));if(!q)return false;delete q.avatar})){closeModal();setStatus("已清除學生頭像")}};
 };
}
function activateTeacher(){
 const key=prompt("請輸入動態教室密碼（老師餵食）");if(key===null)return;
 if(key!==String(shared&&shared.teacherFeedingPassword||"13579")){setStatus("動態教室密碼錯誤");return}
 actor={type:"teacher",sid:"__teacher__",name:"老師"};foodId=null;renderFoods();setStatus("👩‍🏫 老師已授權一次餵食，請選食物及學生或班寵。");
}
function renderFoods(){
 $("foodShelf").innerHTML=ROOM_FOODS.map(x=>'<button type="button" class="food '+(foodId===x.id?"sel":"")+'" data-food="'+x.id+'"><span class="emoji">'+x.emoji+'</span>'+esc(x.name)+'</button>').join("");
 $("foodShelf").querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{if(!actor){setStatus("請先點學生使用餵食券，或點老師輸入密碼。");return}foodId=b.dataset.food;renderFoods();setStatus("已選 "+ROOM_FOODS.find(f=>f.id===foodId).name+"，請點選想餵的對象。")});
}
async function feed(){
 if(!actor||!foodId||!choice){setStatus("請先選餵食者與食物。");return}
 if(actor.type==="teacher"&&choice.type==="teacher"){setStatus("老師不能餵自己。");return}
 const a=actor,t=choice,food=ROOM_FOODS.find(x=>x.id===foodId);if(!food)return;
 if(!confirm(a.name+" 使用 "+food.name+" 餵 "+(t.type==="teacher"?"老師":t.type==="pet"?(getPet()||{}).name:(st().students.find(x=>String(x.id)===String(t.id))||{}).name)+"，確定嗎？"))return;
 const done=await change(row=>{
   const now=Date.now(),pupil=row.students.find(x=>String(x.id)===String(t.id));
   if(a.type==="student"){
    const pts=row.points||[],logs=row.roomFeedingLog||[];
    const purchased=pts.filter(p=>!p.cancelled&&p.kind==="redemption"&&p.rewardId==="feeding-ticket"&&String(p.sid)===a.sid).length;
    const spent=pts.filter(p=>!p.cancelled&&p.kind==="feeding-ticket-used"&&String(p.sid)===a.sid).length+logs.filter(p=>p.ticketUsed&&String(p.feederSid)===a.sid&&!p.ledgerId).length;
    if(purchased<=spent){alert("這位學生的餵食券已用完");return false}
   }
   let count=0,pet=null,target="";
   if(t.type==="student"){if(!pupil){alert("找不到學生");return false}const rec=row.roomFeeding||{},old=rec[String(t.id)]||{};if(Number(old.until)>now||(!old.until&&Number(old.count)>=3)){alert("這位學生吃飽了，暫時不能餵食");return false}count=(old.until?0:Math.max(0,Number(old.count)||0))+1;row.roomFeeding=rec;rec[String(t.id)]={count,until:count>=3?now+3600000:0};target=pupil.name}
   else if(t.type==="pet"){pet=ROOM_PETS.find(x=>x.id===row.classPetType);if(!pet){alert("班寵尚未選擇");return false}const rec=row.classPetFeedings||{},old=rec[pet.id]||{};if(Number(old.until)>now||(!old.until&&Number(old.count)>=10)){alert("班寵吃飽了，暫時不能餵食");return false}count=(old.until?0:Math.max(0,Number(old.count)||0))+1;row.classPetFeedings=rec;rec[pet.id]={count,until:count>=10?now+3600000:0};
    const progress=row.classPetProgress||{};const older=progress[pet.id]||{},points=(Number(older.points)||0)+1;row.classPetProgress=progress;progress[pet.id]={points:points>=100?0:points,cycles:(Number(older.cycles)||0)+(points>=100?1:0)};target=pet.name}
   else {const old=row.roomTeacherFeed||{};if(Number(old.until)>now||(!old.until&&Number(old.count)>=3)){alert("老師已吃飽，稍後再餵");return false}count=(old.until?0:Number(old.count)||0)+1;row.roomTeacherFeed={count,until:count>=3?now+3600000:0};target="老師"}
   const ledgerId="feed_"+now+"_"+Math.random().toString(36).slice(2);
   if(!Array.isArray(row.points))row.points=[];if(!Array.isArray(row.roomFeedingLog))row.roomFeedingLog=[];
   if(a.type==="student")row.points.push({id:ledgerId,sid:a.sid,date:today(),delta:0,kind:"feeding-ticket-used",reason:"餵食券使用："+a.name+" 餵 "+target+" "+food.name});
   row.roomFeedingLog.push({kind:t.type,name:target,sid:t.type==="student"?String(t.id):undefined,pet:t.type==="pet"?pet.id:undefined,food:food.id,count,at:now,feederSid:a.sid,feederName:a.name,ticketUsed:a.type==="student",ledgerId});
   if(row.roomFeedingLog.length>150)row.roomFeedingLog=row.roomFeedingLog.slice(-150);
   return true;
 });
 if(done){actor=null;foodId=null;choice=null;renderFoods();setStatus("🍽️ "+a.name+" 已餵 "+(t.type==="teacher"?"老師":t.type==="pet"?(getPet()||{}).name:(st().students.find(x=>String(x.id)===String(t.id))||{}).name)+" "+food.name+"。")}
}
