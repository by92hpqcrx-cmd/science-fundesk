<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FunDesk 手寫測驗</title><style>body{margin:0;background:#e9f2e4;color:#234638;font:18px system-ui}main{max-width:1000px;margin:auto;padding:12px}header{position:sticky;top:0;background:#244c3b;color:#fff5b8;z-index:5;padding:12px;text-align:center;border-radius:10px}#identity{font-size:clamp(18px,4.5vw,36px);font-weight:900;white-space:nowrap}button,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #9ab5a0}button{background:#fff5c8;cursor:pointer}section{background:white;padding:14px;border-radius:12px;margin:12px 0}#tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}canvas{width:100%;height:auto;display:block;touch-action:none;background:white;border:1px solid #a7bdad} [hidden]{display:none!important}</style></head><body><main><header><div id="identity">✏️ 手寫測驗</div><div id="status">連線中…</div></header><section id="join"><form id="joinForm"><label>座號 <input id="seat" type="number" min="1" max="99" required></label><button id="joinBtn" disabled>加入測驗</button></form></section><section id="work" hidden><h2 id="title"></h2><div id="tools"><button id="pen">✏️ 畫筆</button><button id="erase">橡皮擦</button><input type="color" id="color" value="#1649ac" aria-label="筆色"><label>粗細 <input id="width" type="range" min="2" max="16" value="4"></label><button id="undo">復原</button><button id="clear">清空</button><button id="download">下載作答圖</button></div><p>在圖片上書寫或圈選；滑動畫布外側可捲動頁面。</p><canvas id="canvas"></canvas><p><button id="submit">確認交卷</button></p></section></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id),params=new URL(location.href).searchParams,room=params.get('room')||'';
if(!/^[a-f0-9]{32}$/.test(room))throw Error('無效網址');
const config={url:params.get('url'),key:params.get('key')};if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(config.url||'')||!config.key?.startsWith('sb_publishable_'))throw Error('無效連線設定');
const store='fd-write-'+room;let st;try{st=JSON.parse(sessionStorage.getItem(store))}catch{}st||={client:crypto.randomUUID().replaceAll('-',''),strokes:[]};const save=()=>{try{sessionStorage.setItem(store,JSON.stringify(st))}catch{}};
const sb=createClient(config.url,config.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),ch=sb.channel('fd-writing-'+room,{config:{broadcast:{self:false}}});
const send=(type,extra={})=>ch.send({type:'broadcast',event:'student',payload:{type,client:st.client,...extra}});
const cv=$('canvas'),ctx=cv.getContext('2d'),overlay=document.createElement('canvas'),ink=overlay.getContext('2d');let image,ready=false,done=false,active=null,eraser=false,loading=false;
function drawStroke(s){const p=s.p;if(!p.length)return;ink.globalCompositeOperation=s.e?'destination-out':'source-over';ink.strokeStyle=s.c;ink.fillStyle=s.c;ink.lineWidth=s.w;ink.lineCap='round';ink.lineJoin='round';ink.beginPath();ink.moveTo(p[0][0],p[0][1]);for(const v of p.slice(1))ink.lineTo(v[0],v[1]);if(p.length===1){ink.lineTo(p[0][0]+0.1,p[0][1]+0.1)}ink.stroke();ink.globalCompositeOperation='source-over'}
function redraw(){if(!ready)return;ink.clearRect(0,0,cv.width,cv.height);for(const s of st.strokes)drawStroke(s);if(active)drawStroke(active);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(image,0,0);ctx.drawImage(overlay,0,0)}
function point(e){const r=cv.getBoundingClientRect();return [Math.max(0,Math.min(cv.width,Math.round((e.clientX-r.left)*cv.width/r.width))),Math.max(0,Math.min(cv.height,Math.round((e.clientY-r.top)*cv.height/r.height)))]}
cv.onpointerdown=e=>{if(!ready||done||active||st.strokes.length>=500)return;e.preventDefault();cv.setPointerCapture(e.pointerId);active={e:eraser,c:$('color').value,w:Number($('width').value),p:[point(e)]};redraw()};
cv.onpointermove=e=>{if(!active||done)return;const p=point(e),last=active.p.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])<3)return;if(active.p.length<1000)active.p.push(p);redraw()};
function finish(){if(!active)return;st.strokes.push(active);active=null;save();redraw()}cv.onpointerup=finish;cv.onpointercancel=finish;
$('pen').onclick=()=>{eraser=false;$('status').textContent='畫筆模式'};$('erase').onclick=()=>{eraser=true;$('status').textContent='橡皮擦模式'};$('undo').onclick=()=>{if(!done){st.strokes.pop();save();redraw()}};$('clear').onclick=()=>{if(!done&&confirm('清除所有畫記？')){st.strokes=[];save();redraw()}};
$('download').onclick=()=>{if(!ready)return;const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='手寫測驗_'+(st.no||'')+'號.png';a.click()};
function load(p){if(ready||loading||done||!p.image)return;loading=true;image=new Image();image.onload=()=>{cv.width=overlay.width=image.naturalWidth;cv.height=overlay.height=image.naturalHeight;ready=true;loading=false;$('join').hidden=true;$('work').hidden=false;$('title').textContent=p.title;redraw();$('status').textContent='作答中'};image.onerror=()=>{loading=false;$('status').textContent='圖片載入失敗，重新連線中'};image.src=p.image}
ch.on('broadcast',{event:'teacher'},({payload:p})=>{if(!p||p.to&&p.to!==st.client)return;if(p.type==='paper'){$('identity').textContent=p.label+'　'+p.no+'號　'+p.name;load(p)}if(p.type==='received'){done=true;$('status').textContent='✅ 已交卷';$('submit').disabled=true;$('tools').querySelectorAll('button,input').forEach(x=>{if(x.id!=='download')x.disabled=true})}if(p.type==='error'){$('status').textContent=p.message;$('submit').disabled=false}if(p.type==='closed'&&!done){$('status').textContent='已停止收卷，請下載圖檔交給老師';$('submit').disabled=true}});
ch.subscribe(status=>{if(status==='SUBSCRIBED'){$('joinBtn').disabled=false;$('status').textContent='請輸入座號';if(st.no)send('join',{no:st.no})}else $('status').textContent='連線：'+status});
$('joinForm').onsubmit=e=>{e.preventDefault();st.no=Number($('seat').value);save();send('join',{no:st.no})};
$('submit').onclick=()=>{if(!ready||done)return;finish();if(!confirm('確定交卷？交卷後不能修改。'))return;const data=JSON.stringify(st.strokes);if(data.length>180000)return alert('畫記太多，請下載圖檔交給老師，或減少畫記。');$('submit').disabled=true;send('submit',{strokes:st.strokes});setTimeout(()=>{if(!done){$('submit').disabled=false;$('status').textContent='尚未確認交卷，請重試或下載作答圖'}},6000)};
setInterval(()=>{if(st.no&&!ready&&!done)send('join',{no:st.no})},4000);
</script></body></html>
