<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FunDesk 手寫測驗</title><style>body{margin:0;background:#e9f2e4;color:#234638;font:18px system-ui}main{max-width:1000px;margin:auto;padding:12px}header{position:sticky;top:0;background:#244c3b;color:#fff5b8;z-index:5;padding:12px;text-align:center;border-radius:10px}#identity{font-size:clamp(18px,4.5vw,36px);font-weight:900;white-space:nowrap}button,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #9ab5a0}button{background:#fff5c8;cursor:pointer}section{background:white;padding:14px;border-radius:12px;margin:12px 0}#tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#f2f8ed;padding:10px;border-radius:12px;margin-bottom:8px}#tools button[aria-pressed="true"]{background:#32674c;color:white;border-color:#32674c}#rulerControls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px;background:#fff6d2;border-radius:10px;margin-bottom:8px}#canvasWrap{position:relative}#rulerLayer{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:hidden;display:block}#rulerHandle,.rulerRotate{pointer-events:auto;touch-action:none;cursor:move}#rulerLayer{touch-action:none}.rulerRotate{cursor:grab}canvas{width:100%;height:auto;display:block;touch-action:none;background:white;border:1px solid #a7bdad} [hidden]{display:none!important}</style></head><body><main><header><div id="identity">✏️ 手寫測驗</div><div id="status">連線中…</div></header><section id="join"><form id="joinForm"><label>座號 <input id="seat" type="number" min="1" max="99" required></label><button id="joinBtn" disabled>加入測驗</button></form></section><section id="work" hidden><h2 id="title"></h2><div id="tools"><button id="pen" aria-pressed="true">✏️ 畫筆</button><button id="line" aria-pressed="false">📏 直線</button><button id="ruler" aria-pressed="false">📐 尺規</button><button id="erase" aria-pressed="false">橡皮擦</button><input type="color" id="color" value="#1649ac" aria-label="筆色"><label>粗細 <input id="width" type="range" min="2" max="16" value="4"></label><button id="undo">復原</button><button id="clear">清空</button><button id="download">下載作答圖</button></div><div id="rulerControls" hidden><label>尺規角度 <input id="rulerAngle" type="range" min="-180" max="180" step="1" value="0"></label><output id="rulerDegrees">0°</output><button id="rulerReset">水平重置</button><small>拖曳中央綠點移動尺規；拖曳兩端藍點旋轉角度。靠近尺規上緣可沿尺畫直線。刻度為相對刻度，非實際公分。</small></div><p>在圖片上書寫或圈選；直線工具按住起點拖至終點。滑動畫布外側可捲動頁面。</p><div id="canvasWrap"><canvas id="canvas"></canvas><svg id="rulerLayer" xmlns="http://www.w3.org/2000/svg" hidden aria-label="可移動尺規"><g id="rulerShape"></g></svg></div><p><button id="submit">確認交卷</button></p></section></main><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id),params=new URL(location.href).searchParams,room=params.get('room')||'';
if(!/^[a-f0-9]{32}$/.test(room))throw Error('無效網址');
const config={url:params.get('url')||"https://ayvwsexnxvjjcrbtyoof.supabase.co",key:params.get('key')||"sb_publishable_Z2rS84mJC4BK-h4oLsNNjw_CdQz240L"};if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(config.url||'')||!config.key?.startsWith('sb_publishable_'))throw Error('無效連線設定');
const store='fd-write-'+room;let st;try{st=JSON.parse(sessionStorage.getItem(store))}catch{}st||={client:crypto.randomUUID().replaceAll('-',''),strokes:[]};const save=()=>{try{sessionStorage.setItem(store,JSON.stringify(st))}catch{}};
const sb=createClient(config.url,config.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),ch=sb.channel('fd-writing-'+room,{config:{broadcast:{self:false}}});
const send=(type,extra={})=>ch.send({type:'broadcast',event:'student',payload:{type,client:st.client,...extra}});
const cv=$('canvas'),ctx=cv.getContext('2d'),overlay=document.createElement('canvas'),ink=overlay.getContext('2d');let image,ready=false,done=false,active=null,tool="pen",loading=false,activePointer=null,lineSnap=null,rulerOn=false,rulerX=0,rulerY=0,rulerA=0,rulerDrag=null;
function drawStroke(s){const p=s.p;if(!p.length)return;ink.globalCompositeOperation=s.e?'destination-out':'source-over';ink.strokeStyle=s.c;ink.fillStyle=s.c;ink.lineWidth=s.w;ink.lineCap='round';ink.lineJoin='round';ink.beginPath();ink.moveTo(p[0][0],p[0][1]);for(const v of p.slice(1))ink.lineTo(v[0],v[1]);if(p.length===1){ink.lineTo(p[0][0]+0.1,p[0][1]+0.1)}ink.stroke();ink.globalCompositeOperation='source-over'}
function redraw(){if(!ready)return;ink.clearRect(0,0,cv.width,cv.height);for(const s of st.strokes)drawStroke(s);if(active)drawStroke(active);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(image,0,0);ctx.drawImage(overlay,0,0)}
function point(e){const r=cv.getBoundingClientRect();return [Math.max(0,Math.min(cv.width,Math.round((e.clientX-r.left)*cv.width/r.width))),Math.max(0,Math.min(cv.height,Math.round((e.clientY-r.top)*cv.height/r.height)))]}
const svgNS='http://www.w3.org/2000/svg';
function rulerSize(){return {length:cv.width*.65,height:Math.max(32,cv.width*.10)}}
function svgEl(tag,attrs){const e=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}
function drawRuler(){if(!ready)return;const layer=$('rulerLayer'),g=$('rulerShape'),{length:L,height:H}=rulerSize();layer.setAttribute('viewBox','0 0 '+cv.width+' '+cv.height);layer.toggleAttribute('hidden',!rulerOn);layer.style.display=rulerOn?'block':'none';g.setAttribute('transform','translate('+rulerX+' '+rulerY+') rotate('+rulerA+')');g.replaceChildren();g.append(svgEl('rect',{x:-L/2,y:0,width:L,height:H,rx:H*.10,fill:'#fff0a4','fill-opacity':.75,stroke:'#a78027','stroke-width':Math.max(1,cv.width*.0015)}));g.append(svgEl('line',{x1:-L/2,y1:0,x2:L/2,y2:0,stroke:'#7d5a13','stroke-width':Math.max(2,cv.width*.002)}));for(let i=0;i<=50;i++){const x=-L/2+L*i/50,major=i%5===0;g.append(svgEl('line',{x1:x,y1:0,x2:x,y2:H*(major?.38:i%2===0?.25:.16),stroke:'#7d5a13','stroke-width':Math.max(1,cv.width*.001)}));if(major){const t=svgEl('text',{x,y:H*.65,'font-size':H*.23,'text-anchor':'middle',fill:'#654a13'});t.textContent=String(i/5);g.append(t)}}const handle=svgEl('circle',{id:'rulerHandle',cx:0,cy:H*.78,r:H*.24,fill:'#32674c',stroke:'white','stroke-width':2});g.append(handle);handle.onpointerdown=e=>{if(done||active||rulerDrag)return;e.preventDefault();e.stopPropagation();rulerDrag={kind:'move',id:e.pointerId,x:point(e),rx:rulerX,ry:rulerY};layer.setPointerCapture(e.pointerId)};for(const side of [-1,1]){const x=side*(L/2-H*.35),y=H*.76,r=H*.29;const rot=svgEl('circle',{class:'rulerRotate',cx:x,cy:y,r,fill:'#2267b3',stroke:'white','stroke-width':Math.max(2,H*.035)});const label=svgEl('text',{x,y:y+H*.105,'font-size':H*.34,'font-weight':'bold','text-anchor':'middle',fill:'white','pointer-events':'none'});label.textContent='↻';g.append(rot,label);rot.onpointerdown=e=>{if(done||active||rulerDrag)return;e.preventDefault();e.stopPropagation();const p=point(e);rulerDrag={kind:'rotate',id:e.pointerId,angle:rulerA,start:Math.atan2(p[1]-rulerY,p[0]-rulerX)};layer.setPointerCapture(e.pointerId)}}}
function resetRuler(){rulerX=cv.width/2;rulerY=Math.min(cv.height*.18,cv.width*.24);rulerA=0;$('rulerAngle').value='0';$('rulerDegrees').textContent='0°';drawRuler()}
const rulerLayer=$('rulerLayer');rulerLayer.onpointermove=e=>{if(!rulerDrag||rulerDrag.id!==e.pointerId||done)return;const p=point(e);if(rulerDrag.kind==='rotate'){if(Math.hypot(p[0]-rulerX,p[1]-rulerY)<10)return;const raw=rulerDrag.angle+(Math.atan2(p[1]-rulerY,p[0]-rulerX)-rulerDrag.start)*180/Math.PI;rulerA=Math.round(((raw+180)%360+360)%360-180);$('rulerAngle').value=String(rulerA);$('rulerDegrees').textContent=rulerA+'°'}else{rulerX=Math.max(0,Math.min(cv.width,rulerDrag.rx+p[0]-rulerDrag.x[0]));rulerY=Math.max(0,Math.min(cv.height,rulerDrag.ry+p[1]-rulerDrag.x[1]))}drawRuler()};rulerLayer.onpointerup=rulerLayer.onpointercancel=rulerLayer.onlostpointercapture=e=>{if(rulerDrag?.id===e.pointerId)rulerDrag=null};
function projected(p,snap){const t=(p[0]-snap.x)*snap.dx+(p[1]-snap.y)*snap.dy;const limit=snap.length/2;const z=Math.max(-limit,Math.min(limit,t));return [Math.max(0,Math.min(cv.width,Math.round(snap.x+z*snap.dx))),Math.max(0,Math.min(cv.height,Math.round(snap.y+z*snap.dy)))]}
function snapAt(p){if(!rulerOn)return null;const rad=rulerA*Math.PI/180,dx=Math.cos(rad),dy=Math.sin(rad),x=p[0]-rulerX,y=p[1]-rulerY,{length:L,height:H}=rulerSize();if(Math.abs(-x*dy+y*dx)>H*.35||Math.abs(x*dx+y*dy)>L/2)return null;return {x:rulerX,y:rulerY,dx,dy,length:L}}
function pickTool(next){if(done)return;tool=next;for(const id of ['pen','line','erase'])$(id).setAttribute('aria-pressed',String(id===next));$('status').textContent={pen:'畫筆模式',line:'直線模式：拖曳起點至終點',erase:'橡皮擦模式'}[next]}
cv.onpointerdown=e=>{if(!ready||done||active||st.strokes.length>=500)return;e.preventDefault();cv.setPointerCapture(e.pointerId);activePointer=e.pointerId;const p=point(e);lineSnap=tool==='line'?snapAt(p):null;const start=lineSnap?projected(p,lineSnap):p;active={e:tool==='erase',c:$('color').value,w:Number($('width').value),p:tool==='line'?[start,start]:[start]};redraw()};
cv.onpointermove=e=>{if(!active||done||activePointer!==e.pointerId)return;let p=point(e);if(tool==='line'){if(lineSnap)p=projected(p,lineSnap);active.p[1]=p;redraw();return}const last=active.p.at(-1);if(Math.hypot(p[0]-last[0],p[1]-last[1])<3)return;if(active.p.length<1000)active.p.push(p);redraw()};
function finish(e){if(!active||e&&activePointer!==e.pointerId)return;if(e?.type==='pointerup'&&tool==='line'){const p=point(e);active.p[1]=lineSnap?projected(p,lineSnap):p}st.strokes.push(active);active=null;activePointer=null;lineSnap=null;save();redraw()}cv.onpointerup=finish;cv.onpointercancel=finish;
$('pen').onclick=()=>pickTool('pen');$('line').onclick=()=>pickTool('line');$('erase').onclick=()=>pickTool('erase');$('ruler').onclick=()=>{if(!ready||done)return;rulerOn=!rulerOn;$('ruler').setAttribute('aria-pressed',String(rulerOn));$('rulerControls').hidden=!rulerOn;if(rulerOn){pickTool('line');drawRuler()}else {$('rulerLayer').setAttribute('hidden','');$('rulerLayer').style.display='none'}};$('rulerAngle').oninput=e=>{rulerA=Number(e.target.value);$('rulerDegrees').textContent=rulerA+'°';drawRuler()};$('rulerReset').onclick=resetRuler;
$('undo').onclick=()=>{if(!done){st.strokes.pop();save();redraw()}};$('clear').onclick=()=>{if(!done&&confirm('清除所有畫記？')){st.strokes=[];save();redraw()}};
$('download').onclick=()=>{if(!ready)return;const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='手寫測驗_'+(st.no||'')+'號.png';a.click()};
function load(p){if(ready||loading||done||!p.image)return;loading=true;image=new Image();image.onload=()=>{cv.width=overlay.width=image.naturalWidth;cv.height=overlay.height=image.naturalHeight;ready=true;loading=false;$('join').hidden=true;$('work').hidden=false;$('title').textContent=p.title;resetRuler();redraw();$('status').textContent='作答中'};image.onerror=()=>{loading=false;$('status').textContent='圖片載入失敗，重新連線中'};image.src=p.image}
ch.on('broadcast',{event:'teacher'},({payload:p})=>{if(!p||p.to&&p.to!==st.client)return;if(p.type==='paper'){$('identity').textContent=p.label+'　'+p.no+'號　'+p.name;load(p)}if(p.type==='received'){done=true;rulerOn=false;$('rulerLayer').setAttribute('hidden','');$('rulerLayer').style.display='none';$('rulerControls').hidden=true;$('status').textContent='✅ 已交卷';$('submit').disabled=true;$('tools').querySelectorAll('button,input').forEach(x=>{if(x.id!=='download')x.disabled=true})}if(p.type==='error'){$('status').textContent=p.message;$('submit').disabled=false}if(p.type==='closed'&&!done){$('status').textContent='已停止收卷，請下載圖檔交給老師';$('submit').disabled=true}});
ch.subscribe(status=>{if(status==='SUBSCRIBED'){$('joinBtn').disabled=false;$('status').textContent='請輸入座號';if(st.no)send('join',{no:st.no})}else $('status').textContent='連線：'+status});
$('joinForm').onsubmit=e=>{e.preventDefault();st.no=Number($('seat').value);save();send('join',{no:st.no})};
$('submit').onclick=()=>{if(!ready||done)return;finish();if(!confirm('確定交卷？交卷後不能修改。'))return;const data=JSON.stringify(st.strokes);if(data.length>180000)return alert('畫記太多，請下載圖檔交給老師，或減少畫記。');$('submit').disabled=true;send('submit',{strokes:st.strokes});setTimeout(()=>{if(!done){$('submit').disabled=false;$('status').textContent='尚未確認交卷，請重試或下載作答圖'}},6000)};
setInterval(()=>{if(st.no&&!ready&&!done)send('join',{no:st.no})},4000);
</script></body></html>
