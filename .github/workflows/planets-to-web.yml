name: Convert planets PPT to web slides
on:
  push:
    paths:
      - 'teaching-slides/*.pptx'
      - '.github/workflows/planets-to-web.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install slide renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress poppler-utils fonts-noto-cjk
      - name: Render PPTX into JPEG slides
        shell: bash
        run: |
          set -euo pipefail
          pptx=$(find teaching-slides -maxdepth 1 -name '*21頁.pptx' -print -quit)
          test -n "$pptx"
          mkdir -p /tmp/planet-render
          libreoffice -env:UserInstallation=file:///tmp/fundesk-planets-lo --headless --convert-to pdf --outdir /tmp/planet-render "$pptx"
          pdf=$(find /tmp/planet-render -maxdepth 1 -name '*.pdf' -print -quit)
          test -s "$pdf"
          count=$(pdfinfo "$pdf" | awk '/^Pages:/{print $2}')
          test "$count" -eq 21
          mkdir -p teaching-slides/planet-web/pages
          rm -f teaching-slides/planet-web/pages/slide-*.jpg
          pdftoppm -f 1 -l 21 -r 128 -jpeg -jpegopt quality=88,optimize=y -forcenum "$pdf" teaching-slides/planet-web/pages/slide
          test "$(find teaching-slides/planet-web/pages -maxdepth 1 -name 'slide-*.jpg' | wc -l)" -eq 21
      - name: Commit rendered pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teaching-slides/planet-web/pages
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m "Render planets presentation into 21 browser-viewable slides"
            git push
          fi
