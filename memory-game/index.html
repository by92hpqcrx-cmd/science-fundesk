<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e3f8ec">
<title>🐾 記憶翻牌遊戲｜FunDesk</title>
<link rel="icon" type="image/svg+xml" href="../fundesk-app-icon.svg">
<link rel="stylesheet" href="./game.css?v=20261120-square-space-v2"><style>#soloSetup[hidden],#soloStudent[hidden],#guestName[hidden],#retryRecord[hidden]{display:none!important}#soloSetup select,#soloSetup input{font:inherit;padding:7px;border:1px solid #8ab8a1;border-radius:8px}#soloSetup details{max-width:100%}#ranking{margin:6px 0;padding-left:28px}</style></head>
<body>
<div class="shell" id="shell">
  <header class="topbar">
    <a class="home" href="../index.html" title="返回 FunDesk"><img src="../fundesk-app-icon.svg" alt="FD 小黑板"><span>FunDesk</span></a>
    <div class="heading"><strong>🐾 記憶翻牌遊戲</strong><span>記憶力大挑戰 · 班寵、星座、星球三種主題！</span></div>
    <div class="toptools">
      <span id="chosenPet" class="chosenPet" hidden></span>
      <button id="fullscreen" class="tool" type="button">⛶ 全螢幕</button>
      <button id="sound" class="tool" type="button" aria-pressed="false">🔈 音效關</button>
    </div>
  </header>
  <section class="categorySelector" aria-label="選擇翻牌主題">
    <strong>🎴 選擇翻牌主題</strong>
    <label><input type="radio" name="category" value="pets" checked><span>🐾 班寵翻翻樂</span></label>
    <label><input type="radio" name="category" value="constellations"><span>✨ 星座翻翻樂</span></label>
    <label><input type="radio" name="category" value="planets"><span>🪐 星球翻翻樂</span></label>
    <small id="categoryHint">🐾 班級寵物圖片配對</small>
  </section>
  <section class="toolbar" aria-label="遊戲設定與成績">
    <fieldset class="levels"><legend>選擇難度</legend>
      <label><input type="radio" name="level" value="24" checked><span>🌱 簡單 <b>24 張</b></span></label>
      <label><input type="radio" name="level" value="36"><span>🌻 中等 <b>36 張</b></span></label>
      <label><input id="hardLevel" type="radio" name="level" value="48"><span>🚀 困難 <b id="hardCount">48 張</b></span></label>
    </fieldset>
    <div class="stats" aria-live="polite">
      <div><small>已配對</small><strong id="pairs">0 / 12</strong></div>
      <div><small>翻牌次數</small><strong id="moves">0</strong></div>
      <div><small>遊戲時間</small><strong id="time">00:00</strong></div>
    </div>
    <button class="restart" id="restart" type="button">🔄 重新開始</button>
  </section>
  <section class="multiplayer" aria-label="計分模式及玩家設定">
    <div class="modeRow"><strong>🎯 遊戲模式</strong><label><input type="radio" name="mode" value="solo" checked> 個人記憶挑戰</label><label><input type="radio" name="mode" value="multi"> 🏆 多人競賽模式</label><span id="rosterState" role="status">從 FunDesk 開啟可選擇班級學生</span></div>
    <div id="soloSetup" style="padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label>參賽身分 <select id="soloKind"><option value="practice">自由練習</option><option value="student">班級學生</option><option value="guest">訪客／手動輸入</option></select></label><select id="soloStudent" hidden><option value="">選擇學生</option></select><input id="guestName" hidden maxlength="30" placeholder="輸入參賽姓名" aria-label="參賽姓名"><button id="soloStart" type="button" class="restart">開始挑戰</button><span id="soloNotice">自由練習（不登錄）</span><details><summary>🏆 跨班前三名</summary><small>同主題及難度共用榜單｜加權值＝配對嘗試次數 × 5＋秒數，越低越好</small><ol id="ranking"></ol></details></div><div id="playerSetup" class="playerSetup" hidden>
      <div class="playerIntro"><strong id="rosterClass">選擇競賽學生</strong><span>配對成功 +10 分並繼續翻牌；沒有配對成功則換下一位。</span></div>
      <label class="playerCountLabel" for="playerCount">參賽人數 <select id="playerCount" aria-label="參賽人數"><option value="2">2 人</option><option value="3">3 人</option><option value="4" selected>4 人</option><option value="5">5 人</option><option value="6">6 人</option></select></label>
      <div class="playerSelectors" id="playerSelectors"></div>
      <button id="startMatch" type="button" class="restart">🎮 開始多人競賽</button>
    </div>
    <div id="scoreboard" class="scoreboard" hidden aria-live="polite"></div>
    <div id="turnNotice" class="turnNotice" hidden aria-live="polite"></div>
  </section>
  <main class="playarea">
    <div class="decor" aria-hidden="true">☀️　✦　🌈　✧　☁️</div>
    <div id="board" class="board" role="group" aria-label="記憶翻牌區"></div>
  </main>
  <div class="footnote">每種圖案有四張相同的牌；任選兩張相同圖案即可配對成功。完成全部配對即可過關！</div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <dialog id="winDialog" class="winDialog">
    <div class="winMascot">🏆 🐾 🎉</div><h2>恭喜！全部配對成功</h2>
    <p id="winResult"></p><p id="recordStatus" role="status"></p><button id="retryRecord" type="button" hidden>重試登錄</button><div class="winButtons">
      <button id="again" class="restart" type="button">再玩一次</button>
      <button id="closeWin" class="tool" type="button">查看完成牌面</button>
    </div>
  </dialog>
</div>
<script src="./cards-data.js?v=20261120-square-space-v2" defer></script>
<script src="./aquila-replacement.js?v=20261120-square-space-v2" defer></script>
<script src="./game.js?v=20261127-solo-ranking" defer></script>
</body></html>
