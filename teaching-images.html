<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FunDesk｜教師私人教學圖片庫</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf6fb;color:#173752;font:17px/1.5 system-ui,"Noto Sans TC",sans-serif}
main{max-width:1350px;margin:auto;padding:18px}h1{font-size:clamp(27px,3vw,40px);margin:0}
h2{margin:0 0 15px}header{background:linear-gradient(100deg,#d6f4ff,#e5f8e4);border:1px solid #c5e3ed;border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button,.btn{display:inline-block;cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#126a9b;color:white;font:700 16px system-ui,"Noto Sans TC";text-decoration:none}
button:disabled{opacity:.55;cursor:wait}.secondary{background:#dbeaf5;color:#194666}.danger{background:#ac4051}
.panel{background:white;border:1px solid #d6e5ed;border-radius:18px;margin:15px 0;padding:19px;box-shadow:0 4px 15px #0a345316}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}input[type=search],input[type=email],input[type=password]{padding:13px;border-radius:11px;border:1px solid #b1cfdb;font:inherit;min-width:230px}
input[type=search]{flex:1}.usage{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:13px}
.meter{width:230px;max-width:100%;height:15px;background:#dce8ed;border-radius:15px;overflow:hidden}
#fill{height:100%;width:0;background:#21a485}.small{color:#527087;font-size:15px}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.tile{background:white;border:1px solid #d1e3ec;border-radius:15px;overflow:hidden}
.pic{height:180px;display:grid;place-items:center;background:#e9f4fa;cursor:pointer}
.pic img{max-width:100%;max-height:100%;object-fit:contain}.info{padding:13px;overflow-wrap:anywhere}.filename{font-weight:800;min-height:48px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.actions button{font-size:14px;padding:8px 11px}
#status{min-height:25px;margin:8px 0;font-weight:700}#status.err{color:#ab2536}
#login{max-width:550px;margin:35px auto}#login label{display:block;margin:12px 0 5px;font-weight:700}#login input{width:100%}
.note{background:#fff6d9;border-left:5px solid #eebc46;border-radius:8px;padding:10px 14px}
dialog{border:0;border-radius:16px;background:#101d2d;color:white;max-width:97vw;max-height:97vh;padding:16px}
dialog::backdrop{background:#05101cdd}
.viewerBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
#viewport{width:min(95vw,1450px);height:min(79vh,900px);overflow:auto;display:grid;place-items:center}
#big{max-width:92%;max-height:92%;width:auto;height:auto;transform:scale(var(--z,1));transform-origin:center}
[hidden]{display:none!important}@media(max-width:500px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.pic{height:140px}.actions button{flex:1}}
</style></head><body><main>
<header><div><h1>🖼️ 教學圖片</h1><div class="small">FunDesk · 教師專屬雲端圖片庫 · 每人 20 MB</div></div><a class="btn secondary" href="./index.html">← 返回 FunDesk</a></header>
<section class="panel" id="login" hidden><h2>🔐 教師登入</h2><p>僅限已獲授權的 FunDesk 教師，登入後可跨裝置使用。</p><form id="loginform"><label for="email">教師電子郵件</label><input id="email" type="email" required autocomplete="username"><label for="password">密碼</label><input id="password" type="password" required autocomplete="current-password"><p><button type="submit">登入私人圖片庫</button></p></form></section>
<section id="app" hidden><div class="panel">
<div class="controls"><label class="btn" for="upload">＋ 上傳圖片</label><input id="upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
<input type="search" id="search" placeholder="搜尋圖片名稱" aria-label="搜尋圖片名稱">
<button class="secondary" id="reload">↻ 同步</button><button class="secondary" id="fullscreen">⛶ 全螢幕</button><button class="secondary" id="logout">登出</button></div>
<div class="usage"><strong id="quota">0.00 / 20.00 MB</strong><div class="meter" role="progressbar" aria-label="容量使用量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><div id="fill"></div></div><span class="small" id="account"></span></div></div>
<p id="status" aria-live="polite"></p><div id="gallery"></div>
<p class="small">圖片只存放在 Supabase 私有 Storage；跨裝置登入同一教師帳號後同步。圖片不會公開給學生或其他教師。</p></section>
<dialog id="lightbox"><div class="viewerBar"><strong id="viewname"></strong><button class="secondary" id="minus">－</button><span id="zoomtext">100%</span><button class="secondary" id="plus">＋</button><button class="secondary" id="close">關閉</button></div><div id="viewport"><img id="big" alt=""></div></dialog>
<p id="bootstatus" class="note">正在檢查教師登入狀態…</p>
</main><script>
"use strict";
const URL_BASE="https://ayvwsexnxvjjcrbtyoof.supabase.co";
const PUBLIC_KEY="sb_publishable_Z2rS84mJC4BK-h4oLsNNjw_CdQz240L";
const BUCKET="fundesk-teaching-images", LIMIT=20*1024*1024;
const $=id=>document.getElementById(id);
let session=null, user=null, images=[], previews=[], zoom=1, lastAction=Date.now(),busy=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(n/1048576).toFixed(2)+" MB";
function status(msg,error=false){$("status").textContent=msg;$("status").className=error?"err":""}
function touch(){lastAction=Date.now()}
for(const e of ["pointerdown","keydown","touchstart"])document.addEventListener(e,touch,{passive:true});
setInterval(()=>{if(session && Date.now()-lastAction>40*60*1000)void logout(true)},60000);
function setSession(s){session=s;user=s?.user||null;if(s)sessionStorage.setItem("fundesk_cloud_session",JSON.stringify(s));else sessionStorage.removeItem("fundesk_cloud_session")}
async function fetchApi(path,opts={},tokenNeeded=true){
 let headers={"apikey":PUBLIC_KEY,...opts.headers};
 if(tokenNeeded){await tokenCheck();headers.Authorization="Bearer "+session.access_token}
 const r=await fetch(URL_BASE+path,{...opts,headers,cache:"no-store"});
 let body=null;const type=r.headers.get("content-type")||"";
 if(type.includes("json"))body=await r.json();else body=await r.text();
 if(!r.ok)throw Error(body?.message||body?.error_description||body?.error||("雲端連線 HTTP "+r.status));
 return body;
}
async function refreshToken(){
 if(!session?.refresh_token)throw Error("登入已失效，請重新登入");
 const data=await fetchApi("/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})},false);
 setSession(data);
}
async function tokenCheck(){if(!session?.access_token)throw Error("請先登入");const expires=Number(session.expires_at||0);if(expires && Date.now()/1000>expires-60)await refreshToken()}
async function login(email,password){
 const data=await fetchApi("/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})},false);
 setSession(data);await enter()
}
async function authorized(){const d=await fetchApi("/rest/v1/rpc/fundesk_teaching_images_allowed",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});if(d!==true)throw Error("此帳戶不是獲授權的正式教師，無法使用私人圖片庫")}
async function enter(){await authorized();$("login").hidden=true;$("app").hidden=false;$("bootstatus").hidden=true;$("account").textContent=session.user?.email||"";await load()}
function showLogin(msg){$("login").hidden=false;$("app").hidden=true;$("bootstatus").hidden=true;if(msg)status(msg,true),$("bootstatus").textContent=msg,$("bootstatus").hidden=false}
async function load(){
 const list=await fetchApi("/rest/v1/fundesk_teaching_images?select=id,filename,object_path,size_bytes,mime_type,created_at&order=created_at.desc");
 images=Array.isArray(list)?list:[];const used=images.reduce((x,a)=>x+Number(a.size_bytes),0);
 $("quota").textContent=fmt(used)+" / 20.00 MB";$("fill").style.width=Math.min(100,used/LIMIT*100)+"%";$("meter").setAttribute("aria-valuenow",String(Math.round(used/LIMIT*100)));
 await render()
}
function clearURLs(){for(const u of previews)URL.revokeObjectURL(u);previews=[]}
async function signed(path){const d=await fetchApi("/storage/v1/object/sign/"+BUCKET+"/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({expiresIn:3600})});const s=d.signedURL||d.signedUrl;if(!s)throw Error("無法取得圖片預覽");return s.startsWith("/object/")?URL_BASE+"/storage/v1"+s:new URL(s,URL_BASE).href}
async function render(){
 clearURLs();const area=$("gallery");area.replaceChildren();
 const search=$("search").value.toLocaleLowerCase(),shown=images.filter(i=>i.filename.toLocaleLowerCase().includes(search));
 if(!shown.length){area.innerHTML='<div class="panel">目前沒有圖片。可使用「＋ 上傳圖片」新增教學圖片。</div>';return}
 for(const item of shown){
 const tile=document.createElement("article");tile.className="tile";
 const pic=document.createElement("div");pic.className="pic";const img=document.createElement("img");img.alt=item.filename;img.loading="lazy";pic.append(img);
 signed(item.object_path).then(u=>{if(tile.isConnected)img.src=u}).catch(()=>{img.alt="無法預覽"});
 pic.addEventListener("click",()=>view(item));
 const info=document.createElement("div");info.className="info";
 const title=document.createElement("div");title.className="filename";title.textContent=item.filename;
 const size=document.createElement("div");size.className="small";size.textContent=fmt(Number(item.size_bytes));
 const actions=document.createElement("div");actions.className="actions";
 const b1=document.createElement("button");b1.textContent="放大";b1.onclick=()=>view(item);
 const b2=document.createElement("button");b2.className="secondary";b2.textContent="下載";b2.onclick=()=>download(item);
 const b3=document.createElement("button");b3.className="danger";b3.textContent="刪除";b3.onclick=()=>del(item);
 actions.append(b1,b2,b3);info.append(title,size,actions);tile.append(pic,info);area.append(tile)
 }
}
async function uploadFile(file){
 if(!["image/png","image/jpeg","image/webp","image/gif"].includes(file.type))throw Error("只接受 PNG、JPG、WEBP、GIF 圖片");
 if(file.size<1 || file.size>LIMIT)throw Error("單張圖片大小不符規定");
 const used=images.reduce((n,i)=>n+Number(i.size_bytes),0);
 if(used+file.size>LIMIT)throw Error("剩餘容量不足 20 MB，請先刪除圖片");
 const reserved=await fetchApi("/rest/v1/rpc/fundesk_teaching_images_reserve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p_filename:file.name.slice(0,180),p_size_bytes:file.size,p_mime_type:file.type})});
 const row=Array.isArray(reserved)?reserved[0]:reserved;
 if(!row?.image_id || !row?.object_path)throw Error("建立圖片紀錄失敗");
 try{
 await fetchApi("/storage/v1/object/"+BUCKET+"/"+row.object_path,{method:"POST",headers:{"Content-Type":file.type,"x-upsert":"false","cache-control":"3600"},body:file});
 }catch(e){
 try{await fetchApi("/rest/v1/rpc/fundesk_teaching_images_cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p_image_id:row.image_id})})}catch{}
 throw e
 }
}
async function removeObject(path){await fetchApi("/storage/v1/object/"+BUCKET,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({prefixes:[path]})})}
async function del(item){
 if(!confirm("確定永久刪除「"+item.filename+"」？"))return;
 try{await removeObject(item.object_path);
 await fetchApi("/rest/v1/rpc/fundesk_teaching_images_cancel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p_image_id:item.id})});
 await load();status("圖片已刪除，容量已釋出")
 }catch(e){status("刪除失敗："+e.message,true)}
}
async function download(item){try{
 const u=await signed(item.object_path),r=await fetch(u);if(!r.ok)throw Error("下載失敗");
 const blob=await r.blob(),url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=item.filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)
 }catch(e){status(e.message,true)}}
async function view(item){try{$("viewname").textContent=item.filename;$("big").src=await signed(item.object_path);zoom=1;applyZoom();$("lightbox").showModal()}catch(e){status(e.message,true)}}
function applyZoom(){$("big").style.setProperty("--z",zoom);$("zoomtext").textContent=Math.round(zoom*100)+"%"}
$("plus").onclick=()=>{zoom=Math.min(5,zoom+.25);applyZoom()};$("minus").onclick=()=>{zoom=Math.max(.5,zoom-.25);applyZoom()};$("close").onclick=()=>$("lightbox").close();
$("search").oninput=()=>void render();$("reload").onclick=async()=>{try{await load();status("已同步最新圖片")}catch(e){status(e.message,true)}};
$("fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){status(e.message,true)}};
$("upload").onchange=async e=>{
 const files=[...e.target.files];e.target.value="";if(busy)return;busy=true;let count=0,errors=[];
 try{for(const f of files){status("正在上傳 "+f.name);try{await uploadFile(f);count++;await load()}catch(x){errors.push(f.name+"："+x.message)}}status("成功上傳 "+count+" 張。"+(errors.length?" 未成功："+errors.join("；"):""),errors.length>0)}
 finally{busy=false}
};
$("loginform").onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector("button");btn.disabled=true;try{await login($("email").value.trim(),$("password").value);$("password").value="";status("已登入教師私人圖片庫")}catch(err){showLogin("登入失敗："+err.message)}finally{btn.disabled=false}};
async function logout(idle=false){if(!idle && !confirm("確定登出？"))return;try{if(session)await fetchApi("/auth/v1/logout?scope=local",{method:"POST"},true)}catch{}setSession(null);location.href="./index.html"}
$("logout").onclick=()=>logout();
(async()=>{try{const saved=sessionStorage.getItem("fundesk_cloud_session");if(saved){setSession(JSON.parse(saved));await enter()}else showLogin()}catch(e){setSession(null);showLogin("請先登入，或請管理員先在 Supabase 執行教學圖片資料庫設定："+e.message)}})();
</script></body></html>
