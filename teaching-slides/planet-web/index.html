<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🪐 八大行星英文與神話｜FunDesk 課堂播放</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08142a;color:#eef6ff;font-family:system-ui,'Noto Sans TC',sans-serif;height:100dvh;overflow:hidden}button{cursor:pointer;border:1px solid #5b779c;background:#19345a;color:#fff;border-radius:13px;padding:10px 17px;font:700 16px system-ui,'Noto Sans TC',sans-serif}button:disabled{opacity:.35;cursor:not-allowed}button:hover:not(:disabled){background:#32547d}main{display:flex;flex-direction:column;height:100dvh;min-height:0}.top{height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 18px;background:#102647}.title{font-size:clamp(16px,2vw,24px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.counter{font-size:16px;color:#c4d9f2;font-variant-numeric:tabular-nums}.screen{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:#071327 url('../../backgrounds/space-faded.png') center/cover no-repeat}.slide{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;display:none}.slide.visible{display:block}.msg{position:absolute;max-width:700px;background:#102647e9;border:1px solid #7184a3;border-radius:17px;padding:24px;text-align:center;line-height:1.9;font-size:clamp(16px,2vw,23px)}.msg[hidden]{display:none}.bottom{display:flex;align-items:center;justify-content:center;gap:18px;padding:11px;background:#102647;min-height:72px}.progress{position:absolute;left:0;right:0;bottom:72px;height:4px;background:#254268}.progress>div{height:100%;background:#93c7ff;transition:width .2s}.hint{font-size:13px;color:#bfcee4}.spinner{animation:spin 1s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}:fullscreen main{height:100dvh}@media(max-width:700px){.top{height:54px;padding:7px 11px}.bottom{gap:7px;min-height:60px;padding:5px}.bottom button{padding:9px 12px;font-size:14px}.hint{display:none}.progress{bottom:60px}}
</style></head><body><main>
<header class="top"><span class="title">🪐 八大行星英文與神話</span><span class="counter" id="count">01 / 21</span></header>
<div class="screen" id="screen">
<img id="slide" class="slide" draggable="false" alt="八大行星教學投影片">
<div class="msg" id="msg"><span class="spinner">◌</span> 正在載入第 1 頁…</div>
</div><div class="progress"><div id="bar" style="width:4.76%"></div></div>
<footer class="bottom">
<button id="prev" type="button">← 上一頁</button><button id="next" type="button">下一頁 →</button>
<button id="full" type="button">⛶ 全螢幕</button><span class="hint">← → 方向鍵翻頁・Esc 退出全螢幕</span>
</footer></main>
<script>
(()=>{'use strict';
const TOTAL=21,slide=document.getElementById('slide'),msg=document.getElementById('msg'),count=document.getElementById('count'),bar=document.getElementById('bar'),prev=document.getElementById('prev'),next=document.getElementById('next'),full=document.getElementById('full');
let page=1,request=0;
const pageUrl=n=>'pages/slide-'+String(n).padStart(2,'0')+'.jpg';
function show(n){
 page=Math.min(TOTAL,Math.max(1,n));const serial=++request;
 count.textContent=String(page).padStart(2,'0')+' / '+TOTAL;
 bar.style.width=(page/TOTAL*100)+'%';prev.disabled=page===1;next.disabled=page===TOTAL;
 slide.classList.remove('visible');msg.hidden=false;msg.textContent='載入第 '+page+' 頁…';
 const im=new Image();
 im.onload=()=>{if(serial!==request)return;slide.src=im.src;slide.alt='第 '+page+' 頁，共 '+TOTAL+' 頁';slide.classList.add('visible');msg.hidden=true};
 im.onerror=()=>{if(serial!==request)return;msg.hidden=false;msg.textContent='投影片圖片尚未完成部署或目前無法載入，請稍後重新整理網頁。';};
 im.src=pageUrl(page);
 if(history.replaceState)history.replaceState(null,'','#slide='+page);
}
prev.addEventListener('click',()=>show(page-1));next.addEventListener('click',()=>show(page+1));
full.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('此瀏覽器無法進入全螢幕')}});
document.addEventListener('fullscreenchange',()=>full.textContent=document.fullscreenElement?'↙ 退出全螢幕':'⛶ 全螢幕');
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(page+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(page-1)}else if(e.key==='Home'){show(1)}else if(e.key==='End'){show(TOTAL)}});
let startX=0;document.querySelector('#screen').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});document.querySelector('#screen').addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-startX;if(Math.abs(d)>45)show(page+(d<0?1:-1))},{passive:true});
const hash=parseInt(location.hash.replace('#slide=',''),10);show(Number.isFinite(hash)?hash:1);
})();
</script></body></html>
