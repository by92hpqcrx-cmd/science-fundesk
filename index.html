if(view==='schedule'){document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{document.body.dataset.week=b.dataset.week;render()});document.querySelectorAll('[data-prefill]').forEach(b=>b.onclick=()=>{const title=b.dataset.prefill,date=b.dataset.date;view='tasks';render();const f=$('newTask');f.elements.date.value=date;f.elements.type.value=title.includes('單元考')?'考試':'習作';f.elements.title.value=(title.includes('單元考')?'':'實驗後習作：')+title.replace(/（整節）/g,'');f.scrollIntoView({behavior:'smooth',block:'center'})})}
if(view==='students'){$('importCsvBtn').onclick=()=>$('csvImport').click();$('addStudent').onclick=()=>openAddStudent()}
if(view==='settings'){$('exportJson').onclick=backup;$('importJson').onclick=()=>$('jsonImport').click();$('resetClass').onclick=()=>{if(prompt(`要重設 ${cl} 班所有學生、出勤、習作、考試、點數，請輸入班級數字 ${cl}`)===cl){db.classes[cl]=makeState().classes[cl];save();render()}}}
if(view==='tools'){document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{clearInterval(timerTick);timerTick=null;timerSeconds=Number(b.dataset.time);$('timerShow').textContent=toMMSS(timerSeconds)});$('timerStart').onclick=()=>{if(timerTick){clearInterval(timerTick);timerTick=null;return}timerTick=setInterval(()=>{if(timerSeconds<=0){clearInterval(timerTick);timerTick=null;alert('時間到！');return}timerSeconds--;$('timerShow').textContent=toMMSS(timerSeconds)},1000)};$('timerReset').onclick=()=>{clearInterval(timerTick);timerTick=null;timerSeconds=300;$('timerShow').textContent=toMMSS(timerSeconds)};$('pickStudent').onclick=()=>{if(!students().length)return;let s=students()[Math.floor(Math.random()*students().length)];$('randomShow').textContent=s.no+'號 '+s.name}}
bindNewFeatures();
}
const toMMSS=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function openStudent(id){studentId=id;let s=student(id);if(!s)return;let abs=cls().attendance.filter(a=>a.sid===id&&a.status==='缺席').sort((a,b)=>b.date.localeCompare(a.date));let prs=cls().points.filter(a=>a.sid===id).sort((a,b)=>b.date.localeCompare(a.date));let unmet=pending(id);let active=cls().tasks.sort((a,b)=>b.date.localeCompare(a.date));const labIndex=layoutMap('lab').indexOf(id);const groupLabel=labIndex>=0?['第四組','第五組','第一組','第二組','第三組'][Math.floor(labIndex/6)]:'';$('modalContent').innerHTML=`<div class="studentHeader"><div><span class="pill">${cl} 班 · ${s.no} 號${groupLabel?' · 實驗'+groupLabel:''}</span><h2>${esc(s.name)}</h2><div class="hint">積點 ${ptotal(id)>0?'+':''}${ptotal(id)} · 缺席 ${abs.length} 次 · 待追蹤 ${unmet.length} 項</div></div><button class="btn small outline" id="editStudent">編輯學生</button></div><div class="twoCols"><div><h3 class="sectionLabel">快速登記出勤</h3><div class="row"><input type="date" id="studentAttDate" value="${$('sessionDate').value}"><button type="button" class="btn small ${att(id,$('sessionDate').value)==='缺席'?'danger':'outline'}" id="studentAttToggle">${att(id,$('sessionDate').value)}</button><span class="hint">點擊切換，只記錄缺席</span></div></div><div><h3 class="sectionLabel">課堂獎懲</h3><div class="row"><button class="btn small" data-delta="1">＋1</button><button class="btn small" data-delta="2">＋2</button><button class="btn small danger" data-delta="-1">－1</button><button class="btn small danger" data-delta="-2">－2</button></div><input id="pointReason" placeholder="加／扣點原因（建議填寫）" style="margin-top:9px;width:100%"></div></div><h3 class="sectionLabel">習作／實驗／考試進度</h3>${active.length?`<div class="tablewrap"><table><thead><tr><th>日期</th><th>類型／名稱</th><th>狀態</th></tr></thead><tbody>${active.map(t=>`<tr><td>${t.date.slice(5)}</td><td><span class="pill">${t.type}</span> ${esc(t.title)}</td><td><select data-student-task="${t.id}">${taskStatusOptions(t.type).map(opt=>`<option ${taskStatus(t.id,id)===opt?'selected':''}>${opt}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:'<div class="emptymsg">尚無追蹤項目，請到「習作／實驗／考試」建立。</div>'}<div class="twoCols"><div><h3 class="sectionLabel">缺席日期</h3>${abs.length?abs.map(x=>`<div class="record">${x.date}</div>`).join(''):'<p class="hint">目前無缺席紀錄</p>'}</div><div><h3 class="sectionLabel">待完成／待補考</h3>${unmet.length?unmet.map(x=>{let t=cls().tasks.find(t=>t.id===x.taskId);return `<div class="record"><span>${t?.date||''}</span> ${esc(t?.title||'')} <b>${esc(x.status)}</b></div>`}).join(''):'<p class="hint">目前沒有待處理的項目</p>'}</div></div><h3 class="sectionLabel">獎懲歷程</h3>${prs.length?prs.slice(0,12).map(p=>`<div class="record"><span>${p.date}</span> <strong class="${p.delta>0?'pointsPositive':'pointsNegative'}">${p.delta>0?'+':''}${p.delta}</strong> ${esc(p.reason||'課堂表現')}</div>`).join(''):'<p class="hint">尚無獎懲紀錄</p>'}<h3 class="sectionLabel">老師備註</h3><textarea id="studentNote">${esc(s.notes||'')}</textarea><div class="actions"><button id="saveStudentNote" class="btn small outline">儲存備註</button></div>`;
 $('modal').classList.remove('hidden');$('editStudent').onclick=()=>{let name=prompt('修改學生姓名',s.name);if(name===null)return;name=name.trim();if(!name)return alert('姓名不可空白');s.name=name;save();openStudent(id);render()};
 const refreshStudentAtt=()=>{const date=$('studentAttDate').value,absent=att(id,date)==='缺席',b=$('studentAttToggle');b.textContent=absent?'缺席':'出席';b.classList.toggle('danger',absent);b.classList.toggle('outline',!absent)};
 $('studentAttDate').onchange=refreshStudentAtt;
 $('studentAttToggle').onclick=()=>{let date=$('studentAttDate').value;if(!date)return;recordAttendance(id,date,att(id,date)!=='缺席');openStudent(id);$('studentAttDate').value=date;refreshStudentAtt();statCards()};
 document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>{let delta=Number(b.dataset.delta);cls().points.push({sid:id,date:$('sessionDate').value,delta,reason:$('pointReason').value.trim()||'課堂表現'});save();openStudent(id);statCards()});
 document.querySelectorAll('[data-student-task]').forEach(e=>e.onchange=()=>{let tid=e.dataset.studentTask,rec=taskResult(tid,id);if(rec)rec.status=e.value;else cls().results.push({sid:id,taskId:tid,status:e.value,note:''});save();openStudent(id);statCards()});
 $('saveStudentNote').onclick=()=>{s.notes=$('studentNote').value;save();alert('備註已儲存')};}
function openAddStudent(){let no=prompt('新增學生的座號',String(students().length+1));if(no===null)return;no=Number(no);if(!Number.isInteger(no)||no<1||students().some(s=>s.no===no))return alert('請輸入尚未使用的正整數座號');let name=prompt('學生姓名');if(!name||!name.trim())return;students().push({id:uid(),no,name:name.trim(),notes:''});save();render()}
function download(name,text,type='text/plain;charset=utf-8'){let blob=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function backup(){download('自然科任七班備份_'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
const csvEscape=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
function exportCsv(kind){let rows=kind==='students'?[['座號','姓名','備註'],...students().map(s=>[s.no,s.name,s.notes])]:[['班級','座號','姓名','項目日期','類型','項目','狀態','備註'],...cls().results.filter(r=>['未繳交','待訂正','未完成','未交','缺考','待補考','補考未完成'].includes(r.status)).map(r=>{let s=student(r.sid),t=cls().tasks.find(t=>t.id===r.taskId);return [cl,s?.no,s?.name,t?.date,t?.type,t?.title,r.status,r.note]})];download(`${cl}_${kind==='students'?'學生名單':'待追蹤清單'}.csv`,'\uFEFF'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let out=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))out.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);out.push(row)}return out}
async function decodeStudentCSV(file){
 const bytes=new Uint8Array(await file.arrayBuffer());
 if(!bytes.length)throw Error('CSV 檔案是空的');
 let encoding='UTF-8',text='';
 const decode=(enc,fatal=true)=>new TextDecoder(enc,{fatal}).decode(bytes);
 if(bytes[0]===0xFF&&bytes[1]===0xFE){encoding='UTF-16 LE';text=decode('utf-16le')}
 else if(bytes[0]===0xFE&&bytes[1]===0xFF){encoding='UTF-16 BE';text=decode('utf-16be')}
 else if(bytes.length>4&&bytes[1]===0&&bytes[3]===0){encoding='UTF-16 LE';text=decode('utf-16le')}
 else{try{text=decode('utf-8')}catch(_){encoding='Big5／ANSI';text=decode('big5')}}
 text=text.replace(/^\uFEFF/,'');
 if(text.includes('\uFFFD'))throw Error('偵測到無法辨識的文字，已停止匯入，以免將學生姓名變成亂碼。請在 Excel 另存成「CSV UTF-8（逗號分隔）」後再試。');
 return {text,encoding};
}
$('csvImport').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const {text,encoding}=await decodeStudentCSV(f);
  const rows=parseCSV(text);let skipped=0;
  const first=rows[0]?.map(x=>x.trim().replace(/^\uFEFF/,''))||[];
  let noCol=first.findIndex(x=>x==='座號'),nameCol=first.findIndex(x=>x==='姓名');
  let body=rows;
  if(noCol>=0&&nameCol>=0)body=rows.slice(1);else {noCol=0;nameCol=1}
  const found=[];
  body.forEach(row=>{let no=Number((row[noCol]||'').trim()),name=(row[nameCol]||'').trim();if(Number.isInteger(no)&&no>0&&name&&!name.includes('\uFFFD')&&!found.some(x=>x.no===no))found.push({no,name});else skipped++});
  if(!found.length){alert('無有效資料。CSV 必須包含「座號,姓名」兩欄，或前兩欄依序為座號、姓名。');return}
  const preview=found.slice(0,12).map(x=>`${x.no} 號 ${x.name}`).join('\n');
  const more=found.length>12?`\n……另外 ${found.length-12} 位`:'';
  if(!confirm(`CSV 解碼方式：${encoding}\n匯入班級：${cl} 班\n有效學生：${found.length} 位（略過 ${skipped} 列）\n\n【姓名預覽】\n${preview}${more}\n\n請先確認中文姓名正確，並備份原資料。確定匯入？\n\n提醒：只有「座號和姓名都相同」的原紀錄會保留；不同者會視為新學生。`))return;
  const old=students(),newS=found.map(r=>{let prev=old.find(x=>x.no===r.no&&x.name===r.name);return prev?{...prev}:{id:uid(),no:r.no,name:r.name,notes:''}});
  const allowed=new Set(newS.map(x=>x.id));
  cls().students=newS;cls().seats.normal=[];cls().seats.lab=[];
  cls().attendance=cls().attendance.filter(x=>allowed.has(x.sid));
  cls().results=cls().results.filter(x=>allowed.has(x.sid));
  cls().points=cls().points.filter(x=>allowed.has(x.sid));
  save();render();alert(`已匯入 ${newS.length} 位學生，略過 ${skipped} 列。中文編碼：${encoding}。`);
 }catch(err){alert('學生名單匯入失敗：'+(err?.message||String(err)))}finally{e.target.value=''}
};
$('jsonImport').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!o.classes||!CLASSES.every(c=>Array.isArray(o.classes[c]?.students)))throw Error('備份格式不符');if(!confirm('還原會覆蓋目前七班的所有紀錄。確定要繼續？'))return;db=o;save();render();alert('已還原七班資料')}catch(err){alert('無法還原：'+err.message)}e.target.value=''};
$('classSelect').innerHTML=CLASSES.map(x=>`<option value="${x}">${x} 班</option>`).join('');$('classSelect').onchange=e=>changeClass(e.target.value);$('sessionDate').value=today()<'2026-11-16'?'2026-11-16':today();$('sessionDate').onchange=()=>render();$('backupTop').onclick=backup;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(timerTick){clearInterval(timerTick);timerTick=null}render()});document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>$('modal').classList.add('hidden'));
loadQuestionBank();
render();
})();
