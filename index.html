  if(noCol>=0&&nameCol>=0)body=rows.slice(1);else {noCol=0;nameCol=1}
  const found=[];
  body.forEach(row=>{let no=Number((row[noCol]||'').trim()),name=(row[nameCol]||'').trim();if(Number.isInteger(no)&&no>0&&name&&!name.includes('\uFFFD')&&!found.some(x=>x.no===no))found.push({no,name});else skipped++});
  if(!found.length){alert('無有效資料。CSV 必須包含「座號,姓名」兩欄，或前兩欄依序為座號、姓名。');return}
  const preview=found.slice(0,12).map(x=>`${x.no} 號 ${x.name}`).join('\n');
  const more=found.length>12?`\n……另外 ${found.length-12} 位`:'';
  if(!confirm(`CSV 解碼方式：${encoding}\n匯入班級：${classDisplay(cl)}\n有效學生：${found.length} 位（略過 ${skipped} 列）\n\n【姓名預覽】\n${preview}${more}\n\n請先確認中文姓名正確，並備份原資料。確定匯入？\n\n提醒：只有「座號和姓名都相同」的原紀錄會保留；不同者會視為新學生。`))return;
  const old=students(),newS=found.map(r=>{let prev=old.find(x=>x.no===r.no&&x.name===r.name);return prev?{...prev}:{id:uid(),no:r.no,name:r.name,notes:''}});
  const allowed=new Set(newS.map(x=>x.id));
  cls().students=newS;cls().seats.normal=[];cls().seats.lab=[];
  cls().attendance=cls().attendance.filter(x=>allowed.has(x.sid));
  cls().results=cls().results.filter(x=>allowed.has(x.sid));
  cls().points=cls().points.filter(x=>allowed.has(x.sid));
  save();render();alert(`已匯入 ${newS.length} 位學生，略過 ${skipped} 列。中文編碼：${encoding}。`);
 }catch(err){alert('學生名單匯入失敗：'+(err?.message||String(err)))}finally{e.target.value=''}
};

  const names=Object.keys(o.classes).filter(c=>/^[A-Za-z0-9_-]{1,40}$/.test(c)&&Array.isArray(o.classes[c]?.students));

// 全站使用內建的 Supabase 專案連線設定；不再讓舊瀏覽器設定覆蓋。
const CLOUD_CONFIG_KEY='fundesk_cloud_public_config_v1';
const cloudConfig={url:'https://ayvwsexnxvjjcrbtyoof.supabase.co',key:'sb_publishable_Z2rS84mJC4BK-h4oLsNNjw_CdQz240L'};
let cloudSession=null,cloudReady=false,cloudBlocked=false,cloudQueue=Promise.resolve(),cloudOutstanding=0;
let cloudRevisions={},cloudSnapshots={};
const cloudIds=()=>[...CLASSES,'shared'];
function cloudGateMessage(html){$('cloudGateBody').innerHTML=html}
function cloudStatus(message,isError=false){const el=$('cloudStatus');el.textContent=message;el.classList.toggle('error',isError)}
function cloudErr(e){return String(e?.message||e||'連線失敗').replace(/</g,'&lt;')}
function cloudValidatedConfig(){
 const url=String(cloudConfig.url||'').trim().replace(/\/+$/,'');
 if(!/^https:\/\/[a-zA-Z0-9-]+\.supabase\.co$/.test(url))throw Error('Supabase URL 請填 https://專案ID.supabase.co（不要加 /rest/v1/）');
 const key=String(cloudConfig.key||'').trim();
 if(!key)throw Error('此瀏覽器尚未儲存 Supabase 公開金鑰，無法登入雲端。請由網站管理者先完成連線設定。');
 if(key.startsWith('sb_secret_'))throw Error('禁止使用 secret key');
 if(key.split('.').length===3){try{const p=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(p.role==='service_role')throw Error('禁止使用 service_role 金鑰')}catch(e){if(String(e.message).includes('service_role'))throw e}}
 return {url,key};
}
async function cloudFetch(path,opts={},isAuth=false,retry=true){
 const {url,key}=cloudValidatedConfig();
 const headers={'apikey':key,...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})};
 if(!isAuth&&cloudSession?.access_token)headers.Authorization='Bearer '+cloudSession.access_token;
 let response;
 try{response=await fetch(url+path,{...opts,headers,cache:'no-store'})}catch(e){throw Error('無法連接 Supabase。請檢查網路、URL 或瀏覽器封鎖設定：'+e.message)}
 if(response.status===401&&!isAuth&&retry&&cloudSession?.refresh_token){await cloudRefresh();return cloudFetch(path,opts,false,false)}
 const content=await response.text();let result;
 try{result=content?JSON.parse(content):null}catch{result=content}
 if(!response.ok)throw Error(`HTTP ${response.status}：${typeof result==='object'?(result.message||JSON.stringify(result)):result}`);
 return result;
}
async function cloudRefresh(){
 if(!cloudSession?.refresh_token)throw Error('登入已過期，請重新登入');
 const sess=await cloudFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})},true);
 if(!sess.access_token)throw Error('更新登入憑證失敗');
 cloudSession={...sess};
 sessionStorage.setItem('fundesk_cloud_session',JSON.stringify(cloudSession));
}
function cloudLoginForm(error=''){
 document.body.classList.add('cloud-locked');$('cloudGate').hidden=false;
 const showError=error?`<div class="cloudError">${esc(error)}</div>`:'';
 cloudGateMessage(`<div class="cloudNote">使用教師帳號登入後，才能讀取及同步學生紀錄。</div>${showError}
 <form id="cloudLoginForm"><label>教師電子郵件</label><input id="cloudEmail" type="email" autocomplete="username" required placeholder="teacher@example.edu.tw"><label>教師密碼</label><input id="cloudPassword" type="password" autocomplete="current-password" required placeholder="Supabase Auth 帳號密碼"><button type="submit">登入並同步我的班級</button></form>
 `);
 $('cloudLoginForm').onsubmit=async e=>{e.preventDefault();const email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;const b=e.target.querySelector('button');b.disabled=true;b.textContent='登入中…';try{
  const sess=await cloudFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})},true);
  cloudSession=sess;sessionStorage.setItem('fundesk_cloud_session',JSON.stringify(sess));await cloudLoad();
 }catch(err){cloudSession=null;sessionStorage.removeItem('fundesk_cloud_session');cloudLoginForm(cloudErr(err))}}

}
function cloudRenderQuickClasses(){
 const root=$('fastClassLinks');if(!root)return;
 const url=new URL(location.href);root.innerHTML=activeCodes().map(c=>{const u=new URL(url.href);u.searchParams.set('class',c);return `<a href="${esc(u.href)}" class="${cl===c?'selected':''}" title="${c} 班專屬網址">${esc(className(c))}</a>`}).join('');
 root.querySelectorAll('a').forEach(a=>{a.onclick=e=>{e.preventDefault();const code=new URL(a.href).searchParams.get('class');changeClass(code)}});
}
function cloudPayload(code){return code==='shared'?{labTemplate:db.labTemplate,classCodes:[...CLASSES],classMeta:db.classMeta}:db.classes[code]}
async function cloudGetAll(){return await cloudFetch('/rest/v1/fundesk_teacher_data?select=class_code,payload,revision&order=class_code.asc')}
async function cloudLoad(){
 cloudStatus('正在下載七班雲端紀錄…');
 const rows=await cloudGetAll();
 if(!Array.isArray(rows))throw Error('雲端回傳格式不符');
 if(!rows.length){cloudInitWizard();return}
 // 先從雲端共用設定還原班級清單；舊版尚未有 metadata 時保留 501～507。
 const shared=rows.find(r=>r.class_code==='shared')?.payload;
 const stored=Array.isArray(shared?.classCodes)?shared.classCodes.filter(c=>typeof c==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(c)):null;
 const rowCodes=rows.filter(r=>r.class_code!=='shared'&&/^[A-Za-z0-9_-]{1,40}$/.test(r.class_code)).map(r=>r.class_code);
 CLASSES=[...new Set([...(stored?.length?stored:DEFAULT_CLASSES),...rowCodes])];
 const fresh=makeState();
 if(shared?.classMeta&&typeof shared.classMeta==='object'){
  for(const code of CLASSES){const item=shared.classMeta[code];if(item&&typeof item.name==='string'&&item.name.trim())fresh.classMeta[code]={name:item.name.slice(0,35),active:item.active!==false}}
 }
 cloudSnapshots={};cloudRevisions={};
 for(const row of rows){if(row.class_code==='shared'){
 if(Array.isArray(row.payload?.labTemplate)&&row.payload.labTemplate.length===5)fresh.labTemplate=row.payload.labTemplate;
 }else if(CLASSES.includes(row.class_code)&&Array.isArray(row.payload?.students))fresh.classes[row.class_code]=row.payload;
 cloudSnapshots[row.class_code]=JSON.stringify(row.payload);cloudRevisions[row.class_code]=Number(row.revision||0);
 }
 db=fresh;if(!activeCodes().length){db.classMeta[CLASSES[0]].active=true}if(!activeCodes().includes(cl))cl=activeCodes()[0];if(!db.labTemplate)db.labTemplate=DEFAULT_LAB_TEMPLATE.map(g=>[...g]);
 cloudBlocked=false;cloudReady=true;cloudUnlock();
}
function cloudInitWizard(){
 cloudReady=false;document.body.classList.add('cloud-locked');
 const hasLocal=legacyDb&&legacyDb.classes&&CLASSES.every(c=>Array.isArray(legacyDb.classes[c]?.students));
 cloudGateMessage(`<h2>首次登入：雲端尚無班級資料</h2><p>選擇建立七班示範資料，或將這台電腦的舊版資料上傳到雲端。<b>只有第一次建立雲端資料時才能使用這個匯入選項。</b></p><div class="cloudActions"><button id="cloudNew">建立七班示範資料</button>${hasLocal?'<button class="secondary" id="cloudImport">匯入此電腦七班舊資料</button>':''}</div><p class="cloudNote">如已在別台電腦初始化，請不要建立新的資料；先確認是否登入同一個教師帳號。</p>`);
 $('cloudNew').onclick=()=>cloudInitialize(false);
 if(hasLocal)$('cloudImport').onclick=()=>cloudInitialize(true);
}
async function cloudInitialize(useLocal){
 if(!confirm(useLocal?'確定要把目前瀏覽器儲存的七班資料上傳到你的教師雲端嗎？請先自行下載 JSON 備份。':'確定初始化七班雲端示範資料嗎？之後可逐班匯入正式名單。'))return;
 if(useLocal&&!legacyDb)return;
 db=useLocal?JSON.parse(JSON.stringify(legacyDb)):makeState();
 if(!Array.isArray(db.labTemplate)||db.labTemplate.length!==5)db.labTemplate=DEFAULT_LAB_TEMPLATE.map(g=>[...g]);
 cloudSnapshots={};cloudRevisions={};cloudBlocked=false;cloudReady=true;
 cloudStatus('正在建立七班雲端紀錄…');
 await cloudQueueSave();
 if(cloudBlocked){cloudReady=false;cloudInitWizard();alert('雲端初始化失敗；請檢查錯誤訊息及 SQL 設定，勿在其他電腦匯入。');return}
 cloudUnlock();
}
function cloudUnlock(){
 $('cloudGate').hidden=true;document.body.classList.remove('cloud-locked');
 cloudStatus('✅ 雲端已同步');
 render();
}
function cloudQueueSave(){
 if(!cloudReady||cloudBlocked)return Promise.resolve();
 cloudOutstanding++;
 cloudStatus('⏳ 儲存到雲端中…');
 cloudQueue=cloudQueue.then(async()=>{
  if(cloudBlocked)return;
  for(const code of cloudIds()){
   const payload=cloudPayload(code),serialized=JSON.stringify(payload);
   if(cloudSnapshots[code]===serialized)continue;
   // RPC performs optimistic revision check: rejects simultaneous overwrites from another computer.
   const revision=await cloudFetch('/rest/v1/rpc/fundesk_save_teacher_data',{method:'POST',body:JSON.stringify({p_class_code:code,p_payload:payload,p_expected_revision:cloudRevisions[code]||0})});
   if(typeof revision!=='number')throw Error('雲端版本回傳異常，已停止儲存');
   cloudSnapshots[code]=serialized;cloudRevisions[code]=revision;
  }
 }).catch(err=>{
  cloudBlocked=true;
  cloudStatus('⚠️ 雲端未同步，請備份並重新登入',true);
  alert('雲端儲存未完成！請先在「資料管理」匯出 JSON 備份，不要直接關閉頁面。\n原因：'+cloudErr(err)+'\n\n若其他電腦修改過資料，為避免覆蓋，必須重新載入雲端。');
 }).finally(()=>{cloudOutstanding--;if(!cloudBlocked&&cloudOutstanding===0)cloudStatus('✅ 雲端已同步')});
 return cloudQueue;
}
async function cloudBoot(){
 const requested=new URL(location.href).searchParams.get('class');if(requested&&/^[A-Za-z0-9_-]{1,40}$/.test(requested))cl=requested;
 cloudRenderQuickClasses();
 $('cloudLogout').onclick=cloudLogout;
 const sess=sessionStorage.getItem('fundesk_cloud_session');
 if(sess){try{cloudSession=JSON.parse(sess);await cloudLoad();return}catch(err){cloudSession=null;sessionStorage.removeItem('fundesk_cloud_session');cloudLoginForm(cloudErr(err));return}}
 cloudLoginForm();
}
function cloudLogout(){
 if(cloudOutstanding||cloudBlocked){alert('有未同步的資料，請先下載 JSON 備份並確認同步，不可直接登出。');return}
 if(!confirm('登出後本機不再顯示學生紀錄；公用電腦請關閉瀏覽器。確定登出？'))return;
 cloudSession=null;cloudReady=false;db=makeState();cloudSnapshots={};cloudRevisions={};
 sessionStorage.removeItem('fundesk_cloud_session');cloudStatus('已登出');cloudLoginForm();
}
window.addEventListener('beforeunload',e=>{if(cloudOutstanding>0||cloudBlocked){e.preventDefault();e.returnValue='雲端可能尚未儲存，請先備份';}});

loadQuestionBank();
