構造與外形特徵","question":"「蝴蝶的口器像一根細長的吸管。」這樣的口器構造最可能的覓食行為是什麼？","options":["啃食樹葉","咬碎果實","撕裂肉類","吸食花蜜"],"answer":3,"explanation":"蝴蝶以吸管狀的口器吸食花蜜。"},{"id":"1505000220","unit":"01-01","type":"choice","difficulty":"難","topic":"動物自我保護的方式","question":"竹節蟲的形態長得像下列哪一項敘述，具有用來隱藏自己或欺騙其他動物的效果？","options":["小草","樹枝","花朵","土壤"],"answer":1,"explanation":""},{"id":"1505000223","unit":"01-01","type":"choice","difficulty":"中","topic":"動物自我保護的方式","question":"下列關於動物保護自己的方式，哪一項敘述不正確？","options":["眼鏡蛇具有毒液，讓敵人不敢靠近","刺蝟遇到危險時會捲曲成球狀，使尖銳的刺朝外","蜘蛛蟹會將藻類、碎貝殼等黏附在身上，讓自己不容易被發現","食蚜蠅模仿蝴蝶的身體顏色和花紋，讓其他動物不敢靠近"],"answer":3,"explanation":"食蚜蠅模仿蜜蜂的身體顏色和花紋，讓其他動物不敢靠近。"},{"id":"1505000236","unit":"01-01","type":"choice","difficulty":"中","topic":"動物自我保護的方式","question":"生活在大自然中的野生動物為了躲避敵害，都會有自我保護的方法，下列哪一種動物自我保護的方法和蝸牛類似？","options":["胡蜂","眼鏡蛇","壁虎","龜"],"answer":3,"explanation":"蝸牛和龜都有硬殼保護身體。"},{"id":"1505000237","unit":"01-01","type":"choice","difficulty":"中","topic":"動物的身體構造與外形特徵","question":"下列動物中，哪一種動物比較適合以追捕的方式取得食物？","options":["大象","豹","猴子","長頸鹿"],"answer":1,"explanation":""},{"id":"1505000238","unit":"01-01","type":"choice","difficulty":"中","topic":"動物的身體構造與外形特徵","question":"下列動物中，哪一種動物主要以動物為食物？","options":["豹","長頸鹿","馬","羊"],"answer":0,"explanation":""},{"id":"1505000252","unit":"01-01","type":"choice","difficulty":"難","topic":"動物的身體構造與外形特徵","question":"長頸鹿的長脖子和長而捲曲的舌頭，主要對牠有什麼幫助？","options":["幫助牠奔跑","幫助牠維持體溫","幫助牠覓食","幫助牠躲避天敵"],"answer":2,"explanation":"長頸鹿的長脖子可以幫助牠吃到高處的樹葉，捲曲的舌頭可以捲取植物。"},{"id":"1505000257","unit":"01-01","type":"choice","difficulty":"難","topic":"動物自我保護的方式","question":"下列哪一種動物遭遇到危險時，採用和臭鼬相似的方式保護自己？","options":["刺蝟","蝸牛","獨角仙","黃斑椿象"],"answer":3,"explanation":"黃斑椿象具有發達的臭腺，遇到危險時就會釋出臭味，因此有人稱牠為臭腥龜，也有人叫牠臭屁蟲。"},{"id":"1505000269","unit":"01-01","type":"choice","difficulty":"中","topic":"動物的身體構造與外形特徵","question":"下列動物中，哪一種動物主要以植物為食物？","options":["豹","猴子","馬","紅尾伯勞"],"answer":2,"explanation":""},{"id":"1505000278","unit":"01-01","type":"choice","difficulty":"難","topic":"昆蟲的身體構造與外形特徵","question":"為什麼蝴蝶的成蟲和幼蟲吃的食物不同，最主要的原因是什麼？","options":["成蟲有翅膀，幼蟲沒有","腳的數量不同","口器構造不同","成蟲較美麗"],"answer":2,"explanation":"蝴蝶的幼蟲具有咀嚼式口器，以植物葉子、嫩芽、花或果實為主食；蝴蝶的成蟲則以吸管狀的口器吸食花蜜。"},{"id":"1505000280","unit":"01-01","type":"choice","difficulty":"易","topic":"動物自我保護的方式","question":"在冰天雪地的環境中，哪一種顏色是最佳的保護色？","options":["紅色","綠色","白色","黑色"],"answer":2,"explanation":""},{"id":"1505000287","unit":"01-01","type":"choice","difficulty":"中","topic":"溫度改變","question":"下列哪一種動物不是內溫動物？","options":["北極熊","蜥蜴","狗","人"],"answer":1,"explanation":"蜥蜴屬於外溫動物。"},{"id":"1505000297","unit":"01-01","type":"choice","difficulty":"易","topic":"溫度改變","question":"天氣熱時，常常可看到狗吐出舌頭或喘氣的行為，它的目的是什麼？","options":["增加體溫","祈求食物","降低體溫","威嚇同伴"],"answer":2,"explanation":""},{"id":"1505000298","unit":"01-01","type":"choice","difficulty":"難","topic":"動物的身體構造與外形特徵","question":"下列哪一種動物的臼齒比較發達，適合以植物為主要食物？","options":["小白鷺","蝴蝶","羊","獅"],"answer":2,"explanation":"小白鷺利用尖細的嘴喙覓食魚蝦等食物，蝴蝶以吸管狀的口器吸食花蜜，獅子則利用尖銳的犬齒獵捕其他動物。"},{"id":"1505000300","unit":"01-01","type":"choice","difficulty":"易","topic":"動物的身體構造與外形特徵","question":"北極熊身上濃密的毛對牠有什麼幫助？","options":["警告天敵不要靠近","可以吸引獵物靠近","可以保暖","可以散熱"],"answer":2,"explanation":""},{"id":"1505000320","unit":"01-01","type":"choice","difficulty":"難","topic":"動物自我保護的方式","question":"下列哪一種動物自我保護的方式和枯葉蝶較類似？","options":["壁虎","蝸牛","瓢蟲","竹節蟲"],"answer":3,"explanation":""},{"id":"1505000321","unit":"01-01","type":"choice","difficulty":"中","topic":"動物的身體構造與外形特徵","question":"虎和豹都有尖銳的犬齒，這對牠們有什麼幫助？","options":["吸引異性","傳遞訊息","幫助游泳","幫助獵食和攝食"],"answer":3,"explanation":""},{"id":"1505000343","unit":"01-01","type":"choice","difficulty":"中","topic":"溫度改變","question":"內溫動物的體溫會維持在一定的範圍內，下列哪一種動物和人類一樣屬於內溫動物？","options":["龜","北極熊","蛇","蜥蜴"],"answer":1,"explanation":""},{"id":"1505000350","unit":"01-01","type":"choice","difficulty":"中","topic":"溫度改變","question":"外溫動物主要是從外界環境吸收熱來維持體溫，因此體溫會隨環境氣溫而改變。下列哪一種動物是外溫動物？","options":["蓋斑鬥魚","北極熊","海豚","麻雀"],"answer":0,"explanation":""},{"id":"1505000363","unit":"01-01","type":"choice","difficulty":"難","topic":"動物攝取食物","question":"下列哪一種動物的覓食行為適合用「守株待兔」來形容？","options":["豹","黑面琵鷺","蜘蛛","蜜蜂"],"answer":2,"explanation":"蜘蛛結網設陷阱，等待獵物自己上門來，此種覓食行為可說是守株待兔。"},{"id":"1505000383","unit":"01-01","type":"choice","difficulty":"難","topic":"溫度改變","question":"下列哪一個選項的動物都是外溫動物？","options":["蜥蜴、蛙、鴨","鯨、蝗蟲、龜","龜、蜥蜴、蛇","鱷魚、狗、蛇"],"answer":2,"explanation":"鴨、鯨、狗是內溫動物；蜥蜴、蛙、蝗蟲、龜、蛇、鱷魚是外溫動物。"},{"id":"1505000388","unit":"01-01","type":"choice","difficulty":"中","topic":"溫度改變","question":"下列動物中，哪一種動物屬於內溫動物？","options":["鳥","蛇","蛙","魚"],"answer":0,"explanation":""},{"id":"1505000393","unit":"01-01","type":"choice","difficulty":"中","topic":"溫度改變","question":"下列動物中，哪一種動物的體溫比較不受環境溫度影響，體溫會維持在一定的範圍內？","options":["鳥","蛇","蛙","魚"],"answer":0,"explanation":""},{"id":"1505000400","unit":"01-01","type":"choice","difficulty":"難","topic":"動物的身體構造與外形特徵","question":"下列哪一種動物遭遇到危險時，採用和閉殼龜相似的方式保護自己？","options":["瓢蟲","蝸牛","獨角仙","蚯蚓"],"answer":1,"explanation":"蝸牛和龜一樣，遇到危險會躲進殼裡。"},{"id":"1505000422","unit":"01-01","type":"choice","difficulty":"易","topic":"溫度改變","question":"下列動物中，哪一種動物會利用休眠方式度過寒冬？","options":["貓","狗","蟾蜍","馬"],"answer":2,"explanation":""},{"id":"1505000427","unit":"01-01","type":"choice","difficulty":"難","topic":"動物的遷移行為","question":"有些候鳥在寒冷的冬天會飛到南方較溫暖的地方過冬，下列關於此行為的敘述，哪一項不正確？","options":["溫暖的地方食物較多","溫暖的地方有利於繁殖","遷徙路程都是很安全的","通常會有固定的遷徙地點"],"answer":2,"explanation":"候鳥遷徙的路程有時很長，並且具有體力、氣候、人類干擾和天敵等危險的考驗，並不都是安全的。"},{"id":"1505000434","unit":"01-01","type":"choice","difficulty":"易","topic":"動物的身體構造與外形特徵","question":"具有下列哪一個身體構造的動物，適合採取追捕的方式覓食？","options":["短小的四肢","堅硬的嘴喙","發達的臼齒","強壯的四肢"],"answer":3,"explanation":""},{"id":"1505000497","unit":"01-01","type":"choice","difficulty":"難","topic":"溫度改變","question":"下列何者不是寒冷時人類用來幫助維持適當體溫的方式？","options":["血管收縮","食慾增加","肌肉顫抖","休眠"],"answer":3,"explanation":"人類會有血管收縮、食慾增加、肌肉顫抖等機制，來幫助抵禦寒冷，維持適當體溫。"},{"id":"1505000499","unit":"01-01","type":"choice","difficulty":"易","topic":"動物自我保護的方式","question":"下列哪一種動物遇到危險時會斷尾求生？","options":["枯葉蝶","蛇","壁虎","瓢蟲"],"answer":2,"explanation":""},{"id":"1505000503","unit":"01-01","type":"choice","difficulty":"中","topic":"動物自我保護的方式","question":"在自然環境中，動物會利用什麼方法來隱藏自己，避免被捕食者發現？","options":["鮮豔的體色","身體具有硬刺","巨大的體型","和環境相似的顏色或形態"],"answer":3,"explanation":""},{"id":"1505000004","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的社會行為","question":"一群臺灣獼猴中有一隻核心雄猴，下列哪一個任務不是牠負責的範疇？","options":["保護猴群","照顧幼猴","帶領群體覓食","調解猴子之間的紛爭"],"answer":2,"explanation":""},{"id":"1505000014","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的社會行為","question":"蟻巢中，哪一種身分的螞蟻負責尋找、搬運食物及照顧、餵飼幼蟲？","options":["蟻后","雄蟻","工蟻","蟻后和雄蟻輪流"],"answer":2,"explanation":""},{"id":"1505000044","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"螞蟻是利用什麼方式來傳遞訊息？","options":["閃光","發出聲音","跳舞","觸角碰觸"],"answer":3,"explanation":""},{"id":"1505000089","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的社會行為","question":"下列關於螞蟻分工行為的敘述，哪一項是不正確的？","options":["蟻后主要的工作是產卵","雄蟻主要的工作是與蟻后交配，繁衍下一代","兵蟻主要的工作是挖洞築巢","工蟻主要的工作是尋找食物、餵飼幼蟻"],"answer":2,"explanation":""},{"id":"1505000109","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的社會行為","question":"下列哪一種行為不屬於動物的社會行為？","options":["臺灣獼猴個體間會互相理毛","貓會舔自己的毛來保持清潔","有些螞蟻負責尋找食物，有些螞蟻負責保護蟻巢","象群中的母象會一起照顧小象"],"answer":1,"explanation":""},{"id":"1505000140","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的社會行為","question":"對於蟻巢內的各項分工，下列哪一個敘述是正確的？","options":["蟻后負責抵禦外敵","雄蟻只負責交配","兵蟻負責尋找食物","工蟻負責保護蟻巢"],"answer":1,"explanation":""},{"id":"1505000143","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的社會行為","question":"在地上看見一隻正在搬運餅乾碎屑的螞蟻，這隻螞蟻可能是哪一種身分的螞蟻？","options":["雄蟻","工蟻","蟻后","蟻的幼蟲"],"answer":1,"explanation":""},{"id":"1505000200","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的社會行為","question":"蟻巢內，蟻后負責什麼工作？","options":["抵禦外敵","尋找食物","餵飼幼蟲","交配、產卵、繁衍後代"],"answer":3,"explanation":""},{"id":"1505000201","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的社會行為","question":"下列動物中，哪一種動物具有分工合作的社會行為？","options":["金魚","蜜蜂","麻雀","蛇"],"answer":1,"explanation":""},{"id":"1505000210","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的社會行為","question":"狼是具有社會行為的動物，下列哪一個敘述與牠的社會行為無關？","options":["戰勝的雄狼和牠的妻子共同擔任領袖","領袖負責巡邏、解決內部紛爭","狼夫妻照顧剛出生的小狼","狼具有銳利牙齒有利捕獵"],"answer":3,"explanation":"階級區分、人際關係、分工合作、傳遞訊息等都是社會行為的體現。只有④與社會行為無關。"},{"id":"1505000213","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的溝通方式","question":"下列哪一組動物利用較相似的方式傳遞訊息？","options":["蛙和鳥","螢火蟲和鳥","蛙和螢火蟲","蛙和螞蟻"],"answer":0,"explanation":""},{"id":"1505000261","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的溝通方式","question":"蝗蟲、蟬的雄蟲能發出聲音吸引雌蟲，最主要功能是什麼？","options":["覓食","保護","求偶","集合"],"answer":2,"explanation":"蝗蟲、蟬的雄蟲會發出聲音求偶。"},{"id":"1505000265","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的社會行為","question":"下列動物中，哪一種動物不具有分工合作的社會行為？","options":["螞蟻","蜜蜂","臺灣獼猴","老虎"],"answer":3,"explanation":"老虎屬於獨居動物。"},{"id":"1505000266","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"螢火蟲是利用什麼方式來傳遞訊息？","options":["閃光","發出聲音","跳舞","觸角碰觸"],"answer":0,"explanation":""},{"id":"1505000282","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的社會行為","question":"蟻巢內，數量最多的是哪一個角色的螞蟻？","options":["蟻后","雄蟻","兵蟻","工蟻"],"answer":3,"explanation":""},{"id":"1505000314","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"下列動物中，哪一種動物是利用觸角碰觸相互溝通？","options":["螞蟻","螢火蟲","白頭翁","眼鏡蛇"],"answer":0,"explanation":""},{"id":"1505000315","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的社會行為","question":"下列哪一種行為不是動物的社會行為？","options":["工蟻負責照顧幼蟲，兵蟻負責保護蟻巢","一群臺灣獼猴中有一隻核心雄猴保護猴群、調解猴子之間的紛爭","河馬喜歡泡在水裡消暑","獅群利用分工合作的方法圍捕大型野生動物"],"answer":2,"explanation":""},{"id":"1505000323","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"下列動物中，哪一種動物是利用嘴巴發出聲音，來傳遞訊息？","options":["螞蟻","螢火蟲","麻雀","蜜蜂"],"answer":2,"explanation":""},{"id":"1505000334","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的社會行為","question":"蟻巢內，雄蟻負責什麼工作？","options":["挖洞築巢","與蟻后交配","產卵","保護蟻巢"],"answer":1,"explanation":""},{"id":"1505000356","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"鳥類是利用什麼方式來傳遞訊息？","options":["閃光","發出聲音","噴出毒液","觸角碰觸"],"answer":1,"explanation":""},{"id":"1505000360","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"蜜蜂是利用什麼方式來傳遞訊息？","options":["腹部發光","用嘴鳴叫","跳舞","噴出毒液"],"answer":2,"explanation":""},{"id":"1505000366","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的溝通方式","question":"下列哪一種動物不是利用聲音來傳遞訊息？","options":["蝗蟲","麻雀","蛙","螢火蟲"],"answer":3,"explanation":""},{"id":"1505000377","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的溝通方式","question":"螞蟻離開蟻巢覓食時，牠們會利用哪一項構造彼此溝通、交換訊息？","options":["觸角","眼睛","翅膀","後腳"],"answer":0,"explanation":"螞蟻的觸角有靈敏的感覺，會互相碰觸觸角，傳遞氣味和訊息。"},{"id":"1505000399","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的溝通方式","question":"「動物彼此傳遞訊息有什麼好處？」，下列哪一個敘述是錯誤的？","options":["可以幫助生存","可以增加覓食機會","可以達到繁殖目的","可以增加戰鬥機會"],"answer":3,"explanation":""},{"id":"1505000402","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的社會行為","question":"下列哪一種動物不具有社會行為？","options":["鯨","金魚","螞蟻","臺灣獼猴"],"answer":1,"explanation":"鯨具有社會行為，屬於群居動物，有一起狩獵、撫育後代的行為；金魚會群體行動，但無其他明顯的社會行為。"},{"id":"1505000408","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的社會行為","question":"下列哪一種動物具有社會行為？","options":["臺灣獼猴","孔雀魚","蛇","麻雀"],"answer":0,"explanation":""},{"id":"1505000413","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的社會行為","question":"根據螞蟻的社會分工，下列哪一種角色的螞蟻主要負責保護蟻巢和抵禦外敵？","options":["兵蟻","雄蟻","蟻后","工蟻"],"answer":0,"explanation":""},{"id":"1505000436","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的社會行為","question":"下列關於動物各種行為的敘述，哪一項不正確？","options":["鳥類會透過發出聲音來溝通","蜥蜴、螞蟻和臺灣獼猴都是具有社會行為的動物","螢火蟲會透過發光來傳遞訊息","螞蟻群體中，蟻后、雄蟻、兵蟻、工蟻會負責不同的工作"],"answer":1,"explanation":"蜥蜴通常是獨自行動，不具有明顯的社會行為。"},{"id":"1505000443","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的溝通方式","question":"鯨魚是居住在大海的群居哺乳動物，牠是利用什麼方式傳遞訊息？","options":["聲音","光","跳舞","氣味"],"answer":0,"explanation":"鯨魚以聲音溝通，有些鯨也用聲音來定位找食物。"},{"id":"1505000447","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"下列動物中，哪一種動物是利用光來傳遞訊息？","options":["螞蟻","螢火蟲","麻雀","蜜蜂"],"answer":1,"explanation":""},{"id":"1505000451","unit":"01-02","type":"choice","difficulty":"難","topic":"動物的溝通方式","question":"鳥類主要的傳遞訊息方式和下列哪一種動物較相似？","options":["螞蟻","螢火蟲","蛙","蜜蜂"],"answer":2,"explanation":"鳥類和蛙都會利用發出聲音來傳遞訊息。"},{"id":"1505000478","unit":"01-02","type":"choice","difficulty":"中","topic":"動物的社會行為","question":"一群臺灣獼猴中有一隻高位階雌猴，下列哪一個任務是牠負責的範疇？","options":["保護猴群","照顧幼猴","帶領群體覓食","調解猴子之間的紛爭"],"answer":2,"explanation":""},{"id":"1505000495","unit":"01-02","type":"choice","difficulty":"易","topic":"動物的溝通方式","question":"下列動物中，哪一種動物是利用跳舞方式來傳遞訊息？","options":["螞蟻","螢火蟲","龜","蜜蜂"],"answer":3,"explanation":""},{"id":"1505000198","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"下列哪一組動物的繁殖方式不相同？","options":["海豚和鯉魚","雞和蜜蜂","兔子和狗","無尾熊和袋鼠"],"answer":0,"explanation":""},{"id":"1505000209","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"「胚胎在母體內吸收母體所提供的養分，經過一段時間發育成長為完整個體之後，才從母體產下。」這種繁殖方式稱為什麼？","options":["互生","卵生","胎生","無性生殖"],"answer":2,"explanation":""},{"id":"1505000229","unit":"01-03","type":"choice","difficulty":"易","topic":"動物的繁殖行為","question":"家燕的親代會有下列哪一種育幼行為？","options":["利用育兒袋養育小鳥","會背著小鳥行動","會捉小蟲餵養小鳥","會哺乳"],"answer":2,"explanation":""},{"id":"1505000230","unit":"01-03","type":"choice","difficulty":"難","topic":"動物的繁殖方式","question":"下列選項中，哪一組都是卵生動物？","options":["蛇、海豚","蝸牛、水牛","雞、蛙","鯨、龜"],"answer":2,"explanation":""},{"id":"1505000233","unit":"01-03","type":"choice","difficulty":"難","topic":"動物的繁殖方式","question":"下列有關卵生和胎生的敘述，哪一項是不正確的？","options":["兩者都是動物的繁殖方式","兩者幼體自母體產下時的樣子不同","兩者的胚胎都在母體內發育","兩者胚胎的養分來源不同"],"answer":2,"explanation":"卵生動物的母體排出卵後，胚胎在卵內發育成小動物才孵化出來。"},{"id":"1505000239","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"下列哪一種動物的繁殖方法和其他三種不同？","options":["企鵝","龜","蝴蝶","海豚"],"answer":3,"explanation":"海豚是胎生動物，其他三種是卵生動物。"},{"id":"1505000249","unit":"01-03","type":"choice","difficulty":"易","topic":"動物的繁殖方式","question":"下列動物中，哪一種動物為卵生動物？","options":["豹","猴子","馬","紅尾伯勞"],"answer":3,"explanation":""},{"id":"1505000250","unit":"01-03","type":"choice","difficulty":"難","topic":"動物的繁殖方式","question":"下列是幾位同學對於雞的描述，哪一個人說的不正確？\n小如：「母雞的外形特徵會遺傳給小雞。」\n小華：「雞的繁殖方式屬於卵生。」\n小平：「雞蛋裡有臍帶讓胚胎和母雞相連。」\n小明：「雞的繁殖方式和臺灣獼猴不一樣。」","options":["小如","小華","小平","小明"],"answer":2,"explanation":"雞蛋裡沒有臍帶讓胚胎和母雞相連，而是由卵黃、卵白提供胚胎發育所需的養分。"},{"id":"1505000254","unit":"01-03","type":"choice","difficulty":"易","topic":"動物自我保護的方式","question":"鬥魚自我保護的方法是採取什麼行為？","options":["逃避","裝死","威嚇","躲藏"],"answer":2,"explanation":""},{"id":"1505000259","unit":"01-03","type":"choice","difficulty":"易","topic":"動物的繁殖行為","question":"下列有關動物育幼行為的敘述，哪一項是不正確的？","options":["燕子的親鳥會餵養雛鳥","母袋鼠有育兒袋可以照顧小袋鼠","人類親代會照顧、訓練子代求生技能","蝴蝶成蟲會餵食幼蟲"],"answer":3,"explanation":""},{"id":"1505000260","unit":"01-03","type":"choice","difficulty":"易","topic":"動物的繁殖方式","question":"胎生動物的胚胎在出生之前，如何取得發育所需的養分？","options":["由卵提供","藉由臍帶和胎盤相連，從母體獲得養分","吸吮母體的乳汁取得","以口進食"],"answer":1,"explanation":""},{"id":"1505000268","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖行為","question":"母袋鼠的育兒袋有什麼作用？","options":["儲存自己要吃的食物","當作小袋鼠的遊樂場","讓發育中的小袋鼠在育兒袋裡順利成長","放置母袋鼠產下的卵"],"answer":2,"explanation":""},{"id":"1505000270","unit":"01-03","type":"choice","difficulty":"易","topic":"動物的繁殖方式","question":"下列動物中，哪一種動物為胎生動物？","options":["豹","燕子","鮭魚","螞蟻"],"answer":0,"explanation":""},{"id":"1505000273","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"下列哪一項敘述不是胎生動物的特徵？","options":["幼體以小動物的形態從母體產出","母體有哺乳的行為","母體產下卵，胚胎在卵內發育成小動物才孵化出來","胚胎的養分來自母體"],"answer":2,"explanation":""},{"id":"1505000285","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖行為","question":"下列動物中，哪一種動物沒有育幼行為？","options":["燕子","鮭魚","狗","螞蟻"],"answer":1,"explanation":""},{"id":"1505000293","unit":"01-03","type":"choice","difficulty":"易","topic":"動物的繁殖方式","question":"下列哪一種動物的繁殖方式不是胎生？","options":["人","臺灣獼猴","象","綠蠵龜"],"answer":3,"explanation":""},{"id":"1505000303","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"下列動物中，哪一組動物的繁殖方式是相同的？","options":["兔、雞","鼠、蝴蝶","金魚、蛙","牛、龜"],"answer":2,"explanation":""},{"id":"1505000338","unit":"01-03","type":"choice","difficulty":"易","topic":"動物自我保護的方式","question":"飼養哪一種魚，通常會被建議單隻飼養？","options":["金魚","孔雀魚","鬥魚","大肚魚"],"answer":2,"explanation":""},{"id":"1505000347","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"卵生動物的胚胎發育所需養分主要來自哪裡？","options":["母乳","卵殼","氣室","卵黃和卵白"],"answer":3,"explanation":""},{"id":"1505000355","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖行為","question":"動物育幼有很多好處，下列哪一項不是動物育幼行為的好處？","options":["降低子代被捕食者吃掉的機率","子代有比較穩定的食物來源","子代會長得和親代一模一樣","子代比較有機會順利成長"],"answer":2,"explanation":""},{"id":"1505000411","unit":"01-03","type":"choice","difficulty":"易","topic":"動物的繁殖方式","question":"下列哪一種動物和象一樣，屬於胎生動物？","options":["龜","螃蟹","牛","蝴蝶"],"answer":2,"explanation":""},{"id":"1505000431","unit":"01-03","type":"choice","difficulty":"難","topic":"動物的繁殖行為","question":"關於腹斑蛙的敘述，下列哪一項是不正確的？","options":["繁殖期會有鼓起鳴囊鳴叫的求偶行為","會捕捉小蟲餵養下一代","屬於卵生動物","親代和子代在外形上會有許多相同的特徵，但也有一些差異"],"answer":1,"explanation":"腹斑蛙沒有育幼行為。"},{"id":"1505000444","unit":"01-03","type":"choice","difficulty":"中","topic":"動物自我保護的方式","question":"下列哪一個動物行為不是威嚇行為？","options":["鬥魚鼓起鰓張開鰭","猩猩搥胸發出聲響","臺灣黑熊發出吼叫聲","龜將頭和四肢縮進殼中"],"answer":3,"explanation":""},{"id":"1505000462","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"像貓和狗等動物的新生幼體，不需要經過孵化，而是直接由母體產出，這種繁殖方式稱為什麼？","options":["無性生殖","卵生","胎生","人工授精"],"answer":2,"explanation":""},{"id":"1505000477","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"下列哪一種動物的雄性會吐泡泡築巢，保護受精卵？","options":["鴿子","鬥魚","小環頸鴴","蝴蝶"],"answer":1,"explanation":""},{"id":"1505000480","unit":"01-03","type":"choice","difficulty":"中","topic":"性狀與遺傳","question":"下列四種特徵中，哪一種外形特徵不一定是由親代遺傳的特徵？","options":["頭髮的長短","美人尖","臉頰的酒窩","眼睛上的雙眼皮"],"answer":0,"explanation":"頭髮長短可因修剪等改變來控制，和親代遺傳特徵較無關。"},{"id":"1505000486","unit":"01-03","type":"choice","difficulty":"中","topic":"動物自我保護的方式","question":"下列哪一個動物行為屬於威嚇行為？","options":["壁虎斷尾逃生","猩猩搥胸發出聲響","臭鼬放出臭味液體","烏龜躲進殼中"],"answer":1,"explanation":""},{"id":"1505000490","unit":"01-03","type":"choice","difficulty":"難","topic":"性狀與遺傳","question":"下列選項中，哪一個敘述是不正確的？","options":["小孩的特徵有可能像父母，也有可能像祖父母","拇指的彎曲和指頭的長度也是一種人類外形的特徵","每個人的外形特徵會和父親或母親完全相同","父親的雙眼皮特徵有可能會傳給小孩"],"answer":2,"explanation":"①人類的外形特徵有可能隔代遺傳給小孩；③會和父親或母親有一些相同的地方，但不會完全相同。"},{"id":"1505000496","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖行為","question":"下列哪一種動物會有哺乳的行為？","options":["貓","孔雀","蜘蛛","蜥蜴"],"answer":0,"explanation":""},{"id":"1505000502","unit":"01-03","type":"choice","difficulty":"中","topic":"動物的繁殖方式","question":"下列哪一種生物不屬於卵生動物？","options":["雞","蛙","鱷魚","海豚"],"answer":3,"explanation":""},{"id":"1505000026","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"捷運軌道在經過住家附近時，會採用什麼措施來防止噪音？","options":["加裝防彈玻璃","裝設隔音牆","保持四周空曠","裝設分貝計"],"answer":1,"explanation":""},{"id":"1505000058","unit":"02-01","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列哪一個地方的音量最大？","options":["分貝數90的棒球場","分貝數20的森林","分貝數140的機場","分貝數60的公園"],"answer":2,"explanation":"機場的分貝數最高，音量最大。"},{"id":"1505000061","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"下列哪一項作法會製造噪音？","options":["在公車上小聲交談","將電視的音量調小","在室內輕聲慢行","深夜時演奏樂器"],"answer":3,"explanation":""},{"id":"1505000088","unit":"02-01","type":"choice","difficulty":"中","topic":"聲音三要素","question":"分貝計主要是用來測量下列哪一項特性？","options":["音調","音量","音色","溫度"],"answer":1,"explanation":""},{"id":"1505000099","unit":"02-01","type":"choice","difficulty":"易","topic":"聲音三要素","question":"臺灣是以什麼法律來判定噪音的依據？","options":["消費者保護法","環境基本法","空氣汙染防制法","噪音管制法"],"answer":3,"explanation":""},{"id":"1505000111","unit":"02-01","type":"choice","difficulty":"易","topic":"噪音","question":"使用分貝計測量，下列哪一個地點所測得的音量會最小？","options":["廟會慶典的會場","飛機場的跑道","圖書館內","上班時間的馬路"],"answer":2,"explanation":""},{"id":"1505000121","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"下列哪一項不是噪音的特性？","options":["讓人感覺不舒服","刺耳","讓人覺得心情愉悅","讓人覺得嘈雜"],"answer":2,"explanation":""},{"id":"1505000939","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"關於噪音的敘述，下列哪一項是正確的？","options":["只要是好聽的歌聲，音量很大都不會變成噪音","音量過大或刺耳干擾情緒的聲音稱為噪音","噪音只會影響心情，不會傷害耳膜","分貝數越低代表音量越大"],"answer":1,"explanation":""},{"id":"1505000967","unit":"02-01","type":"choice","difficulty":"中","topic":"生活中的例子","question":"在捷運軌道旁設置綠色的隔音牆，其主要的功能為何？","options":["阻隔光線，避免捷運晒到太陽","美化捷運軌道","阻隔聲音的傳播路徑，降低噪音的影響","讓捷運行進時的音量變大"],"answer":2,"explanation":""},{"id":"1505000987","unit":"02-01","type":"choice","difficulty":"易","topic":"噪音","question":"生活中，下列哪一種行為可以減少環境中的噪音？","options":["常用分貝計測量聲音的大小","打開隔音窗讓空氣對流","看電視時，保持適當音量","開車長按喇叭"],"answer":2,"explanation":""},{"id":"1505001081","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"關於減少生活中噪音的方法，下列哪一項敘述是不正確的？","options":["在捷運軌道旁設置隔音牆來阻隔噪音傳播","戶外太嘈雜時，暫時關閉窗戶或拉上窗簾來降低噪音","在圖書館等公共場所說話時應降低音量","室內施工時，應打開所有門窗，才能降低噪音"],"answer":3,"explanation":""},{"id":"1505001100","unit":"02-01","type":"choice","difficulty":"易","topic":"聲音三要素","question":"分貝計上顯示的數值，代表的是聲音的什麼特性？","options":["音調高低","發聲長短","音量大小","音色種類"],"answer":2,"explanation":""},{"id":"1505001117","unit":"02-01","type":"choice","difficulty":"易","topic":"噪音","question":"下列關於生活中常見的聲音，哪一項不屬於噪音？","options":["開車時持續按喇叭","玩遊戲時大聲喊叫","演奏會的音樂聲","施工發出很大的聲音，分貝數超過音量管制標準"],"answer":2,"explanation":""},{"id":"1505001123","unit":"02-01","type":"choice","difficulty":"中","topic":"聲音三要素","question":"測量音量大小的科學工具及單位分別為何？","options":["分貝計，分貝(dB)","三稜鏡，公分(cm)","放大鏡，倍率","直尺，公尺(m)"],"answer":0,"explanation":""},{"id":"1505001132","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"小明在教室閱讀時，窗外傳來施工機具巨大且刺耳的聲音，讓他感到不舒服。關於這種聲音的敘述，下列何者正確？","opt ic":"聲音三要素","question":"我國噪音管制法是用下列哪一個單位作為判定噪音的標準？","options":["音調","分貝","公斤","公分"],"answer":1,"explanation":""},{"id":"1505001385","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"我國噪音管制法所稱的「噪音」，判斷的依據是什麼？","options":["聲音的高低","音量的大小","聲音節奏的快慢","音色是否優美"],"answer":1,"explanation":""},{"id":"1505001406","unit":"02-01","type":"choice","difficulty":"中","topic":"噪音","question":"下列哪一項作法可以減少噪音的產生？","options":["在圖書館閱讀時不可以開燈","經過正在上課的教室時，不可以呼吸","夜深人靜時，要將說話的音量降低","在喧譁的馬路旁戴上口罩"],"answer":2,"explanation":""},{"id":"1505001408","unit":"02-01","type":"choice","difficulty":"中","topic":"聲音三要素","question":"我們通常使用哪一種儀器來測量聲音的大小？","options":["溫度計","單擺","電子錶","分貝計"],"answer":3,"explanation":""},{"id":"1505001416","unit":"02-01","type":"choice","difficulty":"易","topic":"噪音","question":"下列哪一種方法可以改善或降低噪音？","options":["大聲說話","使用擴音設備","打開窗戶","使用隔音牆"],"answer":3,"explanation":""},{"id":"1505001421","unit":"02-01","type":"choice","difficulty":"易","topic":"聲音三要素","question":"聲音大小是以什麼為單位？","options":["度","分貝","公斤","毫升"],"answer":1,"explanation":""},{"id":"1505000923","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"吹奏直笛時，是哪一個部分在振動而發出聲音？","options":["笛孔","笛口","空氣柱","笛管"],"answer":2,"explanation":""},{"id":"1505000926","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"弦樂器中，哪一種情況會使樂器發出較高的聲音？","options":["弦較緊","弦較粗","弦較長","大力拉彈"],"answer":0,"explanation":"②③聲音會變低；④聲音變大。"},{"id":"1505000928","unit":"02-02","type":"choice","difficulty":"易","topic":"振動產生聲音","question":"小玉吹直笛時，會發出大小、高低不同的聲音，這是因為下列哪一項振動所產生的？","options":["直笛本身","直笛的吹嘴","直笛外面的空氣","直笛內的空氣柱"],"answer":3,"explanation":""},{"id":"1505000936","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"吹奏直笛時，如果按壓的笛孔數越少，所發出的聲音會如何變化？","options":["音量越大","音調越高","音色改變","音調越低"],"answer":1,"explanation":""},{"id":"1505000938","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"彈撥烏克麗麗時，下列哪一種方法可以發出較高的音調？","options":["彈撥較粗的弦","彈撥較長的弦","將弦鈕轉鬆","彈撥較細的弦"],"answer":3,"explanation":""},{"id":"1505000946","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列哪一種方法不能改變烏克麗麗發出的聲音高低？","options":["調整弦的粗細","調整弦的長短","調整弦的鬆緊","調整音箱響孔的大小"],"answer":3,"explanation":""},{"id":"1505000957","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"用相同的力敲擊裝有不同水量的玻璃杯時，下列哪一項敘述是正確的？","options":["所有玻璃杯發出的音調都相同","不同水量的玻璃杯發出的音調高低不同","玻璃杯的顏色會影響音調高低","玻璃杯發出音調與水量無關"],"answer":1,"explanation":""},{"id":"1505000958","unit":"02-02","type":"choice","difficulty":"中","topic":"音箱對聲音大小的影響","question":"下列哪一項敘述是說明音箱的主要功能？","options":["調整聲音高低","方便演奏","使外觀更好看","使聲音變大"],"answer":3,"explanation":""},{"id":"1505000959","unit":"02-02","type":"choice","difficulty":"難","topic":"製作簡易樂器","question":"自製烏克麗麗時，若發現音調太低，下列哪一種調整方式沒有效果？","options":["將橡皮筋拉緊一點","換一根更細的橡皮筋","縮短橡皮筋的長度","更用力彈撥橡皮筋"],"answer":3,"explanation":"用力彈撥只會增加音量，不會改變音調。"},{"id":"1505000964","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"用相同的力量拉緊長短相同、粗細不同的兩條橡皮筋後放手，橡皮筋發出的聲音會如何？","options":["粗橡皮筋發出的聲音較高","粗橡皮筋發出的聲音較低","粗橡皮筋發出的聲音較大","粗橡皮筋發出的聲音較小"],"answer":1,"explanation":""},{"id":"1505000973","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"彈撥釣魚線時，若想讓聲音變低，應該如何調整釣魚線？","options":["換成更細的釣魚線再彈撥","將釣魚線放長再彈撥","將釣魚線縮短再彈撥","將釣魚線縮拉得更緊再彈撥"],"answer":1,"explanation":"釣魚線越粗、越長、越鬆，彈撥時發出的聲音越低。"},{"id":"1505000977","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"依照「發出的聲音高低」可以將直笛分成高音直笛、中音直笛和低音直笛，根據「空氣柱長短影響直笛發出的聲音高低」原理，你認為下列哪一種直笛的管身可能最長？","options":["高音直笛","中音直笛","低音直笛","一樣長"],"answer":2,"explanation":"空氣柱越長，發出的聲音越低，所以低音直笛的管身最長。"},{"id":"1505001001","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"下列有關烏克麗麗和小提琴的比較，哪一項敘述是不正確的？","options":["它們都是弦樂器","它們都是利用手指彈撥發聲","它們都具有音箱，可以擴大音量","它們都能發出高低不同的聲音"],"answer":1,"explanation":"小提琴是用琴弓拉琴弦彈奏發聲。"},{"id":"1505001003","unit":"02-02","type":"choice","difficulty":"中","topic":"音箱對聲音大小的影響","question":"樂器音箱的主要功能是什麼？","options":["調整高低音","方便演奏","擴大音量","改變音色"],"answer":2,"explanation":""},{"id":"1505001007","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"上課時，老師沒回頭卻能知道誰在說話，這是根據下列哪一項聲音的特性來分辨？","options":["每個人音調不同","每個人的音量不同","每個人的音色不同","每個人的外形不同"],"answer":2,"explanation":""},{"id":"1505001009","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"吹奏直笛時，下列哪一種吹奏方式吹出的音調最高？","options":["按壓全部的笛孔","按壓5個笛孔","按壓4個笛孔","按3個笛孔"],"answer":3,"explanation":""},{"id":"1505001013","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"小妍練習吹奏直笛，當她按住的笛孔數愈少時，聲音會發生什麼變化？","options":["空氣柱愈長，聲音愈高","空氣柱愈短，聲音愈高","空氣柱愈長，聲音愈低","空氣柱愈短，聲音愈低"],"answer":1,"explanation":""},{"id":"1505001021","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"按住直笛上全部的笛孔，比起全部笛孔都不按，吹出的聲音如何？","options":["較大","較小","較高","較低"],"answer":3,"explanation":""},{"id":"1505001041","unit":"02-02","type":"choice","difficulty":"中","topic":"音箱對聲音大小的影響","question":"「音箱對聲音大小的影響」實驗中，可發現哪一項實驗結果？","options":["有音箱發出聲音較大","無音箱發出聲音較大","有、無音箱發出聲音大小都一樣","音箱與聲音大小無關"],"answer":0,"explanation":""},{"id":"1505001044","unit":"02-02","type":"choice","difficulty":"易","topic":"聲音三要素","question":"下列有關聲音三要素的敘述，哪一項正確？","options":["聲音的大小稱為音調","聲音的高低稱為音量","聲音的獨特性稱為音色","發聲物體的長短、粗細、鬆緊都會影響聲音的音色"],"answer":2,"explanation":"聲音的大小稱為音量，聲音的高低稱為音調；發聲物體的長短、粗細、鬆緊都會影響聲音的高低，同一種發聲物體的材料、構造相同，所以音色會相同。"},{"id":"1505001067","unit":"02-02","type":"choice","difficulty":"難","topic":"音箱對聲音大小的影響","question":"在「音箱對聲音大小的影響」實驗中，下列關於音箱的敘述，哪一項是正確的？","options":["音箱的主要作用是改變橡皮筋的振動快慢，使音調變高","音箱透過中空的構造吸收了背景雜音，使樂音更清晰","音箱能提高發聲體與空氣碰撞的接觸面積，使音量變大","音箱的體積愈小，增強音量的效果愈好"],"answer":2,"explanation":"弦的振動不足以使空氣強烈振動，透過音箱可以延伸振動範圍，提高與空氣碰撞的接觸面積並增強空氣振動，使音量變大。"},{"id":"1505001073","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列哪一種演奏樂器的方式可以發出高低不同的聲音？","options":["按住相同數量的孔洞，用大小不同的力量吹奏同一支直笛","用大小不同的力量，按同一個鋼琴鍵","用大小不同的力量，彈撥同一條吉他弦","對著鐵琴不同長短的金屬片，用相同大小的力量敲擊"],"answer":3,"explanation":""},{"id":"1505001086","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列影響弦樂器「發出的聲音高低」的因素，哪一項敘述是正確的？","options":["與弦的數量有關","與音箱的大小有關","與演奏時力量的大小有關","與弦的長短粗細有關"],"answer":3,"explanation":""},{"id":"1505001103","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"小妍在音樂課練習烏克麗麗，如果他想要彈奏出音調較高的聲音，下列哪一種方法是正確的？","options":["改彈撥比較粗的弦","改彈撥比較短的弦","用更大的力氣去彈撥","把弦鈕轉鬆一點再彈"],"answer":1,"explanation":"聲音的高低稱為音調。發聲物體的長短、粗細、鬆緊會影響音調，通常物體越短、越細、越緊，發出的聲音越高。"},{"id":"1505001108","unit":"02-02","type":"choice","difficulty":"易","topic":"聲音三要素","question":"老師在教室裡背對同學，也能分辨出是哪一位同學在說話。這是因為每個人聲音的哪項特徵不同？","options":["音量不同","音調不同","音色不同","說話速度不同"],"answer":2,"explanation":""},{"id":"1505001109","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"長短相同但粗細不同的兩條橡皮筋，用相同的力量拉緊後撥動，兩條橡皮筋發出的聲音會怎麼樣？","options":["粗橡皮筋發出的聲音比較大","粗橡皮筋發出的聲音比較小","粗橡皮筋發出的聲音比較高","粗橡皮筋發出的聲音比較低"],"answer":3,"explanation":"長短相同，但粗細不同的橡皮筋，用相同的力量彈撥，粗橡皮筋發出的聲音比細橡皮筋低。"},{"id":"1505001115","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"彈撥吉他時，若某一條弦的聲音太高，下列哪一種方法可以使聲音變低？","options":["將音箱加大","將弦轉緊","改成更細的弦","將弦轉鬆"],"answer":3,"explanation":""},{"id":"1505001124","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列哪一種演奏烏克麗麗的方式，可以使它發出較高的聲音？","options":["用手遮住音箱的響孔","彈撥較細的弦","用最大的力氣彈撥最粗的弦","用最小的力氣彈撥最粗的弦"],"answer":1,"explanation":""},{"id":"1505001128","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"樂器因為具有不同的材質和外形，所以演奏出的聲音各有不同，這些獨特的聲音稱為什麼？","options":["音樂","音響","音色","聲樂"],"answer":2,"explanation":""},{"id":"1505001139","unit":"02-02","type":"choice","difficulty":"中","topic":"生活中的例子","question":"下列哪一項樂器不是弦樂器？","options":["烏克麗麗","小提琴","長笛","豎琴"],"answer":2,"explanation":""},{"id":"1505001147","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"不同樂器發出的聲音有不同的特色，不同人說話時也會有不一樣的聲音，這是因為聲音三要素中的哪一項具有獨特性？","options":["音量","音調","音色","音高"],"answer":2,"explanation":"不同發聲物因為材料結構不同，使聲音具有獨特性，稱為音色。"},{"id":"1505001151","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"豪豪在自製鼓時，用鮪魚罐頭作為音箱，但他覺得聲音太小了。下列哪一種方法沒辦法讓豪豪在打鼓時聲音變大？","options":["將鮪魚罐頭替換成更大奶粉罐","用更大的力氣敲打","在下面加上臉盆作為音箱","用較小的力氣敲打"],"answer":3,"explanation":""},{"id":"1505001168","unit":"02-02","type":"choice","difficulty":"易","topic":"振動產生聲音","question":"聲音是由物體產生什麼現象而發出的能量形式？","options":["折射","反射","振動","變色"],"answer":2,"explanation":""},{"id":"1505001171","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"凱凱觀察直笛的構造後發現，吹奏時按住的笛孔數與聲音高低有密切關係。下列敘述何者正確？","options":["按住的笛孔越多，管內空氣柱越長，音調越高","按住的笛孔越少，管內空氣柱越短，音調愈高","吹奏的力量越大，管內空氣柱會縮短，導致音調變高","笛孔主要影響音色，與音調高低無關"],"answer":1,"explanation":"直笛發出聲響利用是管內的空氣柱振動。按壓的笛孔數越少，空氣柱越短，發出的聲音越高；吹奏力量則是影響音量。"},{"id":"1505001174","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"小翔用相同的力拍打兩個鼓面大小和材質都相同，但鼓身體積不同的簡易鼓。下列哪一個結果是正確的？","options":["鼓身較大的鼓發出音調較高","鼓身較小的鼓發出音量較小","鼓身較小的鼓發出音調較低","鼓身較小的鼓發出音量較大"],"answer":1,"explanation":"鼓身較大的鼓有較大的共鳴空間，能使更多空氣振動，因此發出的聲音較大；鼓身較小的鼓發出的聲音較小。"},{"id":"1505001178","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"小花在彈奏鐵琴時，若他敲打較長的鐵琴琴鍵，發出的聲音會有什麼變化？","options":["音量較大","音調較低","音色改變","聲音傳播速度會變快"],"answer":1,"explanation":""},{"id":"1505001186","unit":"02-02","type":"choice","difficulty":"易","topic":"聲音玩具","question":"下列哪一種樂器沒有音箱？","options":["小提琴","吉他","鼓","三角鐵"],"answer":3,"explanation":""},{"id":"1505001207","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"烏克麗麗的發聲部位是弦。若想要讓同一根弦發出的聲音變高，下列哪一個作法是正確的？","options":["轉動弦鈕，將弦調得更鬆","用手指按住弦，使彈撥的弦長度變短","輕輕彈撥，減少弦的振動幅度","換一根更粗的弦來彈奏"],"answer":1,"explanation":"發聲物體的長短、粗細、鬆緊會影響聲音高低。彈撥較短、較細或較緊的弦時，發出的聲音會比較高。"},{"id":"1505001225","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"彈撥吉他時，可以用哪一種方法把聲音調低？","options":["將弦轉鬆","將弦轉緊","換細一點的弦","加大音箱"],"answer":0,"explanation":""},{"id":"1505001233","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"為什麼在不看見人的情況下，我們仍可以聽出是哪位同學在說話？","options":["因為每個人說話的聲音大小都相同","因為每個人說話時周圍的空氣不同","因為每個人聲音的音色不同","因為光是直線行進的"],"answer":2,"explanation":""},{"id":"1505001237","unit":"02-02","type":"choice","difficulty":"中","topic":"音箱對聲音大小的影響","question":"下列哪一種樂器沒有音箱？","options":["鼓","烏克麗麗","小提琴","三角鐵"],"answer":3,"explanation":""},{"id":"1505001238","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"關於簡易弦樂器烏克麗麗的敘述，下列哪一項是正確的？","options":["橡皮筋越長，撥彈出聲音越高","橡皮筋越粗，撥彈出聲音越高","橡皮筋越細，撥彈出聲音越高","橡皮筋越短，撥彈出聲音越低"],"answer":2,"explanation":"橡皮筋越長、越粗，撥彈出的聲音越低；橡皮筋越短、越細，撥彈出的聲音越高。"},{"id":"1505001240","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列哪一項與音調有關？","options":["小恩用不同力量敲擊鐵琴最長的琴鍵","小強敲擊有音箱和沒有音箱的自製樂器","小晴用力和輕輕彈撥烏克麗麗的弦","小萱敲擊加有不同水量的玻璃杯"],"answer":3,"explanation":""},{"id":"1505001241","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"吹奏直笛時，按住下列哪一個笛孔數，吹出的聲音最低？","options":["6個","5個","3個","1個"],"answer":0,"explanation":""},{"id":"1505001245","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"學校舉辦蒙面歌王才藝大賽，評審老師背對舞台，僅憑聽覺進行評分。當小明表演完畢後，評審老師給出了以下評語：\n「你的聲音非常有特色，我一聽就知道是你，可惜最後那一段高音唱不上去，有點走音，而且可能因為太緊張，你的歌聲太小，我差點聽不見。」\n評審的評語先後對應到聲音的哪三個要素？","options":["音色→音調→音量","音調→音色→音量","音量→音調→音色","音色→音量→音調"],"answer":0,"explanation":"「辨識出是誰」靠的是聲音的獨特性，稱為音色；「高音唱不上去／走音」指的是聲音的高低，稱為音調；「聲音太小／聽不見」指的是聲音的大小，稱為音量。"},{"id":"1505001246","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列關於生活中聲音的音色敘述，哪一項是正確的？","options":["老師不回頭就能分辨學生的聲音，是因為每位同學說話的音量不同，與音色無關","小提琴與長笛彈奏同一個音符，我們仍能分辨，是因為兩者的材料和構造不同","樂器的音色可以透過彈奏的力量大小來改變，越用力彈奏，音色會變得更清脆","只要發聲物體長短、粗細相同，發出的音色就一定會完全相同"],"answer":1,"explanation":"①主要是音色不同；③彈奏的力量大小影響的是音量，而非音色；④發聲物體的材料與結構也會影響音色。"},{"id":"1505001248","unit":"02-02","type":"choice","difficulty":"難","topic":"音箱對聲音大小的影響","question":"比賽常見的加油棒，形狀像喇叭，一端小、一端大。觀賞棒球賽時，有些人會將嘴靠在加油棒較小的一端來喊出加油聲，此時加油棒的主要作用是什麼？","options":["讓聲音變長","讓聲音變低","讓聲音放大","讓聲音變高"],"answer":2,"explanation":"聲音透過加油棒管壁反射後，能更集中向外傳出，故能讓聲音放大。"},{"id":"1505001274","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"烏克麗麗有粗細不同的弦。如果想要彈奏出較高的音調，小晴應該彈撥哪一條弦？","options":["較粗、較長或較鬆的弦","較細、較短或較緊的弦","只要用力彈撥，聲音就會變高","弦的長短和粗細不會影響聲音高低"],"answer":1,"explanation":""},{"id":"1505001276","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"吹奏管樂器時，下列哪一種作法會使樂器發出的聲音變低？","options":["換較長的笛管","換較短的笛管","按住較少的笛孔","更大力吹奏"],"answer":0,"explanation":"②③聲音會變高；④聲音音量會變大。"},{"id":"1505001285","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"彈撥烏克麗麗時，若想發出較高的聲音，應選擇彈撥哪一條弦？","options":["較粗的弦","較細的弦","較鬆的弦","較長的弦"],"answer":1,"explanation":""},{"id":"1505001296","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"音樂家演奏吉他前將弦調得更緊，可能是為了達到哪一項目的？","options":["為了發出較大的聲音","為了發出較高的聲音","為了發出較小的聲音","為了發出較低的聲音"],"answer":1,"explanation":""},{"id":"1505001298","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"小明對著一支長吸管吹氣，使吸管發出聲音，如果把吸管剪短，用相同的力量再吹一次，聲音會有什麼變化？","options":["聲音變低","聲音變高","聲音變小","聲音變大"],"answer":1,"explanation":"空氣柱變短，發出的聲音會變高。"},{"id":"1505001302","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"小翔自製了一個橡皮筋樂器，他發現在橡皮筋下方加上杯子當作音箱後，彈撥橡皮筋時聲音變大了。這是什麼原因造成的？","options":["音箱改變了橡皮筋振動的快慢","音箱能吸收雜音，讓聲音聽起來更清脆","音箱能增加與空氣碰撞的接觸面積，進而增強空氣振動","橡皮筋在杯子上的振動幅度會變小"],"answer":2,"explanation":"單獨撥動橡皮筋產生的振動不足以使空氣強烈振動。加上音箱後，透過物體振動與音箱的交互作用，能提高與空氣碰撞的接觸面積，增強空氣振動，使音量變大。"},{"id":"1505001320","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"下列關於烏克麗麗的敘述，哪一項是不正確的？","options":["烏克麗麗有4條材質相同、粗細不同的弦，所以能發出4種不同音色的聲音","烏克麗麗是一種弦樂器","彈撥烏克麗麗的弦，可以使它發出聲音","改變弦的鬆緊或長短，可以使同一條弦發出高低不同的聲音"],"answer":0,"explanation":"材質相同、粗細不同的弦，能發出音色相同但高低不同的聲音。"},{"id":"1505001323","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"鐵琴上不同長短的金屬片，主要會影響聲音三要素中的哪一項？","options":["音色","音量","音調","能量"],"answer":2,"explanation":""},{"id":"1505001325","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"學校管樂社的小華正在整理散落一地的鐵琴琴鍵。他想將這幾片金屬琴鍵由低音到高音（Do、Re、Mi……）依序排列後重新組裝，他應該如何排列這些琴鍵？","options":["將琴鍵由長排到短","將琴鍵由短排到長","隨意排列，琴鍵的長短與音調無關","隨意排列，之後再用不同的力量敲擊產生高低不同的聲音"],"answer":0,"explanation":""},{"id":"1505001331","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"許多樂器有音箱的構造，例如吉他、鼓。下列哪一項是音箱主要的功能？","options":["改變聲音的音色，讓聲音變好聽","提高發聲體與空氣碰撞的接觸面積，增強空氣振動使音量變大","讓樂器的音調變得更高","為了裝飾樂器，讓外型看起來更美觀"],"answer":1,"explanation":""},{"id":"1505001338","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"利用手指按住直笛不同的笛孔，能吹奏一首歌曲的高低旋律，這是因為什麼條件改變造成的呢？","options":["嘴巴吹奏的位置","笛子的長短","音箱的大小","空氣柱的長短"],"answer":3,"explanation":"以直笛吹奏歌曲，是利用手指按住不同笛孔，改變空氣柱的長短發出高低不同的聲音。"},{"id":"1505001339","unit":"02-02","type":"choice","difficulty":"中","topic":"音箱對聲音大小的影響","question":"樂器的音箱和發出的聲音有什麼關係？","options":["有音箱的樂器聲音較大","有音箱的樂器聲音較高","沒有音箱的樂器聲音較低","沒有音箱的樂器聲音較高"],"answer":0,"explanation":""},{"id":"1505001342","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"調整烏克麗麗的弦鈕，將弦旋得更緊時，彈出的聲音會發生什麼變化？","options":["音調變高","音調變低","音量變大","音色改變"],"answer":0,"explanation":"發聲物體的鬆緊會影響音調，物體越緊，振動頻率通常越高，音調隨之變高。"},{"id":"1505001343","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"許多弦樂器，例如烏克麗麗、吉他，都有一個空心的音箱構造，請問音箱最主要的功能是什麼？","options":["改變聲音的音調，讓彈奏出來的聲音變高","增加發聲體與空氣碰撞的接觸面積，增強空氣振動使音量變大","吸收多餘的雜音，讓聲音變好聽且不會產生噪音","為了減輕樂器的重量，方便音樂家攜帶"],"answer":1,"explanation":"吉他弦細微的振動不足以使空氣強烈振動，因此需要加上音箱。音箱能提高發聲體與空氣碰撞的接觸面積，進而增強空氣的振動，使音量變大。"},{"id":"1505001348","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"撥彈越短、越緊的釣魚線時，所發出的聲音會如何？","options":["聲音越大","聲音越小","聲音越高","聲音越低"],"answer":2,"explanation":""},{"id":"1505001352","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列關於直笛發出的聲音和空氣柱的關係，哪一項是正確的？","options":["空氣柱的長短和直笛的音色有關","空氣柱越長，聲音越高","空氣柱越短，聲音越高","空氣柱的長短和聲音大小有關"],"answer":2,"explanation":""},{"id":"1505001357","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"下列哪一種方法可以改變直笛發出的聲音大小？","options":["用大小不同的力量吹直笛","按壓較少的笛孔","按壓較多的笛孔","更換直笛的材質"],"answer":0,"explanation":""},{"id":"1505001366","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"如果改變鼓面的材質，鼓發出的聲音會有什麼不同？","options":["聲音的大小不同","聲音的高低不同","聲音的音色不同","聲音沒有改變"],"answer":2,"explanation":"改變鼓面的材質，鼓發出的音色會不同。"},{"id":"1505001373","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"鐵琴上有長短不一的金屬片。敲擊哪一種金屬片會發出較低的聲音？","options":["較短的金屬片","較長的金屬片","厚度較薄的金屬片","用更大的力氣敲擊"],"answer":1,"explanation":""},{"id":"1505001380","unit":"02-02","type":"choice","difficulty":"中","topic":"音箱對聲音大小的影響","question":"有些樂器具有音箱，下列哪一項是音箱的主要功用？","options":["改變音色","增加音調","使樂器更美觀","使聲音變大"],"answer":3,"explanation":""},{"id":"1505001381","unit":"02-02","type":"choice","difficulty":"中","topic":"聲音三要素","question":"小廷在練習吹奏直笛時，如果他想要吹出一個音調較低的聲音，他應該如何操作？","options":["按住較少的笛孔，讓空氣柱變短","按住較多的笛孔，讓空氣柱變長","用更大的力氣吹","更換一支管身較短的直笛"],"answer":1,"explanation":"吹直笛時是管內的空氣柱在振動。按壓的笛孔數越多，空氣柱會越長，發出的聲音就越低。"},{"id":"1505001389","unit":"02-02","type":"choice","difficulty":"難","topic":"觀察直笛","question":"小妍正在練習吹奏直笛，他發現手指按住笛孔的數量會改變聲音的高低。吹奏直笛時，主要是什麼振動產生聲音？","options":["直笛外殼的塑膠材質","手指與笛孔的摩擦","直笛管身內的空氣柱","吹奏者的嘴脣"],"answer":2,"explanation":"直笛管身中空且充滿空氣，稱為空氣柱，吹奏時是由空氣柱振動產生聲音。"},{"id":"1505001395","unit":"02-02","type":"choice","difficulty":"中","topic":"科學研究步驟與變因","question":"小萱用一樣大小的力彈撥橡皮筋時，發現不同條橡皮筋發出的聲音高低不一樣，請問下列哪一項不是造成聲音高低可能的原因？","options":["橡皮筋的鬆緊度不同","橡皮筋的顏色不同","橡皮筋的粗細不同","橡皮筋的長短不同"],"answer":1,"explanation":""},{"id":"1505001400","unit":"02-02","type":"choice","difficulty":"中","topic":"音箱對聲音大小的影響","question":"烏克麗麗的音箱主要功能為何？","options":["改變聲音的音調高低","收集聲音使其不外洩","增強空氣振動以擴大音量","美化樂器的外觀"],"answer":2,"explanation":"音箱可增加發聲體與空氣的接觸面積，進而增強空氣振動，達到擴大音量的效果。"},{"id":"1505001405","unit":"02-02","type":"choice","difficulty":"難","topic":"聲音三要素","question":"下列哪一項敘述與音量有關？","options":["小康用力和輕輕吹直笛","小軒吹奏不同笛孔數的直笛","小廷彈撥吉他的粗弦、細弦","小妍用同樣的力按鋼琴鍵兩次，第一次按1秒，第二次按5秒"],"answer":0,"explanation":"②③是空氣柱的長短、物體的粗細會影響聲音音調，④是聲音長短。"},{"id":"1505000017","unit":"02-03","type":"choice","difficulty":"中","topic":"光的直線行進","question":"下列哪一個現象的原理和「放在水中的吸管看起來好像斷掉了」相同？","options":["山路轉彎處的凸面鏡","用鏡子可以反射光線","陽光通過放大鏡會匯聚成光點","小狗在陽光下移動，影子也跟著動"],"answer":2,"explanation":""},{"id":"1505000075","unit":"02-03","type":"choice","difficulty":"中","topic":"製造彩虹色光","question":"製造彩虹時，使用噴霧器的主要目的是什麼？","options":["製造小水滴來反射太陽光","製造小水滴來折射太陽光","製造小水滴來反射和折射太陽光","製造小水滴來散射太陽光"],"answer":2,"explanation":""},{"id":"1505000142","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"小哲怎樣做才能讓彩虹色光看起來更清楚？","options":["穿黑色的衣服","製造更多的水霧","面對陽光噴水霧","趴在地上噴水霧"],"answer":1,"explanation":""},{"id":"1505000922","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"小芸在公園看見噴水池噴出的水霧中出現彩虹般的色光。關於這個現象，下列敘述何者正確？","options":["彩虹色光原本就存在於白光中","彩虹色光是水霧自行發出的光","只有晚上才會出現彩虹色光","彩虹色光是空氣中的灰塵造成的"],"answer":0,"explanation":""},{"id":"1505000927","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"將尺直立放入裝水的容器中，尺在水中的刻度看起來會有什麼不同？","options":["刻度變窄了","刻度變寬了","刻度消失了","沒有任何變化"],"answer":0,"explanation":"水中物體反射的光，從水中進入空氣中時會產生折射現象，此時水面下物體長度看起來會比實際來得短，所以尺的刻度看起來也變窄。"},{"id":"1505000937","unit":"02-03","type":"choice","difficulty":"中","topic":"生活中的例子","question":"下列哪一個例子不是凸透鏡的應用？","options":["用放大鏡看報紙","用投影機投影出放大的影像","用昆蟲觀察罐放大昆蟲的影像以方便觀察","用後照鏡看後方來車"],"answer":3,"explanation":""},{"id":"1505000941","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"陽光通過什麼工具後，會出現彩虹般的色光？","options":["平面鏡","三稜鏡","分貝計","音箱"],"answer":1,"explanation":""},{"id":"1505000951","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"有些手電筒具有凸透鏡，可以使光線更聚集，主要是利用光的什麼特性？","options":["直線前進","反射","折射","彎曲前進"],"answer":2,"explanation":""},{"id":"1505000956","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"週末小強跟著爺爺到溪邊體驗傳統的「叉魚」活動。爺爺告訴他：「你在水面上看到的魚，位置其實是假的，要懂得修正瞄準點才叉得到。」請問根據光的折射原理，小強應該朝向哪個方向出手，才最容易叉中水裡的魚？","options":["直接瞄準眼睛看到的魚的位置","瞄準看到魚的位置的下方","瞄準看到魚的位置的上方","瞄準魚的影子"],"answer":1,"explanation":"光從水進入空氣時會偏離法線，導致眼睛看到的影像比實際位置淺（高），因此需往深處（下方）瞄準。"},{"id":"1505000960","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"雨後天晴，陽光通過小水滴形成了彩虹，天空中的彩虹不會出現哪一種顏色？","options":["紅色","藍色","黑色","綠色"],"answer":2,"explanation":""},{"id":"1505000962","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"使用放大鏡觀察遠處的景物時，所看到的影像通常會呈現什麼樣子？","options":["正立放大","倒立","縮小正立","影像消失不見"],"answer":1,"explanation":""},{"id":"1505000963","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"把一支筷子斜放到裝水的玻璃杯中，從側面看會有什麼現象？","options":["筷子不見了","筷子變小了","筷子好像斷掉了","筷子變成湯匙"],"answer":2,"explanation":""},{"id":"1505000965","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"關於彩虹與色光的產生，下列敘述哪一項是正確的？","options":["陽光是由紅、橙、黃、綠、藍、靛、紫等不同色光組成的","只有在雨後的天空中才可能看到彩虹色光","彩虹是因為陽光照射到空氣中的塵埃產生的反射現象","只要面向陽光噴灑水霧，就能看到最清楚的彩虹"],"answer":0,"explanation":"②陽光下的噴水池、泡泡也可以看到彩紅色光；③看見彩虹是因為陽光照射到空氣中的小水滴，產生折射與反射，使光分散；④製造彩虹時應背對陽光噴灑水霧。"},{"id":"1505000969","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"下列哪一種情況無法觀察到「光的色散現象」呢？","options":["陽光下的瀑布","陽光穿過三稜鏡","陽光下的大理石地板","雨後天晴"],"answer":2,"explanation":""},{"id":"1505000970","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"將雷射筆的光從斜上方射入半滿的裝水透明容器中，光會在哪裡產生偏折？","options":["空氣中","水中","水面","透明容器的邊緣"],"answer":2,"explanation":"光的折射現象發生在兩種不同物質（空氣和水）的交界處，所以光會在水面處產生偏折。"},{"id":"1505000972","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"將尺直立放在裝水的容器中，會有什麼現象發生？","options":["水面下的尺好像變長了","水面下的尺刻度看起來比較窄","直尺變彎了","沒有變化"],"answer":1,"explanation":"水中物體反射的光，從水中進入空氣中時會產生折射現象，此時水面下物體長度看起來會比實際來得短，所以尺的刻度看起來也變窄。"},{"id":"1505000974","unit":"02-03","type":"choice","difficulty":"難","topic":"聲音的傳播速度","question":"打雷與閃電的發生大多來自雲層中有雷雨胞，雷雨胞中的帶電粒子碰撞時會產生極大能量，進而產生強光，並讓周圍空氣瞬間膨脹時產生雷聲。關於打雷與閃電的敘述，下列哪一項是正確的？","options":["閃電發生的總是比雷聲早，所以我們會先看到閃電","光速為每秒3億公尺，在短距離內的傳播時間幾乎可忽略不計","聲音在空氣中的傳播速度比光還要快","若閃電與雷聲的間隔時間越短，代表打雷的位置離我們越遠"],"answer":1,"explanation":"①②③閃電與打雷幾乎同時發生，但光速（約3億公尺/秒）遠大於聲速（約340公尺/秒），因此我們能即時看到閃電，而聲音需要時間傳播；④閃電和雷聲的間隔縮短代表打雷的位置離我們越近。"},{"id":"1505000978","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"為什麼我們在下雨後的天空容易看到彩虹？","options":["因為雲朵反射了陽光","因為空氣中的塵埃吸收了色光","因為地面上的積水反射陽光","因為空氣中的小水滴使陽光產生折射與反射"],"answer":3,"explanation":""},{"id":"1505000997","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"昆蟲觀察罐的蓋子具有什麼構造，可以放大昆蟲的影像，方便觀察？","options":["凸透鏡","凹透鏡","平面鏡","三稜鏡"],"answer":0,"explanation":""},{"id":"1505001000","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"小妍在游泳池戲水時，發現水中的腿部看起來變短了，在溪邊看溪底也覺得變淺了，這些現象是光的哪種特性造成的？","options":["光的直線行進","光的反射","光的折射","光的色散"],"answer":2,"explanation":""},{"id":"1505001008","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"在哪一種情況下比較容易看到彩虹？","options":["下大雨的早晨","豔陽高照的中午","雨過天晴的下午","雷雨交加的夜晚"],"answer":2,"explanation":""},{"id":"1505001024","unit":"02-03","type":"choice","difficulty":"難","topic":"光的反射","question":"光從空氣中照射到下列哪一個物品不會產生折射？","options":["透明杯中的綠茶","放大鏡","容器中的水","鏡子"],"answer":3,"explanation":"光照射到鏡子時，會產生反射現象。"},{"id":"1505001029","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"清澈可見的河底，看起來深度會比實際深還是淺？","options":["深","淺","一樣","一下深，一下淺"],"answer":1,"explanation":""},{"id":"1505001032","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"在教室外使用噴霧器製造彩虹時，下列哪一項不是必要條件？","options":["適當的噴水角度","陽光","水霧","風"],"answer":3,"explanation":""},{"id":"1505001033","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"小美想撿起溪水中的石頭，卻發現石頭看起來比實際位置淺，這是什麼原因造成的？","options":["這是光的折射現象所造成的視覺變化","這是因為水中有放大鏡，把石頭放大了","石頭真的會隨時間自動往水面浮起","這證明了光在水中是曲線行進的"],"answer":0,"explanation":""},{"id":"1505001042","unit":"02-03","type":"choice","difficulty":"難","topic":"聲音的傳播速度","question":"當我們看到閃電後，過了一段時間才聽到雷聲。如果看到閃電與聽到雷聲的間隔時間越長，代表什麼意義？","options":["代表閃電發生的位置距離我們越遠","代表當天空氣中聲音傳播的速度變快了","代表打雷的音量非常小","代表光傳播的速度變慢了，快要跟聲音一樣"],"answer":0,"explanation":"看到閃電和聽到雷聲的間隔時間越長，代表打雷的位置距離我們越遠。這是因為光速（每秒3億公尺）遠大於聲速（每秒340公尺），兩者傳播到我們位置的時間差可用來判斷距離。"},{"id":"1505001043","unit":"02-03","type":"choice","difficulty":"難","topic":"光的色散","question":"下列敘述哪一個是正確的？","options":["站在樹蔭下，面向陽光噴水霧可以製造出彩虹","在下雨時的瀑布旁有可能看到像彩虹一樣的現象","陽光通過三稜鏡能產生色光","陽光是由單一色光組成"],"answer":2,"explanation":"①背對陽光才能製造出彩虹；②在陽光下才可能看到；④陽光是由七種色光組成。"},{"id":"1505001062","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"下列有關光的折射現象，哪一項敘述是不正確的？","options":["光在水中或是空氣中都是直線行進的","光從水中進入空氣中會產生折射現象","彩虹的形成與光的折射有關","光源一定要使用雷射筆才會產生折射現象"],"answer":3,"explanation":"使用任何光源都可以，雷射筆的光較為容易觀察。"},{"id":"1505001066","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"在光的行進路線中放置下列哪一種物品，當觀察角度適當時，可以看到光的折射現象？","options":["方形的木塊","裝水的透明容器","圓形的鏡子","鐵製的盒子"],"answer":1,"explanation":""},{"id":"1505001068","unit":"02-03","type":"choice","difficulty":"中","topic":"放大鏡","question":"小翔在使用放大鏡時，下列哪一項行為最危險，必須絕對禁止？","options":["用放大鏡看地上的螞蟻","用放大鏡看書本上的小字","拿放大鏡直接觀察太陽","透過放大鏡看遠方的同學"],"answer":2,"explanation":"不可用放大鏡直接看太陽，因為放大鏡具備聚光效果，會使光線匯聚，對眼睛造成傷害。"},{"id":"1505001075","unit":"02-03","type":"choice","difficulty":"難","topic":"光的直線行進","question":"小婷將直尺放入水中，刻度看起來好像變窄了，這是由於下列哪一種光的特性？","options":["光是直線前進的","反射現象","折射現象","亂射現象"],"answer":2,"explanation":"水中物體反射的光，從水中進入空氣中時會產生折射現象，此時水面下物體長度看起來會比實際來得短，所以尺的刻度看起來也變窄。"},{"id":"1505001078","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"想要在戶外利用噴霧器製造彩虹，下列哪一組條件最容易成功？","options":["陰天時，面向任何方向噴灑細小的水霧","陽光下，背對陽光並面向陰影處，噴灑細小的水霧","陽光下，面向陽光並噴灑水柱","陰天時，面向任何方向噴灑的水柱"],"answer":1,"explanation":""},{"id":"1505001082","unit":"02-03","type":"choice","difficulty":"易","topic":"光的折射","question":"在溪邊戲水時，從岸上看溪底，溪水看起來似乎比實際深度淺。這是光的哪一種現象造成的？","options":["光的直線行進","光的反射","光的色散","光的折射"],"answer":3,"explanation":""},{"id":"1505001087","unit":"02-03","type":"choice","difficulty":"難","topic":"聲音的傳播速度","question":"在午後雷陣雨中，我們通常是先看到閃電，才聽到雷聲。關於此現象的科學解釋，下列何者正確？","options":["閃電與雷聲發生的時間點並不一致","聲音在雨天中無法傳播得很遠","光的傳播速度遠快於聲音","閃電發生的位置通常比雷聲近"],"answer":2,"explanation":"閃電和打雷幾乎同時發生，但因為光速遠快於聲速，所以看到閃電與聽到雷聲會有時間差，間隔越長代表距離越遠。"},{"id":"1505001093","unit":"02-03","type":"choice","difficulty":"中","topic":"生活中的例子","question":"下列生活中的物品，哪一種的原理與放大鏡的聚光與放大特性有關？","options":["投影機鏡頭","平面鏡","直尺","深色窗簾"],"answer":0,"explanation":""},{"id":"1505001094","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"雨過天晴後，有時會看見彩虹，下列哪一項原因是不正確的？","options":["陽光照射到飄浮在空氣中的小水滴","陽光產生折射和反射的現象","陽光分散成不同的色光","陽光是由一種顏色的色光組成的"],"answer":3,"explanation":""},{"id":"1505001101","unit":"02-03","type":"choice","difficulty":"中","topic":"生活中的例子","question":"下列哪一個現象是光的折射所造成的？","options":["在鏡子中看到自己的影像","陽光下出現黑色的影子","裝水的杯子裡的吸管看起來斷了","手電筒照出直線的光束"],"answer":2,"explanation":""},{"id":"1505001105","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"放大鏡的鏡片是利用下列哪一種形狀的玻璃片製成？","options":["中間和四周一樣厚","上面薄、下面厚","中間厚、四周較薄","中間薄、四周較厚"],"answer":2,"explanation":""},{"id":"1505001106","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"小平拿著放大鏡觀察遠處牆上的海報，他看到的影像會是如何？","options":["正立放大的影像","正立縮小的影像","倒立的影像","影像會重疊模糊不清"],"answer":2,"explanation":""},{"id":"1505001121","unit":"02-03","type":"choice","difficulty":"中","topic":"製造彩虹色光","question":"在陽光下背對太陽噴水霧製造彩虹，若將噴嘴調成水柱狀，結果會如何？","options":["彩虹會更清楚","依然能看到彩虹","看不到彩虹","水柱會變成紅色"],"answer":2,"explanation":"彩虹需透過細小水滴產生折射與反射，水柱無法提供足夠的小水滴來分散色光。"},{"id":"1505001122","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"在餐廳吃飯時，妹妹把吸管放入裝水的玻璃杯中，驚訝地大叫：「哥你看！吸管斷掉了！」哥哥湊近觀察，發現從水面上看，吸管在水中的部分看起來似乎與水面上的部分不在同一直線上。關於這個現象，下列哪一位同學的解釋最符合科學原理？","options":["小華說：「這是因為光在水中的速度比在空氣中快，所以光線被拉長了。」","小明說：「這是光的反射作用，就像鏡子反射影像一樣。」","小美說：「這是光的折射作用，來自水下吸管的光線進入空氣時產生偏折，讓人眼產生錯覺。」","小麗說：「這只是玻璃杯厚度造成的放大鏡效果，與水無關。」"],"answer":2,"explanation":""},{"id":"1505001125","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"下列關於用放大鏡看物體的敘述，哪一項正確？","options":["放大鏡會使光產生繞射","放大鏡和物體之間的距離不同時，會看到不同的影像","用放大鏡看近處的物體時，會看到倒立放大的影像","用放大鏡看遠處的物體時，會看到正立放大的影像"],"answer":1,"explanation":"放大鏡會使光產生折射；用放大鏡看近處的物體時，會看到正立放大的影像；用放大鏡看遠處的物體時，會看到倒立的影像。"},{"id":"1505001134","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"陽光透過三稜鏡後會出現彩虹般的色光，而噴水池旁也常能看見彩虹色光。彩虹般的色光是如何形成的？","options":["陽光照射到空氣中的小水滴，產生折射和反射現象，使陽光分散成不同的色光","噴水池的水中含有不同顏色的顏料，被陽光照亮了","陽光在空氣中直線行進時，自然會變換顏色","在雨過天晴時，太陽會發出不同顏色的光"],"answer":0,"explanation":"原本看起來是白色的陽光是由不同色光組成的。當陽光照射到空氣中的小水滴或穿過三稜鏡時，會產生折射和反射，使陽光分散成紅、橙、黃、綠、藍、靛、紫等色光。"},{"id":"1505001141","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"鉛筆在裝有水的玻璃杯中看起來好像斷掉了，請問這是下列哪一種光的現象？","options":["折射","反射","直線行進","分散成不同色光"],"answer":0,"explanation":""},{"id":"1505001142","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"下雨過後，天空有時會出現美麗的彩虹。關於彩虹色光與太陽光的組成，下列敘述何者正確？","options":["太陽光是單純的白光，不包含其他色光","陽光是由紅、橙、黃三種顏色色光組成的","製造彩虹色光時，必須背對太陽噴水霧才看得見","彩虹的形成只跟光的反射有關，跟折射無關"],"answer":2,"explanation":"①②陽光可以是由多種色光組成；④彩虹的產生和光的反射、折射都有關係。"},{"id":"1505001144","unit":"02-03","type":"choice","difficulty":"難","topic":"光的反射","question":"小月想要觀察光的折射現象，請問他應該觀察哪一種情況？","options":["水池的水看起來變淺了","看到鏡子中的自己","用後照鏡看後方來車","湖面上映照著山的倒影"],"answer":0,"explanation":"② ③④為反射現象。"},{"id":"1505001145","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"當光線從空氣斜斜射入水中時，行進路線會發生偏折，這種現象稱為什麼？","options":["折射現象","反射現象","直線行進","色散現象"],"answer":0,"explanation":""},{"id":"1505001148","unit":"02-03","type":"choice","difficulty":"中","topic":"光的反射","question":"「從岸上看站在水中的人，腳看起來好像變短了」，這個現象和下列哪一種現象的原理相同？","options":["照鏡子整理儀容","萬花筒中美麗、多變的圖案","從路旁的凸面鏡看到對向來車","插入水中的吸管看起來像斷了"],"answer":3,"explanation":"「從岸上看站在水中的人，腳看起來好像變短了」與「插入水中的吸管看起來像斷了」都是因為光的折射現象，而①②③是光的反射現象。"},{"id":"1505001152","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"光由空氣中進入水中，會發生偏折，這是光的哪一種現象？","options":["反射","折射","散射","直線行進"],"answer":1,"explanation":""},{"id":"1505001154","unit":"02-03","type":"choice","difficulty":"難","topic":"放大鏡","question":"小晴想利用放大鏡在陽光下進行聚光實驗。關於放大鏡的性質與實驗安全，下列敘述何者正確？","options":["放大鏡中間薄、四周厚，屬於凹透鏡","放大鏡會使光線折射後向四周發散，亮度變暗","放大鏡是凸透鏡，能使光線往中間匯聚，聚光處亮度最亮","為了看清楚光點，實驗時可以用放大鏡直接觀察太陽"],"answer":2,"explanation":"放大鏡是中間厚、四周較薄的玻璃片製成，屬於凸透鏡。它會使直線行進的光產生折射現象並往中間匯聚，光匯聚越集中的地方亮度越亮。注意絕對不可用放大鏡看太陽，會使眼睛受傷。"},{"id":"1505001155","unit":"02-03","type":"choice","difficulty":"難","topic":"光的色散","question":"一陣大雨過後，太陽出來了，東方天空出現一道彩虹，請問此時是什麼時候？","options":["早上","中午","下午","晚上"],"answer":2,"explanation":"彩虹出現在東方，表示陽光在西方，太陽在西方表示此時是下午。"},{"id":"1505001157","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"在光線照射下，下列哪一種物品可以看到像彩虹般的色光？","options":["橡皮擦","肥皂泡泡","籃球","鉛筆"],"answer":1,"explanation":""},{"id":"1505001160","unit":"02-03","type":"choice","difficulty":"難","topic":"光的反射","question":"把一枝完整的鉛筆放到裝水的玻璃杯中，水面下的鉛筆看起來好像斷掉了，這主要是什麼原因造成的？","options":["光的反射","光的折射","光的顏色改變","光會彎曲行進"],"answer":1,"explanation":"鉛筆從水中反射的光，進入空氣中時會產生折射，造成水中物體的位置和形狀看起來和原來不一樣。"},{"id":"1505001165","unit":"02-03","type":"choice","difficulty":"中","topic":"放大鏡","question":"為什麼不可以用放大鏡直接觀察太陽？","options":["因為放大鏡太小，會看不清楚太陽","因為放大鏡會將陽光匯聚，產生高溫傷害眼睛","因為會看到倒立的太陽影像","因為太陽光會穿過放大鏡不產生折射"],"answer":1,"explanation":"凸透鏡具有聚光性質，會使能量匯聚於一點，長時間觀察會灼傷視網膜。"},{"id":"1505001169","unit":"02-03","type":"choice","difficulty":"難","topic":"光的反射","question":"下列哪一個現象的原理與其他三者不同？","options":["從岸上看站在水中的人，腳看起來變短了","反光背心產生警示作用","透過汽車的後視鏡看到後方來車","在鏡子中看見自己的影像"],"answer":0,"explanation":"①是光的折射；② ③④是光的反射。"},{"id":"1505001170","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"喬喬和同學去戶外教學時，看見噴水池噴出的水霧中出現彩虹般的七彩色光，美麗的景象讓同學們爭相觀看。請問彩虹色光的出現是因為陽光照射到空氣中的什麼物質？","options":["灰塵","氧氣","小水滴","煙霧"],"answer":2,"explanation":"彩虹是因為陽光照射到飄浮在空氣中的小水滴，產生折射和反射，使原本的白光分散成不同色光。"},{"id":"1505001173","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"關於放大鏡的構造與成像特性，下列敘述何者正確？","options":["放大鏡是利用光的反射原理來讓物體影像變大","放大鏡與物體的距離不會影響成像，影像永遠都是正立放大的","放大鏡屬於凸透鏡，會使光產生折射並往中間匯聚","使用放大鏡看遠方物體時，會看到正立放大的影像"],"answer":2,"explanation":"放大鏡是凸透鏡，光線進入後會產生折射並往中間匯聚。透過放大鏡看物體時，成像隨距離改變，適當距離下為正立放大，看遠方物體時則為倒立影像。放大鏡的成像原理是光的折射而非反射。"},{"id":"1505001189","unit":"02-03","type":"choice","difficulty":"難","topic":"光的直線行進","question":"下列哪一個情景是光的折射現象應用？","options":["平靜的湖面倒影著周圍的景物","放在水杯中的吸管看起來像斷掉了","小琪在萬花筒中，看到繽紛的圖案","廟口正在上演皮影戲"],"answer":1,"explanation":"①③光的反射現象；④光的直線行進。"},{"id":"1505001190","unit":"02-03","type":"choice","difficulty":"易","topic":"聲音的傳播速度","question":"下列關於閃電和雷聲的現象敘述，哪一項是正確的？","options":["閃電打雷時，先看到閃電，才聽到雷聲","閃電打雷時，先聽到雷聲，才看到閃電","閃電打雷時，會同時聽到雷聲和看見閃電　","閃電打雷時，有時會先看到閃電，有時會先聽到雷聲"],"answer":0,"explanation":""},{"id":"1505001191","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"小晴想要製造彩虹色光，下列哪一種方法是正確的？","options":["晴天時面向陽光噴水霧","用鏡子反射陽光","晴天時，背對陽光，面向陰暗處噴水霧","用雷射筆的光照射裝水的杯子"],"answer":2,"explanation":""},{"id":"1505001196","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"放大鏡的鏡片是使用什麼樣的玻璃片製成的？","options":["中間薄四周厚","上面厚下面薄","中間厚四周薄","上面薄下面厚"],"answer":2,"explanation":""},{"id":"1505001202","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"下列關於放大鏡的敘述，哪一項是不正確的？","options":["它是一種中間厚、四周薄的凸透鏡","它會使光產生折射現象","光通過放大鏡後會往中間匯聚","不論距離遠近，用放大鏡看到的影像永遠是正立放大的"],"answer":3,"explanation":""},{"id":"1505001213","unit":"02-03","type":"choice","difficulty":"易","topic":"光的折射","question":"關於放大鏡的構造與光學特性，下列敘述何者正確？","options":["放大鏡是中間厚、四周較薄的透鏡","放大鏡會使平行光通過後向四周發散","放大鏡屬於凹透鏡的一種","陽光穿過放大鏡後，會消失不見"],"answer":0,"explanation":""},{"id":"1505001216","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"下列哪一個實驗可以說明光的折射現象?","options":["光射向容器中的鏡子","光射入裝水的容器","光射入空的容器","吸管放在空的杯子中"],"answer":1,"explanation":""},{"id":"1505001220","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"在溪邊用竹竿刺魚的時候，由於光的折射現象，魚在水中的實際位置會比肉眼觀察到的位置來得？","options":["更深","更淺","不變","有時深有時淺"],"answer":0,"explanation":""},{"id":"1505001222","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"下列哪一項是光的折射現象？","options":["從岸上看泳池裡的人，感覺腿變短了","從鏡子中看見自己的影像","雲層間透出陽光","雷射筆的光在空氣中直線行進"],"answer":0,"explanation":""},{"id":"1505001224","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"從岸上看溪水會覺得水變淺了，這是光的什麼特性造成的？","options":["反射","折射","直線行進","色散"],"answer":1,"explanation":""},{"id":"1505001227","unit":"02-03","type":"choice","difficulty":"易","topic":"光的折射","question":"光斜斜的由空氣進入水中時所產生偏折的現象稱為什麼？","options":["折射現象","光的直線前進","亂射現象","繞射現象"],"answer":0,"explanation":""},{"id":"1505001229","unit":"02-03","type":"choice","difficulty":"難","topic":"聲音的傳播速度","question":"關於光與聲音的傳播速度，下列敘述何者正確？","options":["兩者速度一樣快","聲音的速度比光快","光的速度比聲音快得多","光每秒傳播340公尺"],"answer":2,"explanation":""},{"id":"1505001250","unit":"02-03","type":"choice","difficulty":"易","topic":"光的折射","question":"利用雷射筆觀察光在水中的行進路線時，在水中加入顏料的目的是什麼？","options":["方便觀察","光只能在有顏色的水中行進","增加美觀","增加光的穿透力"],"answer":0,"explanation":""},{"id":"1505001254","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"光從空氣中斜斜射入下列哪個物品，不會產生折射？","options":["水","橄欖油","烏龍茶","木板"],"answer":3,"explanation":""},{"id":"1505001261","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"下列哪一個是光的折射現象？","options":["陽光下出現物體的影子","從鏡子中看見自己的影像","樹林間透出陽光","從岸上看溪底，感覺溪水深度變淺"],"answer":3,"explanation":""},{"id":"1505001269","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"透過放大鏡看物體時，下列哪一項敘述是正確的？","options":["放大鏡的聚光現象是光反射造成的","在適當距離內可以看到顏色改變的影像","看遠方的物體時，可以看到倒立的影像","距離物體不論遠和近，看到影像皆一樣"],"answer":2,"explanation":""},{"id":"1505001271","unit":"02-03","type":"choice","difficulty":"中","topic":"光的反射","question":"下列哪一個現象形成的原因和「從岸上看游泳池，泳池的水看起來比較淺」的現象相同？","options":["從山路轉彎處的凸面鏡可以看見對向來車","用鏡子可以反射光線","放在飲料杯中的吸管好像斷掉了","人站在陽光下，會形成影子"],"answer":2,"explanation":""},{"id":"1505001282","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"小晴用放大鏡看桌上書本中的字，下列哪一個可能是小晴會看到的現象？","options":["字變大了","字變小了","字消失了","字沒有任何變化"],"answer":0,"explanation":""},{"id":"1505001287","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"雨後天晴出現彩虹，是因為陽光照射到空中的小水滴產生了什麼現象？","options":["直線行進與吸收","折射與反射","只有反射現象","只有直線行進"],"answer":1,"explanation":""},{"id":"1505001289","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"下列哪一項敘述是光的折射現象？","options":["站在陽光下會形成影子","從岸上看溪底，溪水的深度好像變淺了","靜止的水面可以看見倒影","汽車的後照鏡可以看見後方車況"],"answer":1,"explanation":""},{"id":"1505001291","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"雷射筆的光由空氣中斜斜的照入水中時，光會改變行進的方向，這個現象稱為什麼？","options":["入射現象","反射現象","折射現象","雷射現象"],"answer":2,"explanation":""},{"id":"1505001294","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"在雨後天晴的陽光下，同時間在噴泉旁比在走廊上更可能出現彩虹，表示彩虹出現需要什麼條件？","options":["小水滴","灰塵","植物","人們"],"answer":0,"explanation":""},{"id":"1505001304","unit":"02-03","type":"choice","difficulty":"中","topic":"光的直線行進","question":"下列哪一個是光的折射現象？","options":["陽光下的大樹有影子","溪水看起來比實際深度還淺","反光背心產生警示作用","透過汽車後視鏡看到後方來車"],"answer":1,"explanation":""},{"id":"1505001309","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"夏天去游泳池玩耍時，小翔站在岸邊看弟弟玩水，感覺弟弟的身高似乎變矮了，請問這個現象主要是由光的什麼特性造成的？","options":["光的直線行進","光的反射現象","光的折射現象","光的色散現象"],"answer":2,"explanation":"光在水和空氣中的行進速率不同，會造成折射，進而產生水中物體較淺的錯覺。"},{"id":"1505001317","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"小晴拿著放大鏡在陽光下進行實驗，下列關於放大鏡光學特性的敘述，哪一項是正確的？","options":["放大鏡會使光線折射後向四周發散","放大鏡屬於凹透鏡，中間薄、四周厚","放大鏡會使光線折射後往中間匯聚，產生聚光現象","陽光穿過放大鏡後，會形成一個暗影區域"],"answer":2,"explanation":"放大鏡是中間厚、四周較薄的玻璃片製成，屬於凸透鏡。它會使光產生折射並往中間匯聚，光匯聚越集中的地方亮度越亮。"},{"id":"1505001330","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"筷子放在水中，看起來會有斷掉和放大的現象，這主要是光的什麼特性造成的？","options":["反射","折射","放射","轉彎"],"answer":1,"explanation":""},{"id":"1505001340","unit":"02-03","type":"choice","difficulty":"難","topic":"聲音的傳播速度","question":"午後發生雷陣雨時，通常是「先看到閃電，才聽到雷聲」，這是什麼原因？","options":["閃電發生的位置離我們比較近","光的傳播速度比聲音快很多","雲層會先產生電，經過一段時間才會產生碰撞聲","聲音在雨天中傳播的速度會變慢"],"answer":1,"explanation":"閃電和打雷幾乎是同時發生的，但因為光速（每秒約3億公尺）遠快於聲速（每秒約340公尺），所以我們會先看到閃電才聽到雷聲。"},{"id":"1505001347","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"陽光照射到下列哪一項物品後，無法產生彩虹色光？","options":["噴水池的水霧","肥皂泡泡","三稜鏡","黑色衣服"],"answer":3,"explanation":""},{"id":"1505001362","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"小哲想製造彩虹色光，請問他應該怎麼做？","options":["面對陽光噴水霧","將裝滿水的水桶放在陽光下","在樹蔭下噴水霧","背對陽光噴水霧"],"answer":3,"explanation":""},{"id":"1505001363","unit":"02-03","type":"choice","difficulty":"易","topic":"光的色散","question":"陽光是由不同的色光所組成，小晴觀察下雨後出現的彩虹，不會看到下列哪一種顏色？","options":["紅色","黃色","藍色","黑色"],"answer":3,"explanation":""},{"id":"1505001374","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"光從水中斜斜射入空氣中時，路徑會如何改變？","options":["維持直線不變","會產生偏折","光線會在水面消失","會轉向折回水中"],"answer":1,"explanation":""},{"id":"1505001378","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"老師請同學們各舉一個例子說明「折射現象」。請問哪一個例子不是折射現象的應用？","options":["昆蟲觀察罐方便觀察昆蟲","投影機的鏡頭","用放大鏡看報紙","用後照鏡看後方來車"],"answer":3,"explanation":"後照鏡看後方來車是反射現象。"},{"id":"1505001384","unit":"02-03","type":"choice","difficulty":"中","topic":"光的直線行進","question":"利用雷射筆觀察光在空氣中的行進路線，實驗時為什麼要使透明容器充滿煙？","options":["增加美觀","方便觀察","使雷射筆的光改變顏色","使雷射筆的光源變強"],"answer":1,"explanation":"煙霧中有許多懸浮粒子，能使雷射筆的光線更明顯而便於觀察。"},{"id":"1505001388","unit":"02-03","type":"choice","difficulty":"中","topic":"光的直線行進","question":"雷射筆的光從右方直直的射入裝有水的容器中，會觀察到哪一種現象？","options":["水位上升","光的折射","冒泡","光的直線行進"],"answer":3,"explanation":""},{"id":"1505001392","unit":"02-03","type":"choice","difficulty":"中","topic":"光的色散","question":"陽光照射到三稜鏡後，會出現彩虹般的色光。下列哪一項敘述是不正確的？","options":["陽光是由多種色光組成的","三稜鏡可以使不同色光分散開來","彩虹色光的出現與光的折射和反射有關","三稜鏡本身會產生新的顏色加入陽光中"],"answer":3,"explanation":""},{"id":"1505001393","unit":"02-03","type":"choice","difficulty":"難","topic":"聲音的傳播速度","question":"當閃電發生後，隔了3秒才聽到雷聲，若光傳播的時間忽略不計，聲音傳播的速度大約是每秒340公尺，打雷的地點距離我們大約多遠？","options":["340公尺","1020公尺","3億公尺","3公尺"],"answer":1,"explanation":"聲音在空氣中傳播速度約每秒340公尺，3秒則為340X3=1020公尺。"},{"id":"1505001394","unit":"02-03","type":"choice","difficulty":"中","topic":"光的折射","question":"小芬和家人出遊，飯店裡有漂亮的游泳池，在游泳池戲水時小芬站在池邊看水中媽媽的腿，發現腿看起來變短了，這是什麼現象造成的？","options":["光的反射","光的折射","光的直線行進","光的色散"],"answer":1,"explanation":""},{"id":"1505001396","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"小妍拿著放大鏡在陽光下觀察，發現紙面上出現一個非常亮的小圓點。關於此現象，下列分析何者正確？","options":["這是光的反射現象，亮點是太陽影像的反射","放大鏡中間厚、四周薄，會使光線折射後向中間匯聚","亮點處的亮度最亮，但溫度不會改變，可以長時間觀察","若將放大鏡換成一般平板玻璃，也會產生相同的聚光點"],"answer":1,"explanation":"放大鏡是凸透鏡，會使光線折射並往中間匯聚，產生聚光現象。聚光處溫度極高，不可用手摸或用眼長時間直視，否則會受傷。一般玻璃只能讓光線會直線通過，不具備匯聚功能。"},{"id":"1505001404","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"下列關於生活中光的折射現象，哪一個敘述是不正確的？","options":["從岸上看游泳池中的人，腿部看起來好像變短了，是因為光從水斜射入空氣會產生偏折","雷射筆的光從空氣中垂直射入水中時，會產生偏折","將吸管斜放入裝水的玻璃杯，看起來好像斷成兩截，這是折射造成的視覺現象","從岸上看溪底感覺變淺，是因為光的折射"],"answer":1,"explanation":"當光從空氣中斜斜的射入水中時，行進路線才會改變。若垂直入射（非斜向），則不會產生偏折。其他選項如水底變淺、腿變短、吸管折斷感皆為正確的折射觀察。"},{"id":"1505001413","unit":"02-03","type":"choice","difficulty":"難","topic":"光的折射","question":"原本看不到空碗底的硬幣，慢慢加水之後卻能看見，這是什麼原因造成的？","options":["水的浮力，使硬幣浮起來","水造成光的反射，使硬幣可以被看見","光的直線行進，使硬幣可以被看見","水使光產生折射，使硬幣可以被看見"],"answer":3,"explanation":"水中物體反射的光，從水中進入空氣中時會產生折射現象，此時碗底看起來會比實際來得淺，因此可以看到碗底的硬幣。"}];

const makeState=()=>({version:2,classMeta:Object.fromEntries(CLASSES.map(c=>[c,{name:c,active:true}])),classes:Object.fromEntries(CLASSES.map(cl=>[cl,{students:Array.from({length:30},(_,i)=>({id:uid(),no:i+1,name:`示範學生${String(i+1).padStart(2,'0')}`,notes:''})),seats:{normal:[],lab:[]},attendance:[],tasks:[],results:[],points:[]}]))});

function renderPoints(){return `<section class="panel"><div class="panelHead"><h2>★ ${esc(classDisplay(cl))}加減分工作台</h2><span class="pill">點學生卡片可多選</span></div><div class="actions"><button class="btn small outline" data-select-points="all">選全班</button><button class="btn small outline" data-select-points="clear">清除選取</button><button class="btn small outline" data-select-points="group">選實驗小組</button><select id="pointGroup">${['第一組','第二組','第三組','第四組','第五組'].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></div><p class="hint">已選 <strong id="selectedPointCount">${pointSelection.size}</strong> 位；只影響目前 ${classDisplay(cl)}。點數與原因保留在學生紀錄。</p><div id="pointPeople" class="personGrid">${pointCards()}</div><div class="actions"><button class="btn" data-bulk-point="1">＋1 分</button><button class="btn" data-bulk-point="2">＋2 分</button><button class="btn danger" data-bulk-point="-1">－1 分</button><button class="btn danger" data-bulk-point="-2">－2 分</button><label>自訂分數 <input type="number" id="customPoint" value="1" style="width:80px"></label><button class="btn outline" id="giveCustomPoint">套用</button></div><label class="inlineLabel">原因／備註 <input id="pointsReason" placeholder="如：實驗操作認真、合作良好" style="min-width:240px;flex:1"></label><h3>常用行為一鍵記錄</h3><div class="behaviorGrid">${BEHAVIORS.map(([name,d])=>`<button class="behaviorButton" data-behavior="${esc(name)}" data-value="${d}"><b>${d>0?'＋':'－'}${Math.abs(d)} 分</b><span>${name}</span></button>`).join('')}</div><p class="hint">可選個人、全班或某個實驗小組，再按加減分或常用行為。</p></section>`}
function correctionTasks(){return cls().tasks.filter(t=>t.type!=='考試')}
function correctionStatus(tid,sid){const x=taskStatus(tid,sid);if(x==='未交'||x==='未完成')return '未繳交';if(x==='已補交')return '已完成';return CORRECTION_STATUSES.includes(x)?x:'未登記'}
function setCorrectionStatus(tid,sid,value){const rec=taskResult(tid,sid);if(rec)rec.status=value;else cls().results.push({taskId:tid,sid,status:value,note:''});save()}
function correctionCards(tid){return [...students()].sort((a,b)=>a.no-b.no).map(s=>{let st=correctionStatus(tid,s.id);return `<button class="personCard correctionCard ${st==='已完成'?'done':st==='待訂正'?'needsFix':st==='未繳交'?'missing':''}" data-correct-person="${s.id}"><b>${s.no} 號 · ${esc(s.name)}</b><span>${esc(st)}</span><small>點選切換下一階段</small></button>`}).join('')}
function correctionSummary(tid){let counts=Object.fromEntries(CORRECTION_STATUSES.map(x=>[x,0]));let unregistered=0;students().forEach(s=>{let st=correctionStatus(tid,s.id);if(st==='未登記')unregistered++;else counts[st]++});return `未登記 ${unregistered} 人　｜　${CORRECTION_STATUSES.map(x=>x+' '+counts[x]+' 人').join('　｜　')}`}
function renderCorrection(){const ts=correctionTasks();if(!ts.some(t=>t.id===correctionTaskId))correctionTaskId=ts.at(-1)?.id||'';return `<section class="panel"><div class="panelHead"><h2>☑ 四階段作業訂正</h2><button class="btn small outline" data-goto="tasks">新增作業項目</button></div><p class="hint">適用正課習作及實驗後當堂書寫。流程：未繳交 → 已繳交 → 待訂正 → 已完成；未登記者不自動視為未繳交。</p><label>選擇作業 <select id="correctionTask">${ts.map(t=>`<option value="${t.id}" ${t.id===correctionTaskId?'selected':''}>${esc(t.date+' '+t.title)}</option>`).join('')}</select></label>${correctionTaskId?`<p id="correctionCounts" class="hint">${correctionSummary(correctionTaskId)}</p><div class="actions"><button class="btn small outline" id="correctionMarkMissing">將未登記者標為未繳交</button><button class="btn small outline" data-goto="board">開啟作業播放表</button></div><div class="personGrid" id="correctionPeople">${correctionCards(correctionTaskId)}</div><div class="actions"><button class="btn outline" id="exportIncomplete">下載未完成清單 CSV</button><button class="btn outline" id="copyIncomplete">複製未完成清單</button></div>`:'<div class="emptymsg">尚未建立習作或實驗項目。請先到「習作／實驗／考試」建立。</div>'}</section>`}
function incompleteEntries(tid){const t=cls().tasks.find(x=>x.id===tid);if(!t)return [];return [...students()].sort((a,b)=>a.no-b.no).filter(s=>['未繳交','待訂正'].includes(correctionStatus(tid,s.id))).map(s=>({s,st:correctionStatus(tid,s.id),t}))}
function incompleteText(tid,publicOnly=false){let a=incompleteEntries(tid);let t=cls().tasks.find(x=>x.id===tid);return `${classDisplay(cl)}｜${t?.title||'作業'}｜${t?.date||''}\n`+(a.length?a.map(x=>`${x.s.no}號${publicOnly?'':' '+x.s.name}－${x.st}`).join('\n'):'目前沒有未完成名單')}
function renderBoard(){let ts=correctionTasks();if(!ts.some(t=>t.id===correctionTaskId))correctionTaskId=ts.at(-1)?.id||'';const list=incompleteEntries(correctionTaskId);return `<section class="panel boardPanel"><div class="panelHead"><h2>📺 作業播放表 · ${esc(classDisplay(cl))}</h2><div class="actions"><select id="boardTask">${ts.map(t=>`<option value="${t.id}" ${t.id===correctionTaskId?'selected':''}>${esc(t.title)}</option>`).join('')}</select><button class="btn small outline" id="boardFullscreen">全螢幕</button><button class="btn small outline" data-goto="correction">返回訂正工具</button></div></div><p class="hint">投影版僅顯示座號與狀態，避免公開學生的個別資料。學生可提出完成申請，由老師確認後才會更新。</p><h3>待處理 ${list.length} 人</h3><div class="boardGrid">${list.map(x=>`<button class="boardPerson" data-board-person="${x.s.id}"><strong>${x.s.no} 號</strong><span>${x.st}</span></button>`).join('')||'<div class="emptymsg">太棒了！目前沒有待繳交或待訂正的座號。</div>'}</div><p class="hint">點座號 → 老師確認 → 更新為「已完成」。</p><div class="actions"><button class="btn outline" id="boardCopy">複製待處理座號</button><button class="btn outline" id="boardExport">下載報告 CSV</button></div></section>`}

":"unit4-04-03-1505000759","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"中","q":"鐵製品在潮溼的環境中，比在酸性水溶液的環境中更容易生鏽。","options":["正確（○）","錯誤（╳）"],"answer":1,"explanation":"鐵製品在酸性水溶液的環境中，比在潮溼的環境中容易生鏽。","original_id":"1505000759"},{"id":"unit4-04-03-1505000773","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"中","q":"水雖然會使鋼絲絨球生鏽，但只要再將鋼絲絨球浸醋後，就可以防止它生鏽。","options":["正確（○）","錯誤（╳）"],"answer":1,"explanation":"醋是酸性水溶液，會加速鐵與空氣中的氧氣反應，使鋼絲絨球更容易生鏽，因此將鋼絲絨球浸泡在醋中無法防止生鏽。","original_id":"1505000773"},{"id":"unit4-04-03-1505000781","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"中","q":"取2個鋼絲絨球，1個滴水、1個滴醋後，分別放入2個塑膠杯中，密封杯口，一天後，可以發現水和酸性水溶液都不會使鋼絲絨球生鏽。","options":["正確（○）","錯誤（╳）"],"answer":1,"explanation":"水和酸性水溶液都會造成鋼絲絨球生鏽。","original_id":"1505000781"},{"id":"unit4-04-03-1505000790","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"易","q":"毛豆博士的自行車放在戶外一年後，發現有些金屬零件變成棕色、粗粗的現象是鐵生鏽了。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"原始題庫未提供詳解；請參考正確答案。","original_id":"1505000790"},{"id":"unit4-04-03-1505000804","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"易","q":"爸爸用菜刀切完青菜之後，將清洗過的菜刀擦乾，可以避免菜刀生鏽。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"原始題庫未提供詳解；請參考正確答案。","original_id":"1505000804"},{"id":"unit4-04-03-1505000808","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"易","q":"鐵製品保持乾燥、隔絕水和空氣等，可以避免生鏽。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"原始題庫未提供詳解；請參考正確答案。","original_id":"1505000808"},{"id":"unit4-04-03-1505000820","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"中","q":"利用電鍍的方式，在鐵器表面鍍上一層金屬，可以防止鐵生鏽，延長鐵製品的使用年限。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"利用電鍍的方式，隔絕鐵製品與空氣和水接觸，可以延長鐵製品的使用年限。","original_id":"1505000820"},{"id":"unit4-04-03-1505000822","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"易","q":"鐵製的迴紋針表面有時會包覆一層塑膠皮，主要是為了防止生鏽。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"原始題庫未提供詳解；請參考正確答案。","original_id":"1505000822"},{"id":"unit4-04-03-1505000824","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"易","q":"鋼絲絨球在生鏽前後，外觀都沒有變化。","options":["正確（○）","錯誤（╳）"],"answer":1,"explanation":"鋼絲絨球生鏽後性質會改變，顏色變成棕色，且產生鐵鏽。","original_id":"1505000824"},{"id":"unit4-04-03-1505000827","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"易","q":"進行鐵生鏽實驗時用同一塊鋼絲絨球分成兩塊一樣大小重量的鋼絲球，目的是為了保持控制變因不變。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"原始題庫未提供詳解；請參考正確答案。","original_id":"1505000827"},{"id":"unit4-04-03-1505000829","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"中","q":"學校要在一樓教室加裝鐵製護欄，選擇表面經過電鍍處理，有鍍上一層鋁的材質，會比純鐵更容易生鏽。","options":["正確（○）","錯誤（╳）"],"answer":1,"explanation":"鍍鋁的鐵製護欄接觸到氧氣時，鋁的表面會形成一層氧化鋁薄膜，具有防護鐵製護欄生鏽的效果；所以鐵製品表面經過電鍍處理後，比純鐵材質較不容易生鏽。","original_id":"1505000829"},{"id":"unit4-04-03-1505000836","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"難","q":"只有鐵才會生鏽，其他金屬不會生鏽。","options":["正確（○）","錯誤（╳）"],"answer":1,"explanation":"鐵是最常見生鏽的金屬物質，然而其他金屬物質的表面也會因與空氣中的氧氣結合而生鏽，例如鋁也會生鏽。","original_id":"1505000836"},{"id":"unit4-04-03-1505000848","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"易","q":"瑞瑞觀察沾有水的鋼絲絨經過一段時間會產生生鏽的現象。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"原始題庫未提供詳解；請參考正確答案。","original_id":"1505000848"},{"id":"unit4-04-03-1505000863","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"中","q":"在鐵窗上塗油漆，可以防止鐵窗生鏽。","options":["正確（○）","錯誤（╳）"],"answer":0,"explanation":"油漆可以阻隔鐵窗和空氣或水接觸，因此可以防止鐵窗生鏽。","original_id":"1505000863"},{"id":"unit4-04-03-1505000870","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","difficulty":"中","q":"電鍍後的鐵製品可以防鏽又美觀，且永遠不會生鏽。","options":["正確（○）","錯誤（╳）"],"answer":1,"explanation":"電鍍只有表面薄薄一層防止生鏽，經過一段時間脫落後，鐵製品仍然有生鏽的可能。","original_id":"1505000870"},{"id":"unit4-04-03-1505000874","unit":"04","activity":"03","source":"04-03 活動3 為何會生鏽與如何防鏽","dif let questionBank=[],bankBusy=false,bankMessage='已內建第一、第二、第四單元，正在讀取第三單元',bankCloudNotice='',gameUnit='',gameActivity='',gameGrade='',gameSemester='',currentQuestion=null,gameAnswered=false,lastQuestionIds={},bankRequestVersion=0;
const field=(r,...keys)=>{for(const k of keys){const v=r?.[k];if(v!==undefined&&v!==null&&String(v)!=='')return v}return null};
function parseOptions(v,r){
 if(Array.isArray(v))return v.map(x=>typeof x==='object'&&x!==null?String(field(x,'text','label','value','option')??''):String(x));
 if(typeof v==='string'){
   try{const x=JSON.parse(v);if(Array.isArray(x))return parseOptions(x,r);if(x&&typeof x==='object')return Object.values(x).map(String)}catch(_){}
   if(v.includes('|'))return v.split('|').map(x=>x.trim());
 }
 return ['option_a','option_b','option_c','option_d'].map((x,i)=>field(r,x,['a','b','c','d'][i],['choice_a','choice_b','choice_c','choice_d'][i])).filter(x=>x!==null).map(String);
}
function decodeUnitActivity(r){
 const parts=[field(r,'source','source_name'),field(r,'unit','unit_name','unit_title','unit_id','chapter','chapter_name','chapter_id','category','category_name','subject','lesson','domain'),field(r,'subunit','sub_unit','unit_code','activity','activity_code','activity_no','activity_id','section','section_code','lesson_code','topic')].filter(x=>x!==null).map(String);
 let no='',activity='';
 const text=parts.join(' | ');
 const textNormalized=text.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296));
 for(const p of parts){
   const m=p.match(/(?:^|[^0-9])0?([1-4])\s*[-_.／/]\s*0?([1-3])(?:[^0-9]|$)/);
   if(m){no=m[1].padStart(2,'0');activity=m[2].padStart(2,'0');break}
 }
 if(!no){
   const m=textNormalized.match(/第?\s*([一二三四1-4])\s*(?:單元|單元活動|章)/) || textNormalized.match(/(?:^|[^0-9])0?([1-4])(?:[^0-9]|$)/) || textNormalized.match(/(?:unit|chapter|u)\s*[-:_ ]*([1-4])(?:\D|$)/i);
   if(m){const lut={一:1,二:2,三:3,四:4};no=String(lut[m[1]]||m[1]).padStart(2,'0')}
 }
 if(!no){if(/天空|星座|天文|太陽|月亮/.test(text))no='03';else if(/燃燒|生鏽|氧氣|防鏽/.test(text))no='04'}
 if(!activity){
   const separate=String(field(r,'activity','activity_code','activity_no','activity_id','subunit','sub_unit','section','section_code')??'');
   const m=separate.match(/(?:活動|activity|section|^)[\s:：_#-]*0?([1-3])(?:\D|$)/i)||text.match(/活動\s*([一二三1-3])/);
   if(m){const lut={一:1,二:2,三:3};activity=String(lut[m[1]]||m[1]).padStart(2,'0')}
 }
 return {no,activity};
}
function normalizeQuestion(r,i){
 let text=field(r,'question','question_text','question_content','question_title','prompt','question_body','question_stem','questionText','questionContent','questionTitle','title','content','stem','text','body','q','題目','題幹');
 if(text===null){const name=Object.keys(r||{}).find(k=>/question|prompt|stem|題目|題幹/i.test(k)&&typeof r[k]==='string'&&r[k].trim());if(name)text=r[name]}
 if(text===null){const excluded=/^(id|uuid|options|choices|answers|option_list|answer|correct.*|explanation|explain|analysis|solution|reason|description|unit.*|chapter.*|category|topic|subject|lesson|domain|created.*|updated.*|difficulty|image.*|source.*|tags?|type|order.*)$/i;const possible=Object.entries(r||{}).filter(([k,v])=>!excluded.test(k)&&typeof v==='string'&&v.trim().length>=12);if(possible.length===1)text=possible[0][1]}
 const options=parseOptions(field(r,'options','choices','answers','option_list'),r);
 let ans=field(r,'correct_answer','correct_option','correct','answer','answer_index','correct_index','correctOptionId','correctAnswer');
 if(Array.isArray(ans)&&ans.length===1)ans=ans[0];
 if(typeof ans==='string'&&ans.trim().startsWith('[')){try{const a=JSON.parse(ans);if(a.length===1)ans=a[0]}catch(_){}}
 let answerIndex=-1;
 if(typeof ans==='number')answerIndex=ans>=0&&ans<options.length?ans:(ans===options.length?ans-1:-1);
 else if(typeof ans==='string'){const t=ans.trim();if(/^[A-Da-d]$/.test(t))answerIndex=t.toUpperCase().charCodeAt(0)-65;else if(/^\d+$/.test(t)){const n=Number(t);answerIndex=n>=0&&n<options.length?n:(n===options.length?n-1:-1)}else answerIndex=options.findIndex(x=>x.trim()===t)}
 const code=decodeUnitActivity(r);
 const found=SCIENCE_QUIZ_UNITS.find(x=>x.no===code.no);
 if(!found||!text||options.length<2||answerIndex<0||answerIndex>=options.length)return null;
 const grade=String(field(r,'grade','grade_level','year_level','school_grade','年級')??'').trim();
 const semester=String(field(r,'semester','term','school_term','學期')??'').trim();
 const explanation=String(field(r,'explanation','explain','analysis','solution','reason','answer_explanation','description')??'原題庫未提供詳解。');
 return {id:String(field(r,'id','question_id','qid')??i),text:String(text),options,answerIndex,unit:found.name,unitNo:code.no,activity:code.activity,grade,semester,explanation};
}

function taipeiNowParts(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());return Object.fromEntries(p.map(x=>[x.type,x.value]));}
function nowTaipeiMs(){const p=taipeiNowParts();return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second);}
function todayTaipei(){let p=taipeiNowParts();return `${p.year}-${p.month}-${p.day}`;}
function safeTime(s){return /^([01]\d|2[0-3]):[0-5]\d$/.test(s||'')?s:null;}
const CLASS_PERIODS=[['08:50','09:30'],['09:40','10:20'],['10:35','11:15'],['11:25','12:05'],['13:20','14:00'],['14:10','14:50'],['15:00','15:40']];
function clockSeconds(t){const x=t.split(':').map(Number);return x[0]*3600+x[1]*60;}
function nearestClassEnd(){const p=taipeiNowParts(),now=(+p.hour%24)*3600+(+p.minute)*60+(+p.second);const hit=CLASS_PERIODS.find(x=>now>=clockSeconds(x[0])&&now<clockSeconds(x[1]));return hit?hit[1]:'';}
function classClockState(now){for(let i=0;i<CLASS_PERIODS.length;i++){const [begin,end]=CLASS_PERIODS[i],b=clockSeconds(begin),e=clockSeconds(end);if(now>=b&&now<e)return {label:`第 ${i+1} 節上課中`,seconds:e-now,mode:'class'};if(now<b)return {label:i===0?'尚未上課':i===4?'午休時間':'課間休息',seconds:b-now,mode:'break'};}return {label:'今日課程已結束',seconds:0,mode:'ended'};}
function showWallClock(){const el=$('wallClock');if(!el)return;const p=taipeiNowParts();el.textContent=`${p.hour}:${p.minute}:${p.second}`;const remaining=$('classRemain');if(!remaining)return;const now=(+p.hour%24)*3600+(+p.minute)*60+(+p.second);const selected=$('classEnd')?.value||'';const target=safeTime(selected);let state;
 if(target){const left=clockSeconds(target)-now;state=left>0?{label:'手動指定下課時間',seconds:left,mode:'class'}:{label:'指定時間已結束',seconds:0,mode:'ended'};}
 else state=classClockState(now);
 const info=$('classClockStatus');if(info)info.textContent=state.label;
 remaining.textContent=state.mode==='ended'?'—':`${state.mode==='break'?'距下節上課 ':'本節剩餘 '}${toMMSS(state.seconds)}`;
}
